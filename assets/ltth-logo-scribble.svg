<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" role="img" aria-labelledby="title desc">
  <title id="title">ltth.app chalk doodle logo</title>
  <desc id="desc">A dark chalkboard-style LTTH logo with a sketched PupCid mascot, rainbow frame, playful sparks, and hand-drawn lettering.</desc>
  <defs>
    <linearGradient id="rainbow" x1="56" y1="188" x2="444" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7043"/>
      <stop offset="0.2" stop-color="#ffca28"/>
      <stop offset="0.42" stop-color="#42ff73"/>
      <stop offset="0.62" stop-color="#29b6f6"/>
      <stop offset="0.82" stop-color="#7a1cd6"/>
      <stop offset="1" stop-color="#ef5350"/>
    </linearGradient>
    <filter id="chalk-soft" x="-8%" y="-18%" width="116%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.25"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="13" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

  <rect width="512" height="256" rx="34" fill="#0e0f10"/>
  <path d="M39 52 C111 22, 224 22, 330 32 C407 39, 461 62, 478 97 C493 130, 475 174, 425 199 C344 240, 155 234, 70 206 C24 191, 15 157, 25 118 C31 91, 21 69, 39 52 Z" fill="#151719" opacity="0.9" filter="url(#paper)"/>

  <!-- chalk smudges -->
  <g fill="none" stroke="#f5f7f4" stroke-linecap="round" opacity="0.08">
    <path d="M44 61 C113 37, 198 38, 282 44" stroke-width="2"/>
    <path d="M38 191 C103 211, 216 218, 323 211" stroke-width="3"/>
    <path d="M338 54 C397 62, 445 83, 470 116" stroke-width="2"/>
    <path d="M58 132 C163 112, 274 117, 421 138" stroke-width="1.7"/>
    <path d="M83 226 C184 239, 331 230, 431 201" stroke-width="1.4"/>
  </g>

  <g filter="url(#chalk-soft)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- mascot tile -->
    <rect x="58" y="54" width="143" height="143" rx="24" stroke="url(#rainbow)" stroke-width="7"/>
    <path d="M64 63 C92 51, 155 48, 194 63" stroke="#f5f7f4" stroke-width="2.3" opacity="0.32"/>
    <path d="M64 188 C91 199, 164 201, 194 184" stroke="#f5f7f4" stroke-width="2" opacity="0.24"/>

    <!-- quick PupCid sketch -->
    <path d="M87 126 C81 101, 91 82, 109 72 C124 64, 151 66, 167 82 C181 96, 182 124, 169 143 C154 166, 113 169, 95 148 C90 142, 88 134, 87 126 Z" stroke="#f5f7f4" stroke-width="5" opacity="0.83"/>
    <path d="M99 82 L86 48 L122 76" stroke="#f5f7f4" stroke-width="5" opacity="0.78"/>
    <path d="M157 77 L190 51 L177 92" stroke="#f5f7f4" stroke-width="5" opacity="0.78"/>
    <path d="M96 57 L108 78 M180 60 L163 79" stroke="#d8ddd6" stroke-width="2.5" opacity="0.5"/>
    <path d="M109 105 C114 100, 124 101, 127 107" stroke="#f5f7f4" stroke-width="3" opacity="0.72"/>
    <path d="M142 106 C147 100, 157 101, 160 108" stroke="#f5f7f4" stroke-width="3" opacity="0.72"/>
    <path d="M115 116 C120 111, 127 113, 128 120" stroke="#29b6f6" stroke-width="5" opacity="0.9"/>
    <path d="M147 116 C152 111, 159 113, 160 120" stroke="#29b6f6" stroke-width="5" opacity="0.9"/>
    <path d="M123 116 L123 122 M155 116 L155 122" stroke="#071018" stroke-width="2.4" opacity="0.92"/>
    <path d="M132 129 C138 126, 143 127, 146 130 C142 136, 136 136, 132 129 Z" fill="#05080a" stroke="#e4e7e1" stroke-width="2.4" opacity="0.95"/>
    <path d="M113 139 C122 151, 153 152, 164 138" stroke="#f5f7f4" stroke-width="4" opacity="0.78"/>
    <path d="M117 145 C130 154, 150 153, 160 144" stroke="#0e0f10" stroke-width="2.3" opacity="0.65"/>
    <path d="M91 129 L73 124 M91 137 L73 140 M174 130 L191 124 M173 137 L190 141" stroke="#f5f7f4" stroke-width="2" opacity="0.42"/>
    <path d="M116 77 L126 52 L128 74 L141 51 L139 78 L155 68 L146 88" stroke="#42ff73" stroke-width="5.4" opacity="0.78"/>
    <path d="M111 82 L123 68 L124 87 L138 67 L136 88 L149 80" stroke="#12a116" stroke-width="3.1" opacity="0.9"/>
    <path d="M100 151 C112 169, 151 171, 168 151" stroke="#d8ddd6" stroke-width="4.2" opacity="0.5"/>

    <!-- lettering -->
    <path d="M243 83 L226 158 L276 154" stroke="#f5f7f4" stroke-width="14" opacity="0.9"/>
    <path d="M285 82 L350 80" stroke="#f5f7f4" stroke-width="13" opacity="0.9"/>
    <path d="M318 82 L302 158" stroke="#f5f7f4" stroke-width="13" opacity="0.9"/>
    <path d="M357 82 L423 80" stroke="#f5f7f4" stroke-width="13" opacity="0.9"/>
    <path d="M390 82 L374 158" stroke="#f5f7f4" stroke-width="13" opacity="0.9"/>
    <path d="M429 83 L421 158 M471 84 L462 159 M425 120 L468 117" stroke="#f5f7f4" stroke-width="13" opacity="0.9"/>
    <path d="M238 160 C285 166, 354 165, 471 158" stroke="#f5f7f4" stroke-width="2.3" opacity="0.35"/>

    <!-- rainbow streak -->
    <path d="M240 179 C303 166, 380 169, 474 181" stroke="#ffca28" stroke-width="5" opacity="0.92"/>
    <path d="M249 190 C315 178, 391 181, 466 192" stroke="#42ff73" stroke-width="5" opacity="0.92"/>
    <path d="M258 201 C322 191, 396 193, 455 203" stroke="#29b6f6" stroke-width="5" opacity="0.9"/>
    <path d="M402 179 C431 179, 454 180, 474 181" stroke="#ef5350" stroke-width="5" opacity="0.86"/>
  </g>

  <!-- tiny chalk sparks -->
  <g fill="none" stroke-linecap="round" filter="url(#chalk-soft)">
    <path d="M222 53 L222 70 M213 61 L231 61" stroke="#ffca28" stroke-width="4" opacity="0.9"/>
    <path d="M210 171 L210 184 M203 178 L217 178" stroke="#ffca28" stroke-width="3" opacity="0.85"/>
    <path d="M468 58 L468 74 M460 66 L477 66" stroke="#29b6f6" stroke-width="3" opacity="0.82"/>
    <path d="M34 139 L34 153 M27 146 L42 146" stroke="#42ff73" stroke-width="3" opacity="0.82"/>
    <circle cx="248" cy="48" r="2.6" fill="#ef5350" opacity="0.8"/>
    <circle cx="279" cy="40" r="2" fill="#ffca28" opacity="0.8"/>
    <circle cx="408" cy="61" r="2.2" fill="#42ff73" opacity="0.75"/>
    <circle cx="450" cy="177" r="2" fill="#7a1cd6" opacity="0.8"/>
  </g>
</svg>
