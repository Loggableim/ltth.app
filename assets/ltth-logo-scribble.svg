<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">ltth.app scribble logo</title>
  <desc id="desc">A dark, hand-drawn marker-style PupCid mascot head with green hair, blue eyes, and LTTH lettering.</desc>
  <defs>
    <linearGradient id="rim" x1="18" y1="110" x2="112" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12a116"/>
      <stop offset="0.42" stop-color="#42ff73"/>
      <stop offset="0.72" stop-color="#7a1cd6"/>
      <stop offset="1" stop-color="#6412a1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="#0e0f10"/>
  <rect x="10" y="10" width="108" height="108" rx="24" fill="none" stroke="url(#rim)" stroke-width="3" opacity=".9"/>
  <path d="M20 103 C43 111, 82 111, 108 101" fill="none" stroke="#141619" stroke-width="9" stroke-linecap="round" opacity=".8"/>

  <g filter="url(#soft)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- fast marker silhouette -->
    <path d="M31 69 C25 55, 31 41, 44 34 C54 27, 72 27, 84 36 C96 45, 100 60, 94 73 C87 91, 65 99, 47 91 C39 87, 34 80, 31 69 Z" stroke="#d8ddd6" stroke-width="5.2" opacity=".76"/>
    <path d="M36 42 L26 18 L48 35" stroke="#d8ddd6" stroke-width="5.2" opacity=".72"/>
    <path d="M81 36 L103 19 L93 48" stroke="#d8ddd6" stroke-width="5.2" opacity=".72"/>
    <path d="M31 23 L41 38" stroke="#f5f7f4" stroke-width="2.5" opacity=".48"/>
    <path d="M98 25 L86 39" stroke="#f5f7f4" stroke-width="2.5" opacity=".48"/>

    <!-- rough face marks -->
    <path d="M45 52 C50 47, 57 47, 61 52" stroke="#f5f7f4" stroke-width="3.4" opacity=".68"/>
    <path d="M69 52 C74 47, 81 48, 84 54" stroke="#f5f7f4" stroke-width="3.4" opacity=".68"/>
    <path d="M47 63 C51 59, 57 60, 59 65" stroke="#2f9dff" stroke-width="5" opacity=".88"/>
    <path d="M72 64 C75 59, 82 60, 84 66" stroke="#2f9dff" stroke-width="5" opacity=".88"/>
    <path d="M52 63 L52 69" stroke="#071018" stroke-width="2.5" opacity=".9"/>
    <path d="M78 64 L78 70" stroke="#071018" stroke-width="2.5" opacity=".9"/>
    <path d="M60 73 C64 70, 69 70, 72 73 C69 78, 63 78, 60 73 Z" fill="#05080a" stroke="#cdd2cc" stroke-width="2" opacity=".86"/>
    <path d="M50 79 C58 88, 76 88, 84 79" stroke="#f5f7f4" stroke-width="4" opacity=".72"/>
    <path d="M56 83 C61 86, 70 87, 76 83" stroke="#0e0f10" stroke-width="2.2" opacity=".75"/>
    <path d="M35 71 L21 67 M36 78 L22 80 M91 71 L106 67 M90 78 L105 81" stroke="#cfd4ce" stroke-width="2.1" opacity=".42"/>

    <!-- green PupCid hair scribble -->
    <path d="M52 36 L61 20 L63 35 L74 21 L72 38 L86 31 L75 45" stroke="#42ff73" stroke-width="5" opacity=".72"/>
    <path d="M48 38 L58 29 L58 42 L69 30 L68 44 L78 39" stroke="#12a116" stroke-width="3" opacity=".86"/>

    <!-- hoodie hint -->
    <path d="M37 89 C44 99, 57 104, 65 104 C76 103, 88 96, 93 88" stroke="#d8ddd6" stroke-width="4.4" opacity=".54"/>
    <path d="M43 96 L41 110 M85 96 L87 110" stroke="#d8ddd6" stroke-width="2.7" opacity=".45"/>
  </g>

  <g font-family="Inter, SF Pro Display, Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="1.4" text-anchor="middle">
    <text x="64" y="114" fill="#f5f7f4" opacity=".9">LTTH</text>
    <text x="65" y="114" fill="#42ff73" opacity=".22">LTTH</text>
  </g>
</svg>
