name: Build Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - 'launcher-v*'
      - 'launcher-beta-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build launcher binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect launcher channel
        id: channel
        if: startsWith(github.ref, 'refs/tags/launcher-')
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/launcher-beta-v* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/launcher-')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == launcher-beta-v* ]]; then
            VERSION="${TAG#launcher-beta-v}"
          else
            VERSION="${TAG#launcher-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '~1.21'

      - name: Build Windows GUI launcher
        working-directory: ./build-src
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-H windowsgui -s -w" -o ../launcher.exe launcher-gui.go

      - name: Build Windows console launcher
        working-directory: ./build-src
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../launcher-console.exe launcher.go

      - name: Build Windows dev launcher
        working-directory: ./build-src
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dev_launcher.exe dev-launcher.go

      - name: Build Windows thin bootstrapper
        working-directory: ./build-src
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-H windowsgui -s -w" -o ../ltth-bootstrapper.exe bootstrapper.go

      - name: Write launcher release metadata
        if: startsWith(github.ref, 'refs/tags/launcher-')
        shell: bash
        run: |
          cat > launcher-release.json <<EOF
          {
            "component": "launcher.exe",
            "channel": "${{ steps.channel.outputs.channel }}",
            "version": "v${{ steps.version.outputs.version }}",
            "tag": "${GITHUB_REF_NAME}"
          }
          EOF

      - name: Upload launchers
        uses: actions/upload-artifact@v4
        with:
          name: launchers-windows
          path: |
            launcher.exe
            launcher-console.exe
            dev_launcher.exe
            ltth-bootstrapper.exe

      - name: Create release for launcher tag
        if: startsWith(github.ref, 'refs/tags/launcher-')
        uses: softprops/action-gh-release@v1
        with:
          name: Launcher ${{ steps.channel.outputs.channel }} release v${{ steps.version.outputs.version }}
          body: |
            Launcher channel: `${{ steps.channel.outputs.channel }}`
            Version: `v${{ steps.version.outputs.version }}`
          files: |
            launcher.exe
            launcher-console.exe
            dev_launcher.exe
            ltth-bootstrapper.exe
            launcher-release.json
          draft: false
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
