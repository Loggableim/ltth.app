name: Build Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - 'launcher-v*'
      - 'launcher-beta-v*'

permissions:
  contents: write

jobs:
  build:
    name: Validate launcher asset
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect launcher channel
        id: channel
        if: startsWith(github.ref, 'refs/tags/launcher-')
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/launcher-beta-v* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/launcher-')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == launcher-beta-v* ]]; then
            VERSION="${TAG#launcher-beta-v}"
          else
            VERSION="${TAG#launcher-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify signed launcher asset
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path launcher.exe)) {
            throw 'Missing launcher.exe in repository root.'
          }
          $signature = Get-AuthenticodeSignature launcher.exe
          if ($signature.Status -ne 'Valid') {
            throw "launcher.exe is not signed correctly: $($signature.StatusMessage)"
          }

      - name: Write launcher release metadata
        shell: bash
        run: |
          cat > launcher-release.json <<EOF
          {
            "component": "launcher.exe",
            "channel": "${{ steps.channel.outputs.channel }}",
            "version": "v${{ steps.version.outputs.version }}",
            "tag": "${GITHUB_REF_NAME}"
          }
          EOF

      - name: Upload launchers
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: launcher.exe

      - name: Create release for launcher tag
        if: startsWith(github.ref, 'refs/tags/launcher-')
        uses: softprops/action-gh-release@v1
        with:
          name: Launcher ${{ steps.channel.outputs.channel }} release v${{ steps.version.outputs.version }}
          body: |
            Launcher channel: `${{ steps.channel.outputs.channel }}`
            Version: `v${{ steps.version.outputs.version }}`
          files: |
            launcher.exe
            launcher-release.json
          draft: false
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
