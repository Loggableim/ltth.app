name: Build Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - 'launcher-v*'
      - 'launcher-beta-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build launcher binaries
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect launcher channel
        id: channel
        if: startsWith(github.ref, 'refs/tags/launcher-')
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/launcher-beta-v* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/launcher-')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == launcher-beta-v* ]]; then
            VERSION="${TAG#launcher-beta-v}"
          else
            VERSION="${TAG#launcher-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '~1.24'

      - name: Build Windows GUI launcher
        working-directory: ./build-src
        shell: bash
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-H windowsgui -s -w" -o ../launcher.exe launcher-gui.go sysproc_windows.go

      - name: Ensure Windows signing certificate is configured
        if: startsWith(github.ref, 'refs/tags/launcher-') && (secrets.WINDOWS_SIGN_CERT_BASE64 == '' || secrets.WINDOWS_SIGN_CERT_PASSWORD == '')
        shell: bash
        run: |
          echo "Windows signing certificate secrets are required for launcher release tags." >&2
          exit 1

      - name: Import Windows signing certificate
        if: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 != '' && secrets.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $certPath = Join-Path $env:RUNNER_TEMP 'ltth-signing-cert.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String('${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}'))
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString '${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}' -AsPlainText -Force) | Out-Null

      - name: Sign Windows launcher artifacts
        if: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 != '' && secrets.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            throw 'signtool.exe not found on runner.'
          }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /a launcher.exe

      - name: Write launcher release metadata
        shell: bash
        run: |
          cat > launcher-release.json <<EOF
          {
            "component": "launcher.exe",
            "channel": "${{ steps.channel.outputs.channel }}",
            "version": "v${{ steps.version.outputs.version }}",
            "tag": "${GITHUB_REF_NAME}"
          }
          EOF

      - name: Upload launchers
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          path: launcher.exe

      - name: Create release for launcher tag
        if: startsWith(github.ref, 'refs/tags/launcher-')
        uses: softprops/action-gh-release@v1
        with:
          name: Launcher ${{ steps.channel.outputs.channel }} release v${{ steps.version.outputs.version }}
          body: |
            Launcher channel: `${{ steps.channel.outputs.channel }}`
            Version: `v${{ steps.version.outputs.version }}`
          files: |
            launcher.exe
            launcher-release.json
          draft: false
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
