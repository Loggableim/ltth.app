name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '.nojekyll'
      - 'CNAME'
      - 'assets/**'
      - 'auth/**'
      - 'css/**'
      - 'app/config/plugin-release-policy.json'
      - 'app/CURRENT_RELEASE.json'
      - 'app/CURRENT_VERSION.txt'
      - 'downloads/**'
      - 'docs/**'
      - 'features/**'
      - 'install.js'
      - 'install.ps1'
      - 'install.sh'
      - 'install/**'
      - 'js/**'
      - 'locales/**'
      - 'manifest.json'
      - 'plugin-store.json'
      - 'plugin-store/packages/**'
      - 'robots.txt'
      - 'screenshots/**'
      - 'scripts/build_pages_bundle.py'
      - 'scripts/fetch_release_assets_fallback.py'
      - 'scripts/public-plugin-allowlist.json'
      - 'scripts/resolve_pages_release_run.py'
      - 'scripts/verify_pages_release_payload.py'
      - 'sitemap.xml'
      - 'streammonsters/**'
      - 'uninstall.ps1'
      - 'uninstall.sh'
      - 'version.json'
      - '.github/workflows/pages.yml'
      - '.github/workflows/release.yml'
  workflow_run:
    workflows:
      - Create GitHub Release
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify release artifact and build website
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out the website commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Resolve the matching successful release artifact
        id: release_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_EVENT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          RELEASE_EVENT_COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          RELEASE_EVENT_HEAD_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
          RELEASE_EVENT_HEAD_REPOSITORY: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name || '' }}
          RELEASE_EVENT_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || '' }}
          RELEASE_EVENT_TYPE: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || '' }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("version.json"))["downloadVersion"])')"
          TAG="v$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$RELEASE_EVENT_CONCLUSION" != "success" || "$RELEASE_EVENT_TYPE" != "push" || "$RELEASE_EVENT_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" || "$RELEASE_EVENT_HEAD_BRANCH" != "$TAG" ]]; then
              echo "Release workflow run is not a successful same-repository run for $TAG." >&2
              exit 1
            fi
            if [[ ! "$RELEASE_EVENT_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$RELEASE_EVENT_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Release workflow run ID or commit SHA is malformed." >&2
              exit 1
            fi
            printf 'run_id=%s\ncommit_sha=%s\ntag=%s\n' "$RELEASE_EVENT_RUN_ID" "${RELEASE_EVENT_COMMIT_SHA,,}" "$TAG" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/resolve_pages_release_run.py --repository "$GITHUB_REPOSITORY" --tag "$TAG"
          fi

      - name: Download runtime artifact from the exact release workflow run
        id: release_artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: app-release-assets
          path: ${{ runner.temp }}/app-release-assets
          repository: ${{ github.repository }}
          run-id: ${{ steps.release_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch exact-tag release assets if the Actions artifact expired
        if: steps.release_artifact.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ steps.release_run.outputs.commit_sha }}
          RELEASE_TAG: ${{ steps.release_run.outputs.tag }}
        run: >-
          python3 scripts/fetch_release_assets_fallback.py
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --version-file version.json
          --expected-release-commit-sha "$RELEASE_COMMIT_SHA"
          --output-dir "$RUNNER_TEMP/app-release-assets"

      - name: Verify release provenance and stage exact runtime bytes
        env:
          RELEASE_COMMIT_SHA: ${{ steps.release_run.outputs.commit_sha }}
        run: >-
          python3 scripts/verify_pages_release_payload.py verify-artifact
          --artifact-dir "$RUNNER_TEMP/app-release-assets"
          --version-file version.json
          --destination app/ltth_latest.zip
          --expected-release-commit-sha "$RELEASE_COMMIT_SHA"

      - name: Build website bundle
        run: python3 scripts/build_pages_bundle.py --output "$RUNNER_TEMP/pages-site"

      - name: Require full publication pass for the staged Pages bundle
        env:
          RELEASE_COMMIT_SHA: ${{ steps.release_run.outputs.commit_sha }}
        run: >-
          python3 scripts/verify_pages_release_payload.py verify-pages-site
          --site-dir "$RUNNER_TEMP/pages-site"
          --version-file version.json
          --manifest "$RUNNER_TEMP/app-release-assets/ltth_latest.json"
          --expected-release-commit-sha "$RELEASE_COMMIT_SHA"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    name: Deploy verified website to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        name: Deploy Pages artifact
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          timeout: 1200000
