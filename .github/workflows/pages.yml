name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '.nojekyll'
      - 'CNAME'
      - 'assets/**'
      - 'auth/**'
      - 'css/**'
      - 'app/**'
      - 'downloads/**'
      - 'docs/**'
      - 'features/**'
      - 'install.js'
      - 'install.ps1'
      - 'install.sh'
      - 'install/**'
      - 'js/**'
      - 'locales/**'
      - 'oauth/**'
      - 'manifest.json'
      - 'plugin-store.json'
      - 'plugin-store/packages/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/build_pages_bundle.py'
      - 'sw.js'
      - 'uninstall.ps1'
      - 'uninstall.sh'
      - 'version.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build website bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build website bundle
        run: python3 scripts/build_pages_bundle.py --output "$RUNNER_TEMP/pages-site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000
