name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '.nojekyll'
      - 'CNAME'
      - 'assets/**'
      - 'auth/**'
      - 'css/**'
      - 'app/**'
      - 'downloads/**'
      - 'docs/**'
      - 'features/**'
      - 'install.js'
      - 'install.ps1'
      - 'install.sh'
      - 'install/**'
      - 'js/**'
      - 'locales/**'
      - 'oauth/**'
      - 'manifest.json'
      - 'plugin-store.json'
      - 'plugin-store/packages/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/build_pages_bundle.py'
      - 'sw.js'
      - 'streammonsters/**'
      - 'uninstall.ps1'
      - 'uninstall.sh'
      - 'version.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build website bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Fetch version-matched app download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("version.json"))["downloadVersion"])')
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern ltth_latest.zip --pattern ltth_latest.json --dir "$RUNNER_TEMP/verified-download"
          python3 - "$RUNNER_TEMP/verified-download" <<'PY'
          import hashlib, json, pathlib, shutil, sys
          directory = pathlib.Path(sys.argv[1])
          manifest = json.loads((directory / 'ltth_latest.json').read_text())
          version = json.loads(pathlib.Path('version.json').read_text())['downloadVersion']
          archive = directory / 'ltth_latest.zip'
          if (manifest.get('version') != version or manifest.get('tag') != 'v' + version
              or manifest.get('component') != 'ltth_latest.zip'
              or manifest.get('bytes') != archive.stat().st_size
              or manifest.get('sha256') != hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()):
              raise SystemExit('Release download metadata/hash mismatch')
          shutil.copyfile(archive, 'app/ltth_latest.zip')
          PY

      - name: Build website bundle
        run: python3 scripts/build_pages_bundle.py --output "$RUNNER_TEMP/pages-site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000
