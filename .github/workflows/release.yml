name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
jobs:
  build_windows_release_assets:
    name: Build Windows launcher asset
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.10'

      - name: Build Windows launcher
        working-directory: ./build-src
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-H windowsgui -s -w" -o ../launcher.exe launcher-gui.go sysproc_windows.go

      - name: Ensure Windows signing certificate is configured
        if: ${{ startsWith(github.ref, 'refs/tags/v') && (secrets.WINDOWS_SIGN_CERT_BASE64 == '' || secrets.WINDOWS_SIGN_CERT_PASSWORD == '') }}
        shell: bash
        run: |
          echo "Windows signing certificate secrets are required for release tags." >&2
          exit 1

      - name: Import Windows signing certificate
        if: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 != '' && secrets.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $certPath = Join-Path $env:RUNNER_TEMP 'ltth-signing-cert.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String('${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}'))
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString '${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}' -AsPlainText -Force) | Out-Null

      - name: Sign Windows launcher artifacts
        if: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 != '' && secrets.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            throw 'signtool.exe not found on runner.'
          }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /a launcher.exe

      - name: Write launcher release metadata
        shell: bash
        run: |
          cat > launcher-release.json <<EOF
          {
            "component": "launcher.exe",
            "version": "v${{ steps.version.outputs.version }}",
            "tag": "${GITHUB_REF_NAME}"
          }
          EOF

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            launcher.exe
            launcher-release.json

  publish_site_bundle:
    name: Publish site bundle
    runs-on: ubuntu-latest
    needs: build_windows_release_assets

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download signed launcher artifact
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: launcher-assets

      - name: Publish launcher download
        shell: bash
        run: |
          cp launcher-assets/launcher.exe launcher.exe
          mkdir -p downloads
          cp launcher-assets/launcher.exe downloads/launcher.exe

      - name: Build release bundle
        run: |
          python scripts/build_release_bundle.py --version "${{ steps.version.outputs.VERSION }}"

      - name: Run release automation
        run: |
          python scripts/release_from_new_patch.py

      - name: Commit and push site bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A app released_patches new_patch launcher.exe downloads/launcher.exe
          if git diff --cached --quiet; then
            echo "No site bundle changes to publish."
            exit 0
          fi
          git commit -m "Publish LTTH v${{ steps.version.outputs.VERSION }} site bundle"
          git push origin HEAD:main

  publish_release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build_windows_release_assets, publish_site_bundle]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          CHANGELOG=$(awk "/## \[$VERSION\]/,/## \[/{if(/## \[/ && !/## \[$VERSION\]/)exit;print}" CHANGELOG.md | sed '1d')
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          echo "$CHANGELOG" > release-notes.md

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Stable release v${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          files: |
            launcher.exe
            launcher-release.json
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release created successfully
        run: |
          echo "Stable release v${{ steps.version.outputs.VERSION }} published with launcher.exe."
