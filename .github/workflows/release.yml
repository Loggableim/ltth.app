name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate_release:
    name: Validate immutable release contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate exact main tag and release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use exact vX.Y.Z numeric form: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$MAIN_SHA" ]]; then
            echo "Release tag commit $GITHUB_SHA must equal current origin/main $MAIN_SHA." >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/build_release_bundle.py \
            --version "$VERSION" \
            --validate-release-metadata

  build_windows_release_assets:
    name: Validate Windows launcher asset
    runs-on: windows-latest
    needs: validate_release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify signed launcher asset
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path launcher.exe)) {
            throw 'Missing launcher.exe in repository root.'
          }
          $signature = Get-AuthenticodeSignature launcher.exe
          if ($signature.Status -ne 'Valid') {
            throw "launcher.exe is not signed correctly: $($signature.StatusMessage)"
          }

      - name: Write launcher release metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = Get-Item -LiteralPath launcher.exe
          $sha256 = (Get-FileHash -LiteralPath launcher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @"
          {
            "schema": 1,
            "component": "launcher.exe",
            "version": "${{ steps.version.outputs.version }}",
            "tag": "$env:GITHUB_REF_NAME",
            "commitSha": "$env:GITHUB_SHA",
            "bytes": $($launcher.Length),
            "sha256": "$sha256"
          }
          "@
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'launcher-release.json'),
            ($manifest + [Environment]::NewLine),
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            launcher.exe
            launcher-release.json

  build_app_release_asset:
    name: Build immutable app release asset
    runs-on: ubuntu-latest
    needs: validate_release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build deterministic app release assets
        run: |
          python scripts/build_release_bundle.py \
            --version "${{ steps.version.outputs.VERSION }}" \
            --release-assets-dir "$RUNNER_TEMP/app-release-assets" \
            --commit-sha "$GITHUB_SHA"

      - name: Upload app release assets
        uses: actions/upload-artifact@v4
        with:
          name: app-release-assets
          path: |
            ${{ runner.temp }}/app-release-assets/ltth_latest.zip
            ${{ runner.temp }}/app-release-assets/ltth_latest.json
          compression-level: 0

  publish_release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build_windows_release_assets, build_app_release_asset]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          CHANGELOG=$(awk "/## \[$VERSION\]/,/## \[/{if(/## \[/ && !/## \[$VERSION\]/)exit;print}" CHANGELOG.md | sed '1d')
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          echo "$CHANGELOG" > release-notes.md

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: .

      - name: Download app release assets
        uses: actions/download-artifact@v4
        with:
          name: app-release-assets
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Stable release v${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          files: |
            launcher.exe
            launcher-release.json
            ltth_latest.zip
            ltth_latest.json
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release created successfully
        run: |
          echo "Stable release v${{ steps.version.outputs.VERSION }} published with immutable launcher and app assets."
