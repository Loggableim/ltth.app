name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate_release:
    name: Validate immutable release contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full tag history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Validate exact main tag and release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use exact vX.Y.Z numeric form: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$MAIN_SHA" ]]; then
            echo "Release tag commit $GITHUB_SHA must equal current origin/main $MAIN_SHA." >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/build_release_bundle.py \
            --version "$VERSION" \
            --validate-release-metadata

  build_windows_release_assets:
    name: Build and validate Windows launcher
    runs-on: windows-latest
    needs: validate_release

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Go 1.24.10
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.10'
          cache-dependency-path: build-src/go.sum

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build launcher from source
        working-directory: build-src
        shell: powershell
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
          GOFLAGS: '-mod=readonly'
        run: |
          $ErrorActionPreference = 'Stop'
          $goVersion = (go version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $goVersion -cne 'go version go1.24.10 windows/amd64') {
            throw "Expected exact Go 1.24.10 windows/amd64, received: $goVersion"
          }
          $candidateDir = Join-Path $env:RUNNER_TEMP 'launcher-candidate'
          New-Item -ItemType Directory -Force -Path $candidateDir | Out-Null
          $candidatePath = Join-Path $candidateDir 'launcher.exe'
          go build -trimpath -buildvcs=false -ldflags '-H windowsgui -s -w' -o $candidatePath .
          if ($LASTEXITCODE -ne 0) { throw 'Source-built launcher candidate failed.' }

      - name: Run launcher Go tests
        working-directory: build-src
        shell: powershell
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
          GOFLAGS: '-mod=readonly'
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Launcher Go tests failed.' }

      - name: Write unsigned source candidate manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidatePath = Join-Path $env:RUNNER_TEMP 'launcher-candidate\launcher.exe'
          & "$env:GITHUB_WORKSPACE\scripts\write-launcher-candidate-manifest.ps1" `
            -CandidatePath $candidatePath `
            -ManifestPath (Join-Path $env:RUNNER_TEMP 'launcher-candidate\launcher-candidate.json') `
            -Version '${{ steps.version.outputs.version }}' `
            -Tag $env:GITHUB_REF_NAME `
            -CommitSha $env:GITHUB_SHA `
            -SourceRunId $env:GITHUB_RUN_ID `
            -SourceWorkflow '.github/workflows/release.yml' `
            -SourceEvent $env:GITHUB_EVENT_NAME `
            -SourceRef $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned launcher candidate manifest failed.' }

      - name: Preserve unsigned candidate for authorized local signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launcher-candidate
          path: |
            ${{ runner.temp }}/launcher-candidate/launcher.exe
            ${{ runner.temp }}/launcher-candidate/launcher-candidate.json
          if-no-files-found: error
          retention-days: 90

  build_app_release_asset:
    name: Build immutable app release asset
    runs-on: ubuntu-latest
    needs: validate_release

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build deterministic app release assets
        run: |
          python scripts/build_release_bundle.py \
            --version "${{ steps.version.outputs.VERSION }}" \
            --release-assets-dir "$RUNNER_TEMP/app-release-assets" \
            --commit-sha "$GITHUB_SHA"

      - name: Upload app release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-release-assets
          path: |
            ${{ runner.temp }}/app-release-assets/ltth_latest.zip
            ${{ runner.temp }}/app-release-assets/ltth_latest.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 90


  handoff_ready:
    name: Await local launcher signing handoff
    runs-on: ubuntu-latest
    needs: [build_windows_release_assets, build_app_release_asset]
    steps:
      - name: Report commit-bound local handoff
        shell: bash
        run: |
          {
            echo '## Launcher signing handoff required'
            echo
            echo "Unsigned candidate artifact: launcher-candidate (source run $GITHUB_RUN_ID, commit $GITHUB_SHA)."
            echo 'Create the source receipt with: python scripts/verify_launcher_source_run.py --repository Loggableim/ltth.app --run-id <source-run-id> --commit-sha <source-commit> --receipt-output launcher-source-run-receipt.json (GH_TOKEN required).'
            echo 'The local signing helper requires that receipt and a clean pinned Go 1.24.10 source rebuild before it can call SignTool.'
            echo 'After local signing, commit the validated folder under launcher-release-handoff/<source-commit>/<tag> on a handoff ref.'
            echo 'Then dispatch Publish Signed Launcher Handoff with this source run ID, source commit, handoff commit and tag.'
            echo 'No release is published by this source-build workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
