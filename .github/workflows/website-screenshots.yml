name: Capture Website Screenshots

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated locale codes (en,de)"
        required: false
        default: "en,de"
      auto_commit:
        description: "Commit screenshots back to repository"
        required: false
        type: boolean
        default: false

jobs:
  capture:
    name: Capture live website screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Puppeteer
        run: npm install --no-save --no-package-lock puppeteer

      - name: Capture website screenshots
        env:
          SCREENSHOT_BASE_URL: https://ltth.app
          SCREENSHOT_LANGS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.languages || 'en,de' }}
        run: node scripts/capture-live-screenshots.js

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltth-website-screenshots-${{ github.run_id }}
          path: |
            screenshots/01_homepage_hero.png
            screenshots/02_features_page.png
            screenshots/03_plugins_page.png
            screenshots/04_download_page.png
            screenshots/de/01_homepage_hero_de.png
            screenshots/de/02_features_page_de.png
            screenshots/de/03_plugins_page_de.png
            screenshots/de/04_download_page_de.png
            screenshots/features/*.png
            screenshots/de/features/*.png
            screenshots/capture-manifest.json

      - name: Commit screenshots to repository
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.auto_commit == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            screenshots/*.png \
            screenshots/de/*.png \
            screenshots/features/*.png \
            screenshots/de/features/*.png \
            screenshots/capture-manifest.json

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(screenshots): refresh website screenshots"
            git push
          else
            echo "No screenshot changes to commit."
          fi
