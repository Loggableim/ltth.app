name: Capture Product Screenshots

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated locale codes (de,en,es,fr)"
        required: false
        default: "de,en,es,fr"
      auto_commit:
        description: "Commit screenshots back to repository"
        required: false
        type: boolean
        default: false

jobs:
  capture:
    name: Capture current Cid product UI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci --include=optional

      - name: Install browser runtime
        working-directory: app
        run: npx puppeteer browsers install chrome

      - name: Capture product screenshots
        env:
          SCREENSHOT_LANGS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.languages || 'de,en,es,fr' }}
          SCREENSHOT_START_APP: 'true'
          LTTH_SAFE_MODE: 'false'
          LTTH_DISABLE_TIKTOK_AUTO_RECONNECT: 'true'
        run: node scripts/capture-product-screenshots.js

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltth-product-screenshots-${{ github.run_id }}
          path: |
            screenshots/features/*.png
            screenshots/de/features/*.png
            screenshots/es/features/*.png
            screenshots/fr/features/*.png
            screenshots/product-capture-manifest.json

      - name: Commit screenshots to repository
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.auto_commit == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            screenshots/features/*.png \
            screenshots/de/features/*.png \
            screenshots/es/features/*.png \
            screenshots/fr/features/*.png \
            screenshots/product-capture-manifest.json

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(screenshots): refresh product screenshots"
            git push
          else
            echo "No screenshot changes to commit."
          fi
