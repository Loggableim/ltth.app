<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="canonical" href="https://ltth.app/features/">
    <title>Redirecting...</title>
    <script>
        (function() {
            var lang = new URLSearchParams(window.location.search).get('lang');
            var targets = {
                en: '/features-en.html',
                es: '/features-es.html',
                fr: '/features-fr.html'
            };
            window.location.replace(targets[lang] || '/features/');
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="/features/">Features</a>...</p>
</body>
</html>
