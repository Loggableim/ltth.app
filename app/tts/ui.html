<!DOCTYPE html>
<html>
<head>
    <title>TTS</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ui.css">
    <script>
        (function () {
            const VALID_THEMES = new Set(['day', 'night', 'contrast', 'vision-impaired', 'cid']);

            function readTheme() {
                try {
                    if (window.parent && window.parent !== window) {
                        const parentTheme = window.parent.document?.documentElement?.getAttribute('data-theme');
                        if (VALID_THEMES.has(parentTheme)) return parentTheme;
                    }
                } catch (error) {}

                try {
                    for (const key of ['ltth-theme', 'app-theme', 'dashboard-theme', 'theme', 'ui-theme']) {
                        const value = localStorage.getItem(key);
                        if (VALID_THEMES.has(value)) return value;
                    }
                } catch (error) {}

                return 'night';
            }

            function syncTheme() {
                const theme = readTheme();
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = (theme === 'day' || theme === 'contrast' || theme === 'vision-impaired') ? 'light' : 'dark';
            }

            syncTheme();
            window.addEventListener('focus', syncTheme);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) syncTheme();
            });
            try {
                if (window.parent && window.parent !== window) {
                    new MutationObserver(syncTheme).observe(window.parent.document.documentElement, {
                        attributes: true,
                        attributeFilter: ['data-theme']
                    });
                }
            } catch (error) {}
        })();
    </script>
    <script src="/js/i18n-client.js"></script>
</head>
<body>
<div id="tts-container"></div>
<div id="admin-panel" style="display: none;">
    <div id="controls">
        <label for="volume">Volume:</label>
        <input type="range" id="volume" min="0" max="1" step="0.01">
        <label for="rate">Rate:</label>
        <input type="range" id="rate" min="0.1" max="10" step="0.1">
        <label for="pitch">Pitch:</label>
        <input type="range" id="pitch" min="0" max="2" step="0.1">
        <label for="voice">Voice:</label>
        <select id="voice"></select>
        <div id="test-controls">
            <input type="text" id="test-text" placeholder="Enter text to test">
            <button id="test-button">Test</button>
        </div>
        <button id="skip-button" data-i18n="generated.c5e08e5e612c">Skip Current</button>
        <button id="pause-button">Pause</button>
        <button id="resume-button">Resume</button>
        <button id="clear-button" data-i18n="generated.42b10f8df8b2">Clear Queue</button>
    </div>
</div>
<script src="ui.js" defer></script>
</body>
</html>
