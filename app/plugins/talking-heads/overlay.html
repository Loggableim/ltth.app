<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="ltth-i18n-base" content="/api/talkingheads/overlay/translations">
  <title data-i18n="plugins.talking-heads.talking_heads_ui.stream_director.overlay.title">Talking Heads - Speaker Stage</title>
  <link rel="stylesheet" href="/overlay/talking-heads/assets/overlay.css">
</head>
<body>
  <main id="speakerStage" class="speaker-stage" aria-live="polite">
    <div class="stage-chrome" aria-hidden="true">
      <span class="stage-live-dot"></span>
      <span data-i18n="plugins.talking-heads.talking_heads_ui.stream_director.overlay.live_speaker">LIVE SPEAKER</span>
    </div>
    <div id="avatarContainer" class="avatar-container"></div>
    <p id="stageIdle" class="stage-idle" data-i18n="plugins.talking-heads.talking_heads_ui.stream_director.overlay.waiting">Waiting for the next voice</p>
    <div id="spawnPulse" class="spawn-pulse" aria-hidden="true"></div>
  </main>

  <section id="avatarSpinOverlay" class="avatar-spin-overlay" aria-live="polite" aria-atomic="true" hidden>
    <div class="slot-machine" role="status">
      <p class="slot-kicker" data-i18n="plugins.talking-heads.talking_heads_ui.stream_director.overlay.lab">CHARACTER LAB</p>
      <h1 id="slotTitle" data-i18n="plugins.talking-heads.talking_heads_ui.stream_director.overlay.assigning">Assigning a new avatar</h1>
      <p id="slotUsername" class="slot-username"></p>
      <div class="slot-reels" aria-label="Three avatar reels" data-i18n-aria-label="plugins.talking-heads.talking_heads_ui.stream_director.overlay.three_reels">
        <div class="slot-reel" data-slot-reel="0"><div class="reel-track"></div></div>
        <div class="slot-reel slot-reel--winner" data-slot-reel="1"><div class="reel-track"></div></div>
        <div class="slot-reel" data-slot-reel="2"><div class="reel-track"></div></div>
      </div>
      <div class="slot-reveal" aria-live="polite">
        <img id="slotWinnerAvatar" alt="Assigned avatar" data-i18n-aria-label="plugins.talking-heads.talking_heads_ui.stream_director.overlay.assigned_avatar">
        <div>
          <span class="slot-reveal-label" data-i18n="plugins.talking-heads.talking_heads_ui.stream_director.overlay.your_avatar">YOUR AVATAR</span>
          <strong id="slotWinnerName" data-i18n="plugins.talking-heads.talking_heads_ui.stream_director.overlay.avatar">Avatar</strong>
        </div>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n-client.js"></script>
  <script src="/overlay/talking-heads/assets/overlay.js"></script>
</body>
</html>
