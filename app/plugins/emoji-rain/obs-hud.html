<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="generated.1734a134fb3a">EmojiRain OBS HUD - TikTok Stream Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            /* Force GPU rendering */
            will-change: transform;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            isolation: isolate;
        }

        body[data-visual-mode="premium_stage"]::before,
        body[data-visual-mode="premium_stage"]::after,
        #canvas-container::before,
        #canvas-container::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body[data-visual-mode="premium_stage"]::before {
            background:
                radial-gradient(circle at 50% 14%, rgba(255, 220, 150, 0.16), transparent 26%),
                radial-gradient(circle at 20% 76%, rgba(90, 150, 255, 0.12), transparent 24%),
                radial-gradient(circle at 80% 78%, rgba(255, 105, 170, 0.1), transparent 22%);
            filter: blur(14px);
            opacity: 0.95;
        }

        body[data-visual-mode="premium_stage"]::after {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 30%, rgba(255, 255, 255, 0.02) 70%, transparent);
            opacity: 0.75;
            mix-blend-mode: screen;
        }

        body[data-visual-mode="premium_stage"] #canvas-container::before {
            background:
                radial-gradient(circle at 50% 10%, rgba(255, 240, 188, 0.18), transparent 22%),
                radial-gradient(circle at 50% 72%, rgba(66, 120, 255, 0.1), transparent 38%);
            filter: blur(24px);
            opacity: 0.92;
        }

        body[data-visual-mode="premium_stage"] #canvas-container::after {
            background: linear-gradient(110deg, transparent 34%, rgba(255, 255, 255, 0.06) 50%, transparent 66%);
            opacity: 0.62;
            mix-blend-mode: screen;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            /* Force GPU rendering for canvas */
            will-change: transform;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        /* Enhanced emoji sprite with game-quality effects */
        .emoji-sprite {
            position: absolute;
            pointer-events: none;
            user-select: none;
            transform-origin: center;
            /* Game-quality effects */
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4))
                    drop-shadow(0 0 12px rgba(255,255,255,0.3))
                    brightness(1.1);
            transition: opacity 0.24s ease, filter 0.24s ease;
            /* Hardware acceleration */
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            perspective: 1000px;
            text-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
        }

        .emoji-sprite[data-layer="background"] {
            opacity: 0.74;
        }

        .emoji-sprite[data-layer="mid"] {
            opacity: 0.92;
        }

        .emoji-sprite[data-layer="foreground"] {
            opacity: 1;
        }

        .emoji-sprite[data-emphasis="gift"],
        .emoji-sprite[data-emphasis="superfan"] {
            text-shadow: 0 10px 22px rgba(0, 0, 0, 0.3);
        }

        .emoji-sprite[data-emphasis="sticker"] {
            text-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
        }

        .particle-trail {
            mix-blend-mode: screen;
        }

        .emoji-sprite.fading {
            opacity: 0;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)) blur(2px);
        }

        .gift-ball {
            border-radius: 18px;
        }

        .heart-balloon {
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28), 0 0 34px rgba(255, 120, 170, 0.2);
        }

        /* Enhanced glow effect for emojis */
        .emoji-sprite.glowing {
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4))
                    drop-shadow(0 0 20px rgba(255,215,0,0.8))
                    drop-shadow(0 0 40px rgba(255,215,0,0.5))
                    brightness(1.3);
        }

        /* Particle trail effect */
        .particle-trail {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            animation: particleFade 0.6s ease-out forwards;
        }

        @keyframes particleFade {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.3);
            }
        }

        /* Enhanced bubble blop animation with depth */
        @keyframes bubbleBlop {
            0% {
                scale: 1;
                rotate: 0deg;
                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4))
                        drop-shadow(0 0 12px rgba(255,255,255,0.3));
            }
            30% {
                scale: 1.3;
                rotate: 5deg;
                filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5))
                        drop-shadow(0 0 24px rgba(255,255,255,0.6))
                        brightness(1.3);
            }
            50% {
                scale: 1.4;
                rotate: -5deg;
            }
            70% {
                scale: 0.95;
                rotate: 3deg;
            }
            100% {
                scale: 1;
                rotate: 0deg;
                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4))
                        drop-shadow(0 0 12px rgba(255,255,255,0.3));
            }
        }

        .emoji-sprite.bouncing {
            animation: bubbleBlop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* Custom image support with enhanced quality */
        .emoji-sprite img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Performance HUD (optional, for debugging) */
        #perf-hud {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            display: none;
            z-index: 10000;
            border: 1px solid rgba(0,255,0,0.3);
            box-shadow: 0 0 20px rgba(0,255,0,0.2);
            line-height: 1.5;
        }

        #perf-hud.visible {
            display: block;
        }

        .perf-label {
            color: #0ff;
            font-weight: bold;
        }

        .perf-warning {
            color: #ff0;
        }

        .perf-critical {
            color: #f00;
            font-weight: bold;
        }

        /* Resolution indicator */
        #resolution-indicator {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: rgba(255,255,255,0.6);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 10px;
            font-family: monospace;
            display: none;
            z-index: 9999;
        }

        #resolution-indicator.visible {
            display: block;
        }

        /* Toaster Mode - Performance optimizations for low-end PCs */
        body.toaster-mode .emoji-sprite {
            /* Disable expensive filters and shadows */
            filter: none !important;
            /* Disable transitions and animations */
            transition: none !important;
            animation: none !important;
        }

        body.toaster-mode .emoji-sprite.fading {
            /* Simple opacity change without transition */
            opacity: 0;
            filter: none !important;
        }

        body.toaster-mode .emoji-sprite.glowing {
            /* Disable glow effect in toaster mode */
            filter: none !important;
        }

        body.toaster-mode .emoji-sprite.bouncing {
            /* Disable bounce animation in toaster mode */
            animation: none !important;
        }

        body.toaster-mode .particle-trail {
            /* Hide particle trails in toaster mode */
            display: none !important;
        }
    </style>
    <script src="/js/i18n-client.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Performance HUD (toggle with Ctrl+P) -->
    <div id="perf-hud">
        <div><span class="perf-label">FPS:</span> <span id="fps">60</span></div>
        <div><span class="perf-label">Emojis:</span> <span id="emoji-count">0</span> / <span id="emoji-max">200</span></div>
        <div><span class="perf-label">Bodies:</span> <span id="body-count">0</span></div>
        <div><span class="perf-label">Memory:</span> <span id="memory-usage">-</span> MB</div>
        <div><span class="perf-label" data-i18n="generated.440006f3810f">Frame Time:</span> <span id="frame-time">-</span> ms</div>
        <div><span class="perf-label">Resolution:</span> <span id="perf-resolution">-</span></div>
    </div>

    <!-- Resolution Indicator -->
    <div id="resolution-indicator"></div>

    <!-- Matter.js (local) -->
    <script src="/js/matter.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script src="/js/emoji-rain-obs-hud.js?v=heart-balloons-pop-3"></script>
</body>
</html>
