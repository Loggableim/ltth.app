<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="plugins.clarityhud.labels.clarityhud_multi_stream_overlay">ClarityHUD - Multi-Stream Overlay</title>
  <link href="/fonts/exo-2.css" rel="stylesheet">
  <script>
    (function () {
      const validThemes = new Set(['day', 'night', 'contrast', 'vision-impaired', 'cid']);

      function readTheme() {
        try {
          if (window.parent && window.parent !== window) {
            const parentTheme = window.parent.document?.documentElement?.getAttribute('data-theme');
            if (validThemes.has(parentTheme)) return parentTheme;
          }
        } catch (error) {}

        try {
          for (const key of ['ltth-theme', 'app-theme', 'dashboard-theme', 'theme', 'ui-theme']) {
            const value = localStorage.getItem(key);
            if (validThemes.has(value)) return value;
          }
        } catch (error) {}

        return 'night';
      }

      function syncTheme() {
        const theme = readTheme();
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = (theme === 'day' || theme === 'contrast' || theme === 'vision-impaired') ? 'light' : 'dark';
      }

      syncTheme();
      window.addEventListener('focus', syncTheme);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) syncTheme();
      });
      try {
        if (window.parent && window.parent !== window) {
          new MutationObserver(syncTheme).observe(window.parent.document.documentElement, {
            attributes: true,
            attributeFilter: ['data-theme']
          });
        }
      } catch (error) {}
    })();
  </script>
  <style>
    /* CSS Custom Properties for Dynamic Configuration */
    :root {
      --multi-font-size: 28px;
      --multi-line-height: 1.4;
      --multi-letter-spacing: 0.3px;
      --multi-font-family: 'Exo 2', sans-serif;
      --multi-bg-color: rgba(0, 0, 0, 0.85);
      --multi-text-color: #ffffff;
      --multi-padding: 12px;
      --multi-message-spacing: 6px;
      --multi-card-width: 360px;
      --multi-opacity: 1;

      /* Density modes */
      --density-compact-spacing: 6px;
      --density-compact-padding: 8px 12px;
      --density-ultra-spacing: 3px;
      --density-ultra-padding: 4px 8px;
      --density-comfortable-spacing: 10px;
      --density-comfortable-padding: 12px 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: var(--multi-font-family);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background: transparent;
    }

    #multi-container {
      width: 100%;
      height: 100%;
      padding: var(--multi-padding);
      display: flex;
      gap: 12px;
      opacity: var(--multi-opacity);
    }

    html {
      background: transparent;
      color-scheme: dark;
    }

    /* Layout modes */
    #multi-container.layout-mixed {
      flex-direction: column;
    }

    #multi-container.layout-split {
      flex-direction: row;
      flex-wrap: wrap;
    }

    #multi-container.layout-split.columns-1 {
      flex-direction: column;
    }

    #multi-container.layout-split.columns-2 .stream-column {
      flex: 0 0 calc(50% - 6px);
    }

    #multi-container.layout-split.columns-3 .stream-column {
      flex: 0 0 calc(33.333% - 8px);
    }

    .stream-column {
      display: flex;
      flex-direction: column;
      gap: var(--multi-message-spacing);
      overflow: hidden;
      flex: 1;
      min-width: 300px;
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: var(--multi-message-spacing);
      overflow: hidden;
      flex: 1;
    }

    .chat-message {
      background: var(--multi-bg-color);
      padding: var(--density-compact-padding);
      border-radius: 6px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 200ms ease-out, transform 200ms ease-out;
      word-wrap: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
      line-height: var(--multi-line-height);
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: var(--multi-card-width);
      font-size: var(--multi-font-size);
      position: relative;
    }

    .chat-message.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .chat-message.pulse-new {
      animation: pulseGlow 0.5s ease-out;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(255, 255, 255, 0); }
      50% { box-shadow: 0 0 15px rgba(255, 255, 255, 0.5); }
    }

    /* Message styles */
    .chat-message.style-stripe::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--source-accent);
      border-radius: 6px 0 0 6px;
    }

    .chat-message.style-badge .source-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--source-accent);
      color: #000;
      font-size: calc(var(--multi-font-size) * 0.7);
      font-weight: 600;
      margin-right: 6px;
    }

    .chat-message.style-bg {
      background: var(--source-bg);
      color: var(--source-text);
    }

    /* Density modes */
    body.density-ultra .chat-message {
      padding: var(--density-ultra-padding);
      gap: 2px;
    }

    body.density-ultra #messages {
      gap: var(--density-ultra-spacing);
    }

    body.density-comfortable .chat-message {
      padding: var(--density-comfortable-padding);
      gap: 4px;
    }

    body.density-comfortable #messages {
      gap: var(--density-comfortable-spacing);
    }

    .chat-message-header {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .source-badge {
      display: none;
      font-size: calc(var(--multi-font-size) * 0.7);
      font-weight: 600;
      color: var(--source-accent);
    }

    .chat-message.style-badge .source-badge {
      display: inline-flex;
    }

    .chat-avatar {
      display: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    body.show-avatars .chat-avatar {
      display: block;
    }

    .badge-container {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .tiktok-emote {
      display: inline-block;
      height: 1.3em;
      vertical-align: middle;
      margin: 0 2px;
    }

    .unicode-emoji {
      display: inline;
      margin: 0 1px;
    }

    .chat-username {
      color: var(--source-text, #ffffff);
      font-weight: 700;
      font-size: var(--multi-font-size);
      line-height: var(--multi-line-height);
      letter-spacing: var(--multi-letter-spacing);
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      margin-right: 6px;
    }

    .chat-text {
      color: var(--multi-text-color);
      font-size: var(--multi-font-size);
      line-height: var(--multi-line-height);
      letter-spacing: var(--multi-letter-spacing);
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      display: inline;
    }

    .chat-message.style-bg .chat-text {
      text-shadow: none;
    }

    .chat-timestamp {
      color: rgba(255, 255, 255, 0.6);
      font-size: calc(var(--multi-font-size) * 0.65);
      line-height: var(--multi-line-height);
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      margin-left: 8px;
      display: none;
    }

    body.show-timestamps .chat-timestamp {
      display: inline;
    }

    .chat-message.primary-stream {
      opacity: 1;
    }

    body.highlight-primary .chat-message.primary-stream {
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    /* Accessibility: Reduce Motion */
    body.reduce-motion .chat-message {
      transition: opacity 100ms ease-out;
      transform: none !important;
    }

    /* Auto contrast adjustment */
    body.auto-contrast .chat-message.style-bg {
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
    }

    html[data-theme="cid"] html,
    html[data-theme="cid"] body {
      background: transparent;
      color: #f4fff4;
      color-scheme: dark;
    }

    html[data-theme="cid"] #multi-container {
      padding: 14px 16px;
    }

    html[data-theme="cid"] .chat-message {
      background: rgba(7, 17, 7, 0.92);
      color: #f4fff4;
      max-width: none;
      width: 100%;
      border: 1px solid #1e5b2a;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    }

    html[data-theme="vision-impaired"] #multi-container {
      padding: 14px 16px;
    }

    html[data-theme="vision-impaired"] .chat-message {
      background: rgba(0, 0, 0, 0.96);
      color: #fff7cc;
      max-width: none;
      width: 100%;
      border: 1px solid #facc15;
      box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.18), 0 6px 24px rgba(0, 0, 0, 0.55);
    }

    html[data-theme="cid"] .chat-message.style-bg {
      background: rgba(7, 17, 7, 0.98);
      color: #f4fff4;
    }

    html[data-theme="vision-impaired"] .chat-message.style-bg {
      background: rgba(0, 0, 0, 0.98);
      color: #fff7cc;
    }

    html[data-theme="cid"] .chat-username {
      color: #4ade80;
      text-shadow: 0 0 12px rgba(74, 222, 128, 0.3), 0 2px 8px rgba(0, 0, 0, 0.85);
    }

    html[data-theme="vision-impaired"] .chat-username {
      color: #fde047;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.4), 0 2px 8px rgba(0, 0, 0, 0.95);
    }

    html[data-theme="cid"] .chat-text,
    html[data-theme="cid"] .chat-timestamp,
    html[data-theme="cid"] .source-badge {
      color: #d1e7d1;
    }

    html[data-theme="vision-impaired"] .chat-text,
    html[data-theme="vision-impaired"] .chat-timestamp,
    html[data-theme="vision-impaired"] .source-badge {
      color: #fff7cc;
    }

    html[data-theme="cid"] .chat-message.style-badge .source-badge {
      background: #4ade80;
      color: #030603;
    }

    html[data-theme="vision-impaired"] .chat-message.style-badge .source-badge {
      background: #facc15;
      color: #030603;
    }

    /* Debug Console */
    #debug-console {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.9);
      color: #0f0;
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
      max-width: 300px;
      z-index: 10000;
      display: none;
    }

    #debug-status { margin-bottom: 5px; }
    #debug-socket { margin-bottom: 5px; }
    #debug-events { margin-bottom: 5px; }
    </style>
    <script src="/js/i18n-client.js"></script>
</head>
<body>
  <!-- Debug Console -->
  <div id="debug-console">
    <div id="debug-status" data-i18n="plugins.clarityhud.labels.status_initializing">Status: Initializing...</div>
    <div id="debug-socket" data-i18n="plugins.clarityhud.labels.socket_disconnected_d3461b">Socket: Disconnected</div>
    <div id="debug-events" data-i18n="plugins.clarityhud.labels.events_0">Events: 0</div>
    <div id="debug-streams" data-i18n="plugins.clarityhud.labels.streams_0">Streams: 0</div>
  </div>

  <div id="multi-container" class="layout-mixed">
    <div id="messages"></div>
  </div>

  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Libraries -->
  <script src="/plugins/clarityhud/lib/animations.js"></script>
  <script src="/plugins/clarityhud/lib/i18n-runtime.js"></script>
  <script src="/plugins/clarityhud/lib/accessibility.js"></script>
  <script src="/plugins/clarityhud/lib/emoji-parser.js"></script>
  <script src="/plugins/clarityhud/lib/badge-renderer.js"></script>
  <script src="/plugins/clarityhud/lib/message-parser.js"></script>
  <script src="/plugins/clarityhud/lib/virtual-scroller.js"></script>

  <script src="/plugins/clarityhud/overlays/multi.js"></script>
</body>
</html>
