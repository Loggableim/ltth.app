<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidekick HUD Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: transparent;
      color: #fff;
      overflow: hidden;
    }

    .overlay-container {
      position: fixed;
      padding: 15px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 10px;
      backdrop-filter: blur(5px);
      min-width: 200px;
      max-width: 350px;
    }

    /* Position presets via URL params */
    .overlay-container.top-left {
      top: 20px;
      left: 20px;
    }

    .overlay-container.top-right {
      top: 20px;
      right: 20px;
    }

    .overlay-container.bottom-left {
      bottom: 20px;
      left: 20px;
    }

    .overlay-container.bottom-right {
      bottom: 20px;
      right: 20px;
    }

    .overlay-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .overlay-title {
      font-size: 16px;
      font-weight: bold;
      color: #4CAF50;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4CAF50;
      animation: pulse 2s infinite;
    }

    .status-dot.muted {
      background: #ff9800;
      animation: none;
    }

    .status-dot.disconnected {
      background: #f44336;
      animation: none;
    }

    .availability-message {
      color: #ffcdd2;
      font-size: 11px;
      margin-left: auto;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat-item {
      text-align: center;
      padding: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #4CAF50;
    }

    .stat-label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
    }

    .recent-events {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .event-list {
      max-height: 150px;
      overflow-y: auto;
    }

    .event-item {
      padding: 5px 0;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      animation: slideIn 0.3s ease;
    }

    .event-item:last-child {
      border-bottom: none;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .event-icon {
      display: inline-block;
      width: 20px;
      text-align: center;
      margin-right: 5px;
    }

    .event-user {
      font-weight: bold;
      color: #64B5F6;
    }

    .event-content {
      color: #ccc;
    }

    .hidden {
      display: none;
    }

    /* Minimal mode */
    .overlay-container.minimal {
      min-width: 150px;
    }

    .overlay-container.minimal .recent-events {
      display: none;
    }

    .overlay-container.minimal .stats-grid {
      grid-template-columns: repeat(4, 1fr);
    }

    .overlay-container.minimal .stat-item {
      padding: 5px;
    }

    .overlay-container.minimal .stat-value {
      font-size: 18px;
    }

    .overlay-container.minimal .stat-label {
      font-size: 9px;
    }
  </style>
</head>
<body>
  <div class="overlay-container top-right" id="overlay">
    <div class="overlay-header">
      <span class="overlay-title">🤖 Sidekick</span>
      <span class="availability-message hidden" id="availability-message" role="status" aria-live="polite"></span>
    </div>

    <div class="recent-events" id="recent-events-section">
      <div class="event-list" id="event-list">
        <!-- Events will be added here -->
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    const position = params.get('position') || 'top-right';
    const minimal = params.get('minimal') === 'true';
    const showEvents = params.get('events') !== 'false';
    const maxEvents = Math.max(1, Math.min(10, parseInt(params.get('maxEvents')) || 5));

    // Apply settings
    const overlay = document.getElementById('overlay');
    overlay.className = `overlay-container ${position}`;
    if (minimal) overlay.classList.add('minimal');
    if (!showEvents) document.getElementById('recent-events-section').classList.add('hidden');

    // Socket connection
    const socket = io();
    
    // Event icons
    const eventIcons = {
      chat: '💬',
      gift: '🎁',
      follow: '👤',
      share: '📤',
      subscribe: '⭐',
      join: '👋',
      like: '❤️'
    };

    // Recent events buffer
    const recentEvents = [];
    const unavailableEndpoints = new Set();

    function renderAvailability() {
      const message = document.getElementById('availability-message');
      if (unavailableEndpoints.has('events')) {
        message.textContent = 'Event feed unavailable';
      } else {
        message.textContent = '';
      }
      message.classList.toggle('hidden', unavailableEndpoints.size === 0);
    }

    function setEndpointAvailability(endpoint, available) {
      if (available) unavailableEndpoints.delete(endpoint);
      else unavailableEndpoints.add(endpoint);
      renderAvailability();
    }

    // Add event to list
    function addEvent(event) {
      recentEvents.unshift(event);
      while (recentEvents.length > maxEvents) {
        recentEvents.pop();
      }
      renderEvents();
    }

    // Render event list
    function renderEvents() {
      const container = document.getElementById('event-list');
      container.replaceChildren(...recentEvents.map(event => {
        const icon = eventIcons[event.type] || '📌';
        const item = document.createElement('div');
        item.className = 'event-item';
        const iconEl = document.createElement('span');
        iconEl.className = 'event-icon';
        iconEl.textContent = icon;
        const userEl = document.createElement('span');
        userEl.className = 'event-user';
        userEl.textContent = event.nickname || 'Viewer';
        item.append(iconEl, userEl);
        const content = event.type === 'chat' ? event.payload?.comment : event.payload?.giftName;
        if (content) {
          const contentEl = document.createElement('span');
          contentEl.className = 'event-content';
          const text = String(content);
          const chatText = event.type === 'chat' && event.payload?.commentTruncated
            ? `${text.slice(0, 27)}...`
            : text.slice(0, 30);
          contentEl.textContent = ` ${chatText}`;
          item.appendChild(contentEl);
        }
        return item;
      }));
    }

    // Fetch recent events
    async function fetchEvents() {
      try {
        const res = await fetch('/api/sidekick/public-events?limit=' + maxEvents);
        if (!res.ok) throw new Error('Events request failed');
        const data = await res.json();
        if (data.success && data.events) {
          data.events.forEach(event => {
            if (!recentEvents.find(e => e.ts === event.ts && e.type === event.type)) {
              recentEvents.push(event);
            }
          });
          while (recentEvents.length > maxEvents) {
            recentEvents.shift();
          }
          recentEvents.sort((a, b) => b.ts - a.ts);
          renderEvents();
          setEndpointAvailability('events', true);
        } else {
          setEndpointAvailability('events', false);
        }
      } catch (err) {
        setEndpointAvailability('events', false);
        console.error('Failed to fetch events:', err);
      }
    }

    // Load only the bounded chat/gift event feed; aggregate status is private.
    fetchEvents();
    
    // Periodic event-feed refresh.
    setInterval(fetchEvents, 5000);
  </script>
</body>
</html>
