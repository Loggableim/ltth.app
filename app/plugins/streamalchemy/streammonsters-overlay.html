<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream Monsters · Collector Arena Overlay</title>
  <style>
    :root { --ink:#f8f7ff; --muted:#bdc5dc; --violet:#a984ff; --cyan:#55dcff; --mint:#6ef1b8; --gold:#ffd76f; }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; color:var(--ink); background:transparent; font-family:Inter,Segoe UI,Arial,sans-serif; }
    #streammonsters-overlay { position:fixed; inset:0; pointer-events:none; }
    #brand {
      position:absolute; top:28px; left:30px; width:250px; height:70px; object-fit:contain; object-position:left center;
      opacity:.88; filter:drop-shadow(0 8px 20px #0009);
    }
    #hype {
      position:absolute; top:30px; right:34px; display:grid; place-items:center; width:92px; height:92px;
      border:3px solid #725ba5; border-radius:50%; background:conic-gradient(var(--violet) var(--hype),#172039 0);
      box-shadow:0 12px 40px #0009; opacity:0; transform:scale(.8); transition:.28s;
    }
    #hype::before { content:""; position:absolute; inset:7px; border-radius:50%; background:#101629f2; }
    #hype.visible { opacity:1; transform:none; }
    #hype-value { position:relative; font-weight:900; font-size:19px; }
    #toast {
      position:absolute; left:50%; top:32px; max-width:620px; padding:10px 18px; border:1px solid #675397;
      border-radius:999px; background:#151229ee; box-shadow:0 14px 38px #0008; opacity:0;
      transform:translate(-50%,-18px); transition:.3s; text-align:center;
    }
    #toast.visible { opacity:1; transform:translate(-50%,0); }
    #card {
      position:absolute; right:38px; bottom:38px; display:grid; grid-template-columns:158px minmax(250px,1fr); gap:18px;
      width:min(610px,calc(100vw - 76px)); min-height:190px; padding:18px; border:1px solid #6d77a5; border-radius:27px;
      background:linear-gradient(140deg,#202a46f5,#101628f7); box-shadow:0 28px 80px #000b;
      opacity:0; transform:translateX(100px) scale(.94); transition:.35s cubic-bezier(.2,.85,.25,1.1);
    }
    #card.visible { opacity:1; transform:none; }
    #card.charged { border-color:#d5b4ff; box-shadow:0 0 50px #9d72ff69,0 28px 80px #000b; }
    #art-wrap { display:grid; place-items:center; overflow:hidden; border-radius:20px; background:radial-gradient(circle,#4a3b7c,#0a1020 70%); }
    #art { width:158px; height:158px; object-fit:contain; filter:drop-shadow(0 12px 16px #0009); }
    #kicker { color:#dac9ff; text-transform:uppercase; letter-spacing:.12em; font-size:12px; font-weight:900; }
    #title { margin:5px 0; font-size:clamp(28px,3vw,39px); line-height:1.03; }
    #subtitle { color:var(--muted); font-size:16px; }
    #hint { margin-top:11px; color:var(--mint); font-size:14px; font-weight:700; }
    #progress { height:9px; margin-top:13px; overflow:hidden; border-radius:99px; background:#070b13; }
    #bar { width:0; height:100%; background:linear-gradient(90deg,var(--cyan),var(--violet),var(--gold)); transition:width .5s; }
    #battle {
      position:absolute; left:50%; top:50%; width:min(760px,calc(100vw - 80px)); padding:26px; border:1px solid #9676d2;
      border-radius:28px; text-align:center; background:linear-gradient(140deg,#261841f2,#101a30f4); box-shadow:0 30px 100px #000c;
      opacity:0; transform:translate(-50%,-45%) scale(.9); transition:.35s;
    }
    #battle.visible { opacity:1; transform:translate(-50%,-50%) scale(1); }
    #battle-kicker { color:var(--gold); text-transform:uppercase; letter-spacing:.13em; font-size:12px; font-weight:900; }
    #versus { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:20px; margin:15px 0; font-size:28px; font-weight:900; }
    #versus .vs { color:var(--gold); font-size:15px; }
    #battle-detail { color:var(--muted); font-size:18px; }
    #round-dots { display:flex; justify-content:center; gap:8px; margin-top:14px; }
    #round-dots span { width:12px; height:12px; border:1px solid #7c6aa5; border-radius:50%; background:#181e34; }
    #round-dots span.active { background:var(--gold); box-shadow:0 0 16px #ffcf59; }
    #battle { width:min(1180px,calc(100vw - 56px)); min-height:590px; padding:22px; overflow:hidden; isolation:isolate; }
    #battle::before { content:""; position:absolute; inset:8% 10% 18%; z-index:0; border-radius:50%; background:radial-gradient(ellipse,#735bb433 0%,#34265112 45%,transparent 72%); filter:blur(5px); transform:perspective(700px) rotateX(66deg); }
    #battle::after { content:""; position:absolute; inset:0; z-index:0; opacity:0; pointer-events:none; background:radial-gradient(circle at 50% 48%,#fff9 0 2%,#b58bff88 14%,transparent 43%); transition:opacity .25s; }
    #battle.arena-special::after { opacity:1; animation:arena-flash 1.1s ease both; }
    #battle-effects { position:absolute; inset:0; z-index:3; width:100%; height:100%; opacity:.94; pointer-events:none; }
    #battle-arena { position:relative; z-index:1; display:grid; grid-template-columns:minmax(0,1fr) 115px minmax(0,1fr); gap:14px; min-height:435px; align-items:end; perspective:1200px; transform-style:preserve-3d; }
    .battle-fighter { position:relative; display:grid; grid-template-rows:auto minmax(250px,1fr) auto; min-height:420px; padding:14px; border:1px solid #556899; border-radius:24px; background:linear-gradient(145deg,#202c4cdd,#111a30d9); overflow:hidden; transform-style:preserve-3d; will-change:transform,filter; transition:transform .45s cubic-bezier(.2,.8,.2,1), filter .25s; }
    .battle-fighter.right { background:linear-gradient(215deg,#42235bdd,#15192fd9); }
    .battle-fighter::before { content:""; position:absolute; inset:12%; border-radius:50%; opacity:.32; background:radial-gradient(circle,#8dbbff66,transparent 65%); filter:blur(14px); transform:translateZ(-20px); }
    .battle-fighter.attack { transform:translateX(12%); filter:drop-shadow(0 0 26px var(--gold)); }
    .battle-fighter.right.attack { transform:translateX(-12%); }
    .battle-fighter.hit { animation:battle-hit .65s ease both; }
    .battle-fighter.shielded::after { content:""; position:absolute; inset:8%; border:3px solid #61dfff; border-radius:50%; box-shadow:0 0 40px #61dfff99,inset 0 0 28px #61dfff44; animation:shield-pulse 1.1s ease both; }
    .battle-art { transform-style:preserve-3d; will-change:transform,filter; }
    .battle-fighter.left .battle-art { transform:translateZ(34px) rotateY(8deg) rotateZ(-1deg); }
    .battle-fighter.right .battle-art { transform:translateZ(34px) rotateY(-8deg) rotateZ(1deg) scaleX(-1); }
    #battle.arena-entering .battle-fighter.left { animation:arena-entry-left .9s cubic-bezier(.12,.85,.2,1) both; }
    #battle.arena-entering .battle-fighter.right { animation:arena-entry-right .9s cubic-bezier(.12,.85,.2,1) both; }
    #battle.arena-attack .battle-fighter.left.attack .battle-art { animation:arena-lunge-left .9s cubic-bezier(.15,.8,.2,1) both; }
    #battle.arena-attack .battle-fighter.right.attack .battle-art { animation:arena-lunge-right .9s cubic-bezier(.15,.8,.2,1) both; }
    #battle.arena-defense .battle-fighter.shielded .battle-art { animation:arena-guard .95s cubic-bezier(.2,.8,.2,1) both; }
    #battle.arena-special .battle-fighter.left.attack .battle-art { animation:arena-special-left 1.45s cubic-bezier(.12,.8,.18,1) both; }
    #battle.arena-special .battle-fighter.right.attack .battle-art { animation:arena-special-right 1.45s cubic-bezier(.12,.8,.18,1) both; }
    #battle.arena-multihit .battle-fighter.hit { animation:arena-multihit 1.1s steps(3,end) both; }
    #battle[data-quality="reduced"] .battle-art { animation-duration:.35s !important; }
    @keyframes battle-hit { 22% { transform:translateX(-5%) rotate(-2deg) scale(.95); filter:brightness(2.4) saturate(1.5); } 100% { transform:none; } }
    @keyframes shield-pulse { from { opacity:0; transform:scale(.65); } 45% { opacity:1; } to { opacity:0; transform:scale(1.15); } }
    @keyframes arena-entry-left { from { opacity:0; transform:translate3d(-42%,-4%,0) rotateY(24deg); } to { opacity:1; transform:translate3d(0,0,0); } }
    @keyframes arena-entry-right { from { opacity:0; transform:translate3d(42%,4%,0) rotateY(-24deg); } to { opacity:1; transform:translate3d(0,0,0); } }
    @keyframes arena-lunge-left { 0% { transform:translateZ(34px) rotateY(8deg); } 42% { transform:translate3d(48%,0,100px) rotateY(-10deg) scale(1.14); filter:brightness(1.25); } 100% { transform:translateZ(34px) rotateY(8deg); } }
    @keyframes arena-lunge-right { 0% { transform:translateZ(34px) rotateY(-8deg) scaleX(-1); } 42% { transform:translate3d(-48%,0,100px) rotateY(10deg) scale(-1.14,1.14); filter:brightness(1.25); } 100% { transform:translateZ(34px) rotateY(-8deg) scaleX(-1); } }
    @keyframes arena-guard { 0% { transform:translateZ(34px) scale(1); } 42% { transform:translateZ(86px) scale(1.1); filter:brightness(1.35); } 100% { transform:translateZ(34px) scale(1); } }
    @keyframes arena-special-left { 0% { transform:translateZ(34px) rotateY(8deg) scale(1); } 28% { transform:translate3d(-8%,0,70px) rotateY(-20deg) scale(1.2); filter:brightness(1.4); } 66% { transform:translate3d(45%,0,122px) rotateY(-15deg) scale(1.24); filter:brightness(2); } 100% { transform:translateZ(34px) rotateY(8deg) scale(1); } }
    @keyframes arena-special-right { 0% { transform:translateZ(34px) rotateY(-8deg) scaleX(-1); } 28% { transform:translate3d(8%,0,70px) rotateY(20deg) scale(-1.2,1.2); filter:brightness(1.4); } 66% { transform:translate3d(-45%,0,122px) rotateY(15deg) scale(-1.24,1.24); filter:brightness(2); } 100% { transform:translateZ(34px) rotateY(-8deg) scaleX(-1); } }
    @keyframes arena-multihit { 0%,100% { filter:brightness(1); } 18% { transform:translateX(-5%) rotate(-2deg); filter:brightness(2.3); } 48% { transform:translateX(4%) rotate(2deg); filter:brightness(1.6); } 78% { transform:translateX(-3%) rotate(-1deg); filter:brightness(2.1); } }
    @keyframes arena-flash { 0% { opacity:0; } 18% { opacity:1; } 100% { opacity:0; } }
    .battle-hud { display:grid; grid-template-columns:1fr auto; gap:7px; text-align:left; font-size:14px; font-weight:800; }
    .battle-hud .battle-name { font-size:clamp(22px,2.5vw,34px); line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .battle-hud .battle-element { color:var(--cyan); font-size:12px; text-transform:uppercase; letter-spacing:.12em; }
    .battle-art { width:min(100%,330px); height:280px; object-fit:contain; justify-self:center; align-self:center; filter:drop-shadow(0 20px 22px #000c); transition:transform .4s ease; }
    .battle-hp, .battle-charge, .battle-shield { display:grid; grid-template-columns:50px 1fr auto; gap:7px; align-items:center; margin-top:6px; color:#dce8ff; font-size:12px; }
    .battle-meter { height:12px; overflow:hidden; border:1px solid #5b6d92; border-radius:99px; background:#080d18; }
    .battle-meter i { display:block; width:100%; height:100%; transform-origin:left; background:linear-gradient(90deg,#62e5a9,#c4ff95); transition:transform .35s; }
    .battle-charge .battle-meter i { background:linear-gradient(90deg,#5ed8ff,#b088ff,#ffd76f); }
    .battle-shield .battle-meter i { background:linear-gradient(90deg,#5ed8ff,#d8f8ff); }
    #battle-float-layer { position:absolute; inset:0; z-index:4; overflow:hidden; pointer-events:none; }
    .battle-float { position:absolute; top:42%; font-size:clamp(24px,4vw,54px); font-weight:1000; text-shadow:0 5px 14px #000d; animation:battle-float 1.25s cubic-bezier(.2,.7,.2,1) both; }
    .battle-float.left { left:20%; } .battle-float.right { right:20%; }
    .battle-float.damage { color:#ff8f91; } .battle-float.shield { color:#8eeaff; } .battle-float.heal { color:#8ff4b9; } .battle-float.evade { color:#e9f5ff; font-size:clamp(18px,2.8vw,34px); }
    @keyframes battle-float { 0% { opacity:0; transform:translateY(24px) scale(.65); } 18% { opacity:1; transform:translateY(0) scale(1.08); } 100% { opacity:0; transform:translateY(-82px) scale(.92); } }
    #battle-center { align-self:center; display:grid; gap:15px; place-items:center; color:var(--gold); font-weight:900; }
    #battle-center .vs { font-size:24px; text-shadow:0 0 20px #ffcf59; }
    #battle-advantage { min-height:36px; color:var(--mint); font-size:13px; }
    #battle-skill-panel { position:relative; z-index:2; display:grid; grid-template-columns:minmax(160px,.7fr) 1fr; gap:16px; align-items:center; padding-top:8px; }
    #battle-detail { font-size:17px; text-align:left; }
    #battle-skill-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
    .battle-skill { min-height:82px; padding:10px; border:1px solid #657bab; border-radius:15px; background:#111a31e8; text-align:left; }
    .battle-skill strong { display:block; color:var(--gold); font-size:15px; }
    .battle-skill small { display:block; margin-top:3px; color:var(--muted); font-size:11px; }
    .battle-skill.locked { border-color:var(--mint); box-shadow:0 0 22px #6ef1b855; }
    .battle-skill.disabled { opacity:.42; filter:grayscale(1); }
    #chat-card {
      position:absolute; left:34px; bottom:34px; max-width:min(650px,calc(100vw - 68px)); padding:18px 22px;
      border:1px solid #3d6d75; border-radius:15px; color:#dffcff; background:#0d2429eb; box-shadow:0 16px 42px #0009;
      opacity:0; transform:translateY(35px); transition:.28s; font-size:clamp(18px,2.1vw,28px); font-weight:800; line-height:1.25;
    }
    #chat-card.visible { opacity:1; transform:none; }
    #monster-collection, #monster-profile {
      position:absolute; left:50%; bottom:38px; width:min(940px,calc(100vw - 76px)); padding:18px;
      border:1px solid #7685b8; border-radius:26px; background:linear-gradient(140deg,#17243ef7,#0d1426fa);
      box-shadow:0 28px 80px #000c; opacity:0; transform:translate(-50%,70px) scale(.96);
      transition:.35s cubic-bezier(.2,.85,.25,1.1);
    }
    #monster-collection.visible, #monster-profile.visible { opacity:1; transform:translate(-50%,0) scale(1); }
    .collection-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:13px; }
    .collection-head strong { font-size:clamp(21px,2.4vw,31px); }
    .collection-head span { color:var(--mint); font-size:14px; font-weight:800; }
    #collection-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .monster-tile { display:grid; grid-template-columns:56px 1fr; gap:9px; min-height:82px; padding:9px; border:1px solid #3e527e; border-radius:16px; background:#101a30d9; }
    .monster-tile.selected { border-color:var(--gold); box-shadow:inset 0 0 22px #ffcf5922; }
    .monster-tile img { width:56px; height:56px; object-fit:contain; filter:drop-shadow(0 5px 8px #0009); }
    .monster-tile h2 { margin:0; font-size:18px; line-height:1.05; }
    .monster-tile p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .monster-tile small { color:var(--cyan); font-weight:800; }
    #monster-profile { bottom:58px; display:grid; grid-template-columns:minmax(220px,.7fr) minmax(0,1.3fr); align-items:center; gap:24px; min-height:292px; }
    #profile-art-wrap { display:grid; place-items:center; min-height:244px; border-radius:21px; background:radial-gradient(circle,#4a3b7c,#0a1020 72%); }
    #profile-art { width:240px; height:240px; object-fit:contain; filter:drop-shadow(0 16px 22px #000b); }
    #profile-kicker { color:var(--cyan); text-transform:uppercase; letter-spacing:.13em; font-size:12px; font-weight:900; }
    #profile-title { margin:5px 0; font-size:clamp(34px,4vw,56px); line-height:1; }
    #profile-subtitle { color:var(--muted); font-size:18px; }
    #profile-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:18px; }
    .profile-stat { padding:9px; border:1px solid #425684; border-radius:13px; background:#0c1427cc; text-align:center; }
    .profile-stat small { display:block; color:var(--muted); text-transform:uppercase; font-size:10px; letter-spacing:.08em; }
    .profile-stat strong { display:block; margin-top:2px; color:var(--gold); font-size:23px; }
    @media (orientation: portrait) {
      #brand { top:20px; left:20px; width:210px; height:58px; }
      #hype { top:18px; right:20px; width:76px; height:76px; }
      #toast { top:104px; width:calc(100vw - 32px); }
      #card { right:16px; bottom:50px; grid-template-columns:1fr; width:calc(100vw - 32px); text-align:center; }
      #art-wrap { width:160px; height:160px; margin:auto; }
      #battle { top:49%; width:calc(100vw - 24px); min-height:740px; padding:14px 10px; }
      #battle-arena { grid-template-columns:1fr; grid-template-rows:1fr 58px 1fr; min-height:560px; gap:5px; }
      .battle-fighter { grid-template-columns:118px 1fr; grid-template-rows:1fr; min-height:224px; padding:10px; }
      .battle-fighter.right { grid-column:1; }
      .battle-hud { grid-column:2; grid-row:1; align-self:start; }
      .battle-art { width:116px; height:190px; grid-column:1; grid-row:1; }
      #battle-center { grid-row:2; grid-column:1; grid-template-columns:auto 1fr; }
      #battle-center .vs { font-size:18px; }
      #battle-skill-panel { grid-template-columns:1fr; gap:8px; }
      #battle-detail { text-align:center; font-size:15px; }
      .battle-skill { min-height:66px; padding:7px; }
      .battle-skill strong { font-size:12px; }
      .battle-skill small { display:none; }
      #chat-card { left:16px; bottom:18px; max-width:calc(100vw - 32px); }
      #monster-collection, #monster-profile { bottom:26px; width:calc(100vw - 32px); padding:14px; }
      #collection-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
      .monster-tile { grid-template-columns:48px 1fr; min-height:72px; padding:8px; }
      .monster-tile img { width:48px; height:48px; }
      .monster-tile h2 { font-size:15px; }
      #monster-profile { grid-template-columns:1fr; gap:12px; min-height:0; text-align:center; }
      #profile-art-wrap { min-height:150px; }
      #profile-art { width:150px; height:150px; }
      #profile-title { font-size:34px; }
      #profile-subtitle { font-size:15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    }
  </style>
</head>
<body>
<main id="streammonsters-overlay" aria-live="polite">
  <img id="brand" src="/plugins/streamalchemy/assets/branding/stream-monsters-logo.png" alt="">
  <div id="hype" style="--hype:0%"><span id="hype-value">0%</span></div>
  <div id="toast"></div>
  <section id="card">
    <div id="art-wrap"><img id="art" alt=""></div>
    <div>
      <div id="kicker">Stream Monsters</div>
      <h1 id="title">Collector Arena</h1>
      <div id="subtitle">Das nächste Monster wartet.</div>
      <div id="progress"><div id="bar"></div></div>
      <div id="hint">!eggs · !hatch [slot] · !battle</div>
    </div>
  </section>
  <section id="battle">
    <canvas id="battle-effects" aria-hidden="true"></canvas>
    <div id="battle-kicker">Collector Arena · Drei Runden</div>
    <div id="battle-arena">
      <article id="battle-fighter-a" class="battle-fighter left">
        <div class="battle-hud"><strong id="fighterA" class="battle-name">Monster A</strong><span id="battle-element-a" class="battle-element">Element</span></div>
        <img id="battle-art-a" class="battle-art" alt="">
          <div>
            <div class="battle-hp"><span>HP</span><div class="battle-meter"><i id="battle-hp-a"></i></div><b id="battle-hp-label-a">0/0</b></div>
            <div class="battle-shield"><span>Shield</span><div class="battle-meter"><i id="battle-shield-a"></i></div><b id="battle-shield-label-a">0</b></div>
            <div class="battle-charge"><span>Special</span><div class="battle-meter"><i id="battle-charge-a"></i></div><b id="battle-charge-label-a">0%</b></div>
        </div>
      </article>
      <div id="battle-center"><span class="vs">VS</span><span id="battle-advantage"></span></div>
      <article id="battle-fighter-b" class="battle-fighter right">
        <div class="battle-hud"><strong id="fighterB" class="battle-name">Monster B</strong><span id="battle-element-b" class="battle-element">Element</span></div>
        <img id="battle-art-b" class="battle-art" alt="">
          <div>
            <div class="battle-hp"><span>HP</span><div class="battle-meter"><i id="battle-hp-b"></i></div><b id="battle-hp-label-b">0/0</b></div>
            <div class="battle-shield"><span>Shield</span><div class="battle-meter"><i id="battle-shield-b"></i></div><b id="battle-shield-label-b">0</b></div>
            <div class="battle-charge"><span>Special</span><div class="battle-meter"><i id="battle-charge-b"></i></div><b id="battle-charge-label-b">0%</b></div>
        </div>
      </article>
    </div>
    <div id="battle-detail">Die Arena wird vorbereitet …</div>
    <div id="round-dots"><span></span><span></span><span></span></div>
    <div id="battle-skill-options"></div>
  </section>
  <div id="battle-float-layer" aria-hidden="true"></div>
  <section id="monster-collection" aria-live="polite">
    <div class="collection-head"><strong id="collection-title">Monster-Sammlung</strong><span id="collection-page"></span></div>
    <div id="collection-grid"></div>
  </section>
  <section id="monster-profile" aria-live="polite">
    <div id="profile-art-wrap"><img id="profile-art" alt=""></div>
    <div>

  const itemName = item => value(item?.name || item?.gift_name || item?.giftName, 'Element-Ei');
  const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
  const DEFAULT_BOTTOM_OVERLAY_DURATION_MS = 12_000;
  const MIN_BOTTOM_OVERLAY_DURATION_MS = 8_000;
  const MAX_BOTTOM_OVERLAY_DURATION_MS = 20_000;
  const eventQueue = [];
  const criticalEventTypes = new Set(['egg_spawned', 'hatch_started', 'egg_hatched', 'battle_started', 'battle_skill_prompt', 'battle_action', 'battle_knockout', 'battle_completed']);
  const lowerCardEventTypes = new Set(['hype_changed', 'gift_combo', 'chat_result', 'quest_completed', 'achievement_unlocked', 'season_rank_changed']);
  const chatCooldowns = new Map();
  const overlayViews = globalThis.StreamMonstersOverlayViews;
  let queueRunning = false;
  let battleNames = ['Monster A','Monster B'];
  let battleIds = [null,null];
  let battleAdvantageName = '';
  let bottomOverlayDurationMs = DEFAULT_BOTTOM_OVERLAY_DURATION_MS;
  let commandPrefix = '!';
  let arenaAudioEnabled = true;
  let arenaAudioVolume = 0.7;
  let arenaEffectsQuality = 'auto';
  const battleAudio = (() => {
    let manifestPromise = null;
    const loadManifest = async () => {
      if (!manifestPromise) {
        manifestPromise = fetch('/plugins/streamalchemy/assets/streammonsters/audio/manifest.json')
          .then(response => response.ok ? response.json() : { sounds: [] })
          .then(payload => new Map((Array.isArray(payload?.sounds) ? payload.sounds : [])
            .map(entry => [String(entry?.id || ''), String(entry?.file || '')])
            .filter(([id, file]) => /^[a-z0-9_-]{1,32}$/i.test(id) && /^[a-z0-9_-]{1,64}\.(?:ogg|mp3|wav)$/i.test(file))))
          .catch(() => new Map());
      }
      return manifestPromise;
    };
    const play = async soundId => {
      if (!arenaAudioEnabled || !soundId || typeof globalThis.Audio !== 'function') return;
      const sounds = await loadManifest();
      const file = sounds.get(String(soundId));
      if (!file) return;
      try {
        const audio = new globalThis.Audio(`/plugins/streamalchemy/assets/streammonsters/audio/${file}`);
        audio.volume = arenaAudioVolume;
        const started = audio.play?.();
        if (started?.catch) started.catch(() => {});
      } catch (_) {}
    };
    return { play };
  })();
  const reducedMotion = Boolean(globalThis.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches);
  const battleEffects = (() => {
    const canvas = node('battle-effects');
    let mode = reducedMotion ? 'css' : 'pending';
    let gpuDevice = null;
    let gpuContext = null;
    let gpuPipeline = null;
    let gpuUniformBuffer = null;
    let gpuBindGroup = null;
    let context2d = null;
    let quality = 'auto';
    const colorFor = element => ({ Ember:'#ff7e62', Tide:'#55dcff', Grove:'#6ef1b8', Gale:'#d6e7ff', Volt:'#ffd76f', Lunar:'#c5a4ff' }[element] || '#a984ff');
    const colorVector = element => {
      const hex = colorFor(element).slice(1);
      return [0, 2, 4].map(index => Number.parseInt(hex.slice(index, index + 2), 16) / 255);
    };
    const resize = () => {
      const width = Math.max(1, canvas.clientWidth || 1100);
      const height = Math.max(1, canvas.clientHeight || 620);
      if (canvas.width !== width) canvas.width = width;
      if (canvas.height !== height) canvas.height = height;
      return { width, height };
    };
    const buildGpuPipeline = () => {
      if (!gpuDevice || gpuPipeline) return;
      const shader = gpuDevice.createShaderModule({
        code: `
          struct Pulse { color: vec4<f32>, timing: vec4<f32>, viewport: vec4<f32> };
          @group(0) @binding(0) var<uniform> pulse: Pulse;
          @vertex fn vertex(@builtin(vertex_index) index: u32) -> @builtin(position) vec4<f32> {
            var positions = array<vec2<f32>, 6>(
              vec2<f32>(-1.0, -1.0), vec2<f32>(1.0, -1.0), vec2<f32>(-1.0, 1.0),
              vec2<f32>(-1.0, 1.0), vec2<f32>(1.0, -1.0), vec2<f32>(1.0, 1.0)
            );
            return vec4<f32>(positions[index], 0.0, 1.0);
          }
          @fragment fn fragment(@builtin(position) position: vec4<f32>) -> @location(0) vec4<f32> {
            let size = max(1.0, min(pulse.viewport.x, pulse.viewport.y));
            let offset = (position.xy - pulse.timing.xy) / size;
            let elapsed = clamp(pulse.timing.z / max(1.0, pulse.timing.w), 0.0, 1.0);
            let distance = length(offset);
            let ringRadius = mix(0.04, 0.70, elapsed);
            let ring = smoothstep(0.035, 0.0, abs(distance - ringRadius));
            let ray = smoothstep(0.035, 0.0, abs(offset.y)) * smoothstep(0.62, 0.04, abs(offset.x));
            let sparkle = smoothstep(0.012, 0.0, abs(sin((offset.x + offset.y) * 42.0 + elapsed * 18.0))) * smoothstep(0.78, 0.10, distance);
            let special = step(1.5, pulse.viewport.w);
            let intensity = max(ring, sparkle * 0.46) + (ray * special * (1.0 - elapsed));
            let alpha = intensity * pulse.color.a * (1.0 - elapsed * 0.45);
            return vec4<f32>(pulse.color.rgb * alpha, alpha);
          }`
      });

        layout: 'auto',
        vertex: { module: shader, entryPoint: 'vertex' },
        fragment: {
          module: shader,
          entryPoint: 'fragment',
          targets: [{
            format: navigator.gpu.getPreferredCanvasFormat(),
            blend: {
              color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
              alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' }
            }
          }]
        },
        primitive: { topology: 'triangle-list' }
      });
      const bufferUsage = (globalThis.GPUBufferUsage?.UNIFORM || 0x40) | (globalThis.GPUBufferUsage?.COPY_DST || 0x08);
      gpuUniformBuffer = gpuDevice.createBuffer({ size: 48, usage: bufferUsage });
      gpuBindGroup = gpuDevice.createBindGroup({
        layout: gpuPipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: gpuUniformBuffer } }]
      });
    };
    const activate = async () => {
      if (mode !== 'pending') return mode;
      try {
        if (quality !== 'reduced' && navigator.gpu) {
          const adapter = await navigator.gpu.requestAdapter();
          gpuDevice = await adapter?.requestDevice();
          gpuContext = canvas.getContext('webgpu');
          if (gpuDevice && gpuContext) {
            resize();
            gpuContext.configure({ device: gpuDevice, format: navigator.gpu.getPreferredCanvasFormat(), alphaMode: 'premultiplied' });

            gpuDevice.lost.then(() => { mode = 'css'; gpuDevice = null; gpuContext = null; gpuPipeline = null; });

            return mode;

    const requestFrame = callback => (globalThis.requestAnimationFrame ? globalThis.requestAnimationFrame(callback) : null);

      if (!gpuDevice || !gpuContext || !gpuPipeline || !gpuUniformBuffer || !gpuBindGroup) return;
      const now = performance.now();
      const elapsed = now - started;
      const duration = Math.max(500, Number(cue.durationMs) || 1_200);
      const { width, height } = resize();
      const [red, green, blue] = colorVector(cue.element);
      const originX = (cue.actorSide === 'b' ? 0.72 : 0.28) * width;
      const originY = height * (cue.kind === 'defense' ? 0.58 : 0.49);
      const kind = cue.kind === 'special' ? 2 : (cue.kind === 'defense' ? 1 : 0);
      gpuDevice.queue.writeBuffer(gpuUniformBuffer, 0, new Float32Array([
        red, green, blue, Math.min(1, 0.65 + (Number(cue.strength) || 1) * 0.12),
        originX, originY, elapsed, duration,
        width, height, Math.max(1, Number(cue.strength) || 1), kind
      ]));

      context2d ||= canvas.getContext('2d');

      const elapsed = performance.now() - started;
      const duration = Math.max(500, Number(cue.durationMs) || 1_200);
      const progress = Math.min(1, elapsed / duration);
      const sourceX = (cue.actorSide === 'b' ? 0.74 : 0.26) * width;
      const targetX = (cue.actorSide === 'b' ? 0.28 : 0.72) * width;

        context2d.lineWidth = 5 + ((1 - progress) * 8);
        context2d.globalAlpha = 0.75 * (1 - progress * 0.5);
        context2d.beginPath();
        context2d.arc(sourceX, centerY, 44 + progress * 110, 0, Math.PI * 2);
        context2d.stroke();
      } else {
        const beamProgress = cue.kind === 'special' ? Math.min(1, progress * 1.6) : Math.min(1, progress * 2.2);

        const gradient = context2d.createLinearGradient(sourceX, centerY, beamX, centerY);

        gradient.addColorStop(0.35, color);
        gradient.addColorStop(1, '#ffffff');
        context2d.strokeStyle = gradient;
        context2d.lineWidth = cue.kind === 'special' ? 20 : 10;
        context2d.globalAlpha = 0.8 * (1 - Math.max(0, progress - 0.72) / 0.28);
        context2d.beginPath();
        context2d.moveTo(sourceX, centerY);
        context2d.lineTo(beamX, centerY);

        for (let index = 0; index < impactCount; index += 1) {
          const hitProgress = Math.max(0, Math.min(1, progress * impactCount - index));
          if (!hitProgress) continue;
          context2d.globalAlpha = 0.7 * (1 - hitProgress);
          context2d.fillStyle = color;
          context2d.beginPath();
          context2d.arc(targetX, centerY + ((index - ((impactCount - 1) / 2)) * 24), 10 + hitProgress * 50, 0, Math.PI * 2);

      if (progress < 1 && !reducedMotion) requestFrame(() => renderCanvasBurst(cue, started));

      const active = await activate();
      if (active === 'webgpu' && gpuDevice && gpuContext) {
        renderGpuBurst(cue);

    };
    return { burst, mode: () => mode, setQuality };
  })();

  const setArenaConfig = (config = {}) => {
    if (Object.prototype.hasOwnProperty.call(config, 'arenaAudioEnabled')) {

      const requestedVolume = Number(config.arenaAudioVolume);
      arenaAudioVolume = Math.max(0, Math.min(1, Number.isFinite(requestedVolume) ? requestedVolume : 0.7));
    }
    if (Object.prototype.hasOwnProperty.call(config, 'arenaEffectsQuality')) {

    battle.dataset.audioEnabled = String(arenaAudioEnabled);

  const showToast = async (text, duration = 2600) => {

    node('toast').classList.add('visible');
    await wait(duration);
    node('toast').classList.remove('visible');

  const setBattleFighter = (side, fighter = {}) => {
    const suffix = side === 'a' ? 'a' : 'b';

    node(`battle-charge-${suffix}`).style.transform = `scaleX(${charge / 100})`;
    node(`battle-charge-label-${suffix}`).textContent = `${charge}%`;
  };
  const setBattleSkills = (skills = {}, lockedChoice = null) => {
    const root = node('battle-skill-options');
    clear(root);

      item.append(title, description);
      root.append(item);
    });
  };
  const ensureBattleFromAction = action => {
    const actor = action?.before || action?.after || {};
    const target = action?.targetBefore || action?.targetAfter || {};
    const actorId = action?.monsterId || actor.monsterId;
    const targetId = action?.targetMonsterId || target.monsterId;
    if (!actorId || !targetId) return;
    const actionIds = [actorId, targetId];
    if (battleIds[0] === actionIds[0] && battleIds[1] === actionIds[1]) return;
    battleIds = actionIds;
    battleNames = [itemName(actor), itemName(target)];
    setBattleFighter('a', actor);
    setBattleFighter('b', target);
    node('battle').classList.add('visible');
  };
  const showBattleFloat = (side, text, kind = 'damage') => {
    if (!text) return;
    const float = document.createElement('span');
    float.className = `battle-float ${side === 'a' ? 'left' : 'right'} ${kind}`;
    float.textContent = text;
    node('battle-float-layer').append(float);
    setTimeout(() => float.remove(), reducedMotion ? 0 : 1_300);
  };
  const showBattleOutcomes = (action, actorSide, targetSide) => {
    (action?.outcomes || []).forEach(outcome => {
      if (outcome.type === 'damage') {
        if (outcome.evaded) showBattleFloat(targetSide, 'DODGE', 'evade');
        else if (Number(outcome.hpDamage) > 0) showBattleFloat(targetSide, `-${Number(outcome.hpDamage)}`, 'damage');
        if (Number(outcome.shieldAbsorbed) > 0) showBattleFloat(targetSide, `-${Number(outcome.shieldAbsorbed)} SHIELD`, 'shield');
        if (Number(outcome.reactiveDamage) > 0) showBattleFloat(actorSide, `-${Number(outcome.reactiveDamage)}`, 'damage');

      if (outcome.type === 'shield' && Number(outcome.amount) > 0) showBattleFloat(actorSide, `+${Number(outcome.amount)}`, 'shield');

  };
  const showBattle = async ({ left, right, fighters = null, detail, round = 0, winner = false, duration = 2600, keepVisible = false }) => {
    battleNames = [left || battleNames[0],right || battleNames[1]];
    const fighterList = Array.isArray(fighters) ? fighters : [];
    setBattleFighter('a', fighterList[0] || { name: battleNames[0] });
    setBattleFighter('b', fighterList[1] || { name: battleNames[1] });

    await wait(winner ? 4300 : duration);
    node('battle').classList.remove('visible');
    await wait(300);
  };
  const showHype = async data => {
    const points = Number(data?.hype?.points) || 0;
    node('hype').style.setProperty('--hype',`${points}%`);
    node('hype-value').textContent = data?.hype?.charged_eggs ? 'CHARGED!' : `${points}%`;
    node('hype').classList.add('visible');
    await wait(2600);
    node('hype').classList.remove('visible');
  };
  const showChat = async data => {
    const userId = value(data?.userId,'Viewer');
    const previous = chatCooldowns.get(userId) || 0;
    if (Date.now() - previous < 4500) return;
    chatCooldowns.set(userId,Date.now());
    const message = data?.result?.message;
    if (!message) return;
    node('chat-card').textContent = `${userId} · ${message}`;
    node('chat-card').classList.add('visible');
    await wait(durationFor(data));
    node('chat-card').classList.remove('visible');
  };
  const renderCollectionPage = ({ userId, page, pageIndex, pageCount, selected }) => {
    const grid = node('collection-grid');
    clear(grid);
    node('collection-title').textContent = `${value(userId, 'Viewer')}s Monster-Sammlung`;
    node('collection-page').textContent = pageCount > 1 ? `Seite ${pageIndex + 1}/${pageCount}` : `${page.length} Monster`;
    page.forEach((monster, index) => {
      const tile = document.createElement('article');
      const selectedMonster = monster?.is_selected || selected?.monster_id === monster?.monster_id;
      tile.className = `monster-tile${selectedMonster ? ' selected' : ''}`;
      const art = document.createElement('img');
      art.src = monster?.image_url || '/plugins/streamalchemy/assets/branding/stream-monsters-icon.png';
      art.alt = '';
      const copy = document.createElement('div');
      const title = document.createElement('h2');
      title.textContent = `#${pageIndex * 6 + index + 1} ${itemName(monster)}`;
      const meta = document.createElement('p');
      meta.textContent = `${value(monster?.element, 'Element')} · Lv.${Number(monster?.level) || 1}`;
      const label = document.createElement('small');
      label.textContent = selectedMonster ? 'AKTIV' : value(monster?.personality, 'Collector');
      copy.append(title, meta, label);
      tile.append(art, copy);
      grid.append(tile);
    });
  };
  const showCollection = async data => {
    const monsters = Array.isArray(data?.result?.monsters) ? data.result.monsters : [];
    if (!monsters.length) return showChat(data);
    const pages = overlayViews?.paginate?.(monsters, 6) || [monsters.slice(0, 6)];
    const totalDuration = overlayViews?.collectionDurationMs?.(durationFor(data), pages.length)
      || Math.max(durationFor(data), pages.length * 5_000);
    const collection = node('monster-collection');
    collection.classList.add('visible');
    let remaining = totalDuration;
    for (let pageIndex = 0; pageIndex < pages.length; pageIndex += 1) {
      renderCollectionPage({
        userId: data?.userId,
        page: pages[pageIndex],
        pageIndex,
        pageCount: pages.length,
        selected: data?.result?.selected
      });
      const pageDuration = Math.min(5_000, remaining);
      await wait(pageDuration);
      remaining -= pageDuration;
    }
    if (remaining > 0) await wait(remaining);
    collection.classList.remove('visible');
    await wait(350);
  };
  const showMonsterProfile = async data => {
    const monster = data?.result?.monster;
    if (!monster) return showChat(data);
    const profile = overlayViews?.profile?.(monster, data?.result?.slot)
      || { monster, slot: data?.result?.slot || 1, stats: monsterStats(monster) };
    const stats = profile.stats || monsterStats(monster);
    node('profile-art').src = monster.image_url || '/plugins/streamalchemy/assets/branding/stream-monsters-icon.png';
    node('profile-art').alt = itemName(monster);
    node('profile-kicker').textContent = `Monsterkarte · Slot ${profile.slot}`;
    node('profile-title').textContent = itemName(monster);
    node('profile-subtitle').textContent = `${value(monster.element, 'Element')} · Lv.${Number(monster.level) || 1} · ${value(monster.personality, 'Collector')}`;
    const statRoot = node('profile-stats');
    clear(statRoot);
    [['Vitality', 'vitality'], ['Might', 'might'], ['Guard', 'guard'], ['Agility', 'agility']].forEach(([label, key]) => {
      const stat = document.createElement('div');
      stat.className = 'profile-stat';
      const statLabel = document.createElement('small');
      statLabel.textContent = label;
      const statValue = document.createElement('strong');
      statValue.textContent = Number(stats[key]) || 0;
      stat.append(statLabel, statValue);
      statRoot.append(stat);
    });
    const card = node('monster-profile');
    card.classList.add('visible');
    await wait(durationFor(data));
    card.classList.remove('visible');
    await wait(350);
  };
  const present = async ({ type, data }) => {
    if (type === 'config_changed') {
      setBottomOverlayDuration(data?.config?.bottomOverlayDurationMs);
      setArenaConfig(data?.config);
      return;
    }
    if (type === 'stream_started') return showToast(`${value(data?.event?.element,'Element')} Hour ist aktiv`);
    if (type === 'egg_spawned') {
      void battleAudio.play('spawn');
      return showCard({
      kicker:`${value(data?.egg?.element,'Element')} · ${value(data?.egg?.variant,'standard')}`,
      title:'Ein neues Ei!',
      subtitle:`${value(data?.userId,'Viewer')} hat einen Brutplatz gefüllt.`,
      imageUrl:data?.egg?.image_url,
      charged:data?.egg?.variant === 'charged',
      hint:'!eggs zeigt den Timer',
      progress:4
      });
    }
    if (type === 'egg_boosted') return showCard({
      kicker:'Tempo-Boost',
      title:'Das Ei leuchtet!',
      subtitle:'Ein ausgewähltes Gift hat nur die Brutzeit verkürzt.',
      imageUrl:data?.egg?.image_url,
      progress:62
    });
    if (type === 'gift_combo') return showToast(`Hype-Combo für ${value(data?.userId,'einen Viewer')} · +20`);
    if (type === 'hype_changed') return showHype(data);
    if (type === 'egg_ready') {
      void battleAudio.play('ready');
      return showCard({
      kicker:'Bereit!',
      title:`${value(data?.egg?.element,'Element')}-Ei kann schlüpfen`,
      subtitle:`${value(data?.userId,'Viewer')}, dein Moment gehört dir.`,
      imageUrl:data?.egg?.image_url,
      progress:100,
      charged:data?.egg?.variant === 'charged',
      hint:'Jetzt !hatch [slot] schreiben'
      });
    }
    if (type === 'hatch_started') return showToast(`${value(data?.userId,'Viewer')} öffnet ein ${value(data?.egg?.element,'Element')}-Ei …`,1800);
    if (type === 'egg_hatched') {
      void battleAudio.play('hatch');
      return showCard({
      kicker:`${value(data?.monster?.element,data?.egg?.element)} · ${value(data?.monster?.personality,'Neugierig')}`,
      title:`${itemName(data?.monster)} ist da!`,
      subtitle:`28 faire Startpunkte · gehört ${value(data?.userId,'dem Viewer')} dauerhaft.`,
      imageUrl:data?.monster?.image_url || data?.egg?.image_url,
      charged:data?.egg?.variant === 'charged',
      hint:'!monster [slot] zeigt die Karte',
      progress:100
      });
    }
    if (type === 'monster_visual_evolved') return showCard({
      kicker:'Kosmetische Evolution',
      title:`${itemName(data?.monster)} strahlt neu`,
      subtitle:'KI-Kunst ersetzt Kenney. Name, Werte und Besitz bleiben unverändert.',
      imageUrl:data?.monster?.image_url,
      charged:true,
      progress:100
    });
    if (type === 'battle_snapshot') {
      const fighters = Object.values(data?.battle?.fighters || {});
      if (fighters.length === 2) showBattle({ left:fighters[0].name, right:fighters[1].name, fighters, detail:battleCopy('restored'), round:data?.battle?.roundNumber || 0, keepVisible:true });
      return;
    }
    if (type === 'battle_match_found') return showToast(battleCopy('found', { choose:`${commandPrefix}choose [slot]` }), 3000);
    if (type === 'battle_cancelled') return showToast(battleCopy('cancelled'), 4000);
    if (type === 'battle_roster_locked') return showToast(data?.autoLocked ? battleCopy('rosterAuto') : battleCopy('roster'), 1800);
    if (type === 'battle_started') {
      battleIds = [data?.challenger?.monster_id, data?.defender?.monster_id];
      battleAdvantageName = data?.elementAdvantageMonsterId === battleIds[0]
        ? itemName(data?.challenger)
        : (data?.elementAdvantageMonsterId === battleIds[1] ? itemName(data?.defender) : '');
      setBattleSkills();
      showBattle({
        left:itemName(data?.challenger),
        right:itemName(data?.defender),
        fighters:[data?.challenger, data?.defender],
        detail:battleAdvantageName ? battleCopy('advantage', { name:battleAdvantageName }) : battleCopy('even'),
        duration:3000,
        keepVisible:true
      });
      node('battle-advantage').textContent = battleAdvantageName ? battleCopy('advantage', { name:battleAdvantageName }) : battleCopy('even');
      node('battle').classList.add('arena-entering');
      setTimeout(() => node('battle').classList.remove('arena-entering'), reducedMotion ? 0 : 1_000);
      await wait(reducedMotion ? 0 : 3000);
      return;
    }
    if (type === 'battle_skill_prompt') {
      const candidate = data?.skills?.[battleIds[0]] || Object.values(data?.skills || {})[0] || {};
      setBattleSkills(candidate);
      node('battle-detail').textContent = battleCopy('round', { round:data?.roundNumber || 1 });
      node('battle').classList.add('visible');
      return;
    }
    if (type === 'battle_skill_locked') {
      const choice = data?.choice;
      [...node('battle-skill-options').children].forEach(item => item.classList.toggle('locked', item.textContent.startsWith(`${choice} ·`)));
      node('battle-detail').textContent = data?.auto
        ? battleCopy('auto', { choice })
        : battleCopy('locked', { viewer:data?.userId || 'Viewer', choice });
      return;
    }
    if (type === 'battle_action') {
      const action = data?.action || {};
      ensureBattleFromAction(action);
      const actorSide = action.monsterId === battleIds[0] ? 'a' : 'b';
      const targetSide = actorSide === 'a' ? 'b' : 'a';
      const cue = overlayViews?.arenaAction?.(action, actorSide) || {
        kind: action.selectedChoice === 'C' ? 'special' : (action.selectedChoice === 'B' ? 'defense' : 'attack'),
        sound: action.selectedChoice === 'C' ? 'special' : 'hit',
        vfxKey: action.skill?.vfxKey || 'neutral-attack',
        element: action.after?.element || action.before?.element || 'Neutral',
        damage: 0,
        shieldGain: 0,
        healing: 0,
        evaded: false,
        durationMs: 2_700
      };
      setBattleFighter(actorSide, action.after || {});
      setBattleFighter(targetSide, action.targetAfter || {});
      showBattleOutcomes(action, actorSide, targetSide);
      node('battle-detail').textContent = battleCopy('action', {
        name:action.before?.name || battleNames[actorSide === 'a' ? 0 : 1],
        skill:action.skill?.name || action.selectedChoice || 'skill'
      });
      const actor = node(`battle-fighter-${actorSide}`);
      const target = node(`battle-fighter-${targetSide}`);
      const battle = node('battle');
      battle.dataset.vfxKey = cue.vfxKey;
      battle.dataset.sound = cue.sound;
      battle.dataset.hitCount = String(cue.hitCount || 0);
      battle.dataset.presentation = cue.multiHit ? 'multi-hit' : cue.kind;
      battle.classList.remove('arena-attack', 'arena-defense', 'arena-special');
      battle.classList.toggle('arena-multihit', Boolean(cue.multiHit));
      battle.classList.add(`arena-${cue.kind}`);
      void battleAudio.play(cue.sound);
      actor.classList.add(cue.kind === 'defense' ? 'shielded' : 'attack');
      if (cue.damage > 0 && !cue.evaded) target.classList.add('hit');
      if (cue.shieldGain > 0) actor.classList.add('shielded');
      battleEffects.burst({ ...cue, strength: cue.kind === 'special' ? 2 : 1 });
      await wait(reducedMotion ? 0 : cue.durationMs);
      actor.classList.remove('attack', 'shielded');
      target.classList.remove('hit');
      return;
    }
    if (type === 'battle_round') {
      const round = Number(data?.round?.number) || 1;
      [...node('round-dots').children].forEach((dot,index) => dot.classList.toggle('active',index < round));
      node('battle-detail').textContent = battleCopy('done', { round });
      return;
    }
    if (type === 'battle_knockout') {
      node('battle-detail').textContent = battleCopy('knockout');
      battleEffects.burst({ strength: 3 });
      void battleAudio.play('knockout');
      await wait(reducedMotion ? 0 : 4000);
      return;
    }
    if (type === 'monster_xp_awarded') return showCard({
      kicker:battleCopy('xp'),
      title:`${itemName(data?.monster)} +${data?.xpAwarded || 0} XP`,
      subtitle:data?.winner ? battleCopy('victory') : battleCopy('growth'),
      imageUrl:data?.monster?.image_url,
      progress:100,
      durationMs:8_000
    });
    if (type === 'monster_level_up') return showCard({
      kicker:battleCopy('level'),
      title:battleCopy('reaches', { name:itemName(data?.monster), level:data?.monster?.level || '' }),
      subtitle:battleCopy('chooseStat'),
      imageUrl:data?.monster?.image_url,
      charged:true,
      durationMs:12_000
    });
    if (type === 'monster_stat_prompt') return showToast(battleCopy('statPrompt'), 5000);
    if (type === 'monster_stat_chosen' || type === 'monster_stat_auto_assigned') return showCard({
      kicker:type === 'monster_stat_auto_assigned' ? battleCopy('statAuto') : battleCopy('statChosen'),
      title:`${itemName(data?.monster)} +1 ${value(data?.stat, 'stat')}`,
      subtitle:type === 'monster_stat_auto_assigned' ? battleCopy('expired') : battleCopy('selected'),
      imageUrl:data?.monster?.image_url,
      durationMs:8_000,
      progress:100
    });
    if (type === 'battle_completed') {
      void battleAudio.play('victory');
      return showBattle({
        left:battleNames[0],
        right:battleNames[1],
        round:3,
        winner:true,
        detail:`${itemName(data?.winner)} gewinnt!`
      });
    }
    if (type === 'achievement_unlocked') return showCard({
      kicker:'Achievement freigeschaltet',
      title:value(data?.achievement?.achievement_key,'Neuer Meilenstein').replaceAll('_',' '),
      subtitle:`${value(data?.userId,'Viewer')} erweitert die Collector-Karte.`,
      progress:100,
      charged:true
    });
    if (type === 'season_rank_changed') return showCard({
      kicker:'Liga-Aufstieg',
      title:`${rankLabel(data?.after)}!`,
      subtitle:`${value(data?.userId,'Viewer')} erreicht ${data?.score?.points || 0} Saisonpunkte.`,
      progress:100,
      charged:true
    });
    if (type === 'quest_completed') return showToast(`Quest geschafft · ${value(data?.quest?.title,'Belohnung eingesammelt')}`);
    if (type === 'chat_result' && data?.result?.status === 'inventory') return showCollection(data);
    if (type === 'chat_result' && data?.result?.status === 'monster') return showMonsterProfile(data);
    if (type === 'chat_result') return showChat(data);
  };
  const drainQueue = async () => {
    if (queueRunning) return;
    queueRunning = true;
    while (eventQueue.length) {
      const next = eventQueue.shift();
      try { await present(next); } catch (_) {}
    }
    queueRunning = false;
  };
  const enqueue = (type,data) => {
    if (criticalEventTypes.has(type)) {
      for (let index = eventQueue.length - 1; index >= 0; index -= 1) {
        if (lowerCardEventTypes.has(eventQueue[index].type)) eventQueue.splice(index, 1);
      }
    } else if (lowerCardEventTypes.has(type) && (node('battle').classList.contains('visible') || eventQueue.some(entry => criticalEventTypes.has(entry.type)))) {
      const existing = eventQueue.find(entry => entry.type === type);
      if (existing) { existing.data = data; return; }
    }
    eventQueue.push({ type,data });
    if (eventQueue.length > 30) eventQueue.splice(0,eventQueue.length - 30);
    drainQueue();
  };
  const socket = typeof io === 'function' ? io() : null;
  if (!socket) return;
  const refreshOverlayConfig = async () => {
    try {
      const response = await fetch('/api/streammonsters/state');
      if (!response.ok) return;
      const state = await response.json();
      setBottomOverlayDuration(state?.config?.bottomOverlayDurationMs);
      setArenaConfig(state?.config);
      if (typeof state?.commandPrefix === 'string' && state.commandPrefix) commandPrefix = state.commandPrefix;
      if (state?.battle?.match?.battle) enqueue('battle_snapshot', state.battle.match);
    } catch (_) {}
  };
  const eventTypes = {
    'streammonsters:stream_started':'stream_started',
    'streammonsters:egg_spawned':'egg_spawned',
    'streammonsters:egg_boosted':'egg_boosted',
    'streammonsters:gift_combo':'gift_combo',
    'streammonsters:hype_changed':'hype_changed',
    'streammonsters:egg_ready':'egg_ready',
    'streammonsters:hatch_started':'hatch_started',
    'streammonsters:egg_hatched':'egg_hatched',
    'streammonsters:monster_visual_evolved':'monster_visual_evolved',
    'streammonsters:battle_match_found':'battle_match_found',
    'streammonsters:battle_cancelled':'battle_cancelled',
    'streammonsters:battle_roster_locked':'battle_roster_locked',
    'streammonsters:battle_started':'battle_started',
    'streammonsters:battle_skill_prompt':'battle_skill_prompt',
    'streammonsters:battle_skill_locked':'battle_skill_locked',
    'streammonsters:battle_action':'battle_action',
    'streammonsters:battle_knockout':'battle_knockout',
    'streammonsters:battle_round':'battle_round',
    'streammonsters:battle_completed':'battle_completed',
    'streammonsters:monster_xp_awarded':'monster_xp_awarded',
    'streammonsters:monster_level_up':'monster_level_up',
    'streammonsters:monster_stat_prompt':'monster_stat_prompt',
    'streammonsters:monster_stat_chosen':'monster_stat_chosen',
    'streammonsters:monster_stat_auto_assigned':'monster_stat_auto_assigned',
    'streammonsters:achievement_unlocked':'achievement_unlocked',
    'streammonsters:season_rank_changed':'season_rank_changed',
    'streammonsters:quest_completed':'quest_completed',
    'streammonsters:config_changed':'config_changed',
    'streammonsters:chat_result':'chat_result'
  };
  Object.entries(eventTypes).forEach(([eventName,type]) => socket.on(eventName,data => enqueue(type,data)));
  socket.on('connect', refreshOverlayConfig);
  refreshOverlayConfig();
})();
</script>
</body>
</html>
