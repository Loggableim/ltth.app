<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream Monsters · Collector Arena Overlay</title>
  <style>
    :root { --ink:#f8f7ff; --muted:#bdc5dc; --violet:#a984ff; --cyan:#55dcff; --mint:#6ef1b8; --gold:#ffd76f; }
    * { box-sizing:border-box; }
    body { margin:0; overflow:hidden; color:var(--ink); background:transparent; font-family:Inter,Segoe UI,Arial,sans-serif; }
    #streammonsters-overlay { position:fixed; inset:0; pointer-events:none; }
    #brand {
      position:absolute; top:28px; left:30px; width:250px; height:70px; object-fit:contain; object-position:left center;
      opacity:.88; filter:drop-shadow(0 8px 20px #0009);
    }
    #hype {
      position:absolute; top:30px; right:34px; display:grid; place-items:center; width:92px; height:92px;
      border:3px solid #725ba5; border-radius:50%; background:conic-gradient(var(--violet) var(--hype),#172039 0);
      box-shadow:0 12px 40px #0009; opacity:0; transform:scale(.8); transition:.28s;
    }
    #hype::before { content:""; position:absolute; inset:7px; border-radius:50%; background:#101629f2; }
    #hype.visible { opacity:1; transform:none; }
    #hype-value { position:relative; font-weight:900; font-size:19px; }
    #toast {
      position:absolute; left:50%; top:32px; max-width:620px; padding:10px 18px; border:1px solid #675397;
      border-radius:999px; background:#151229ee; box-shadow:0 14px 38px #0008; opacity:0;
      transform:translate(-50%,-18px); transition:.3s; text-align:center;
    }
    #toast.visible { opacity:1; transform:translate(-50%,0); }
    #card {
      position:absolute; right:38px; bottom:38px; display:grid; grid-template-columns:158px minmax(250px,1fr); gap:18px;
      width:min(610px,calc(100vw - 76px)); min-height:190px; padding:18px; border:1px solid #6d77a5; border-radius:27px;
      background:linear-gradient(140deg,#202a46f5,#101628f7); box-shadow:0 28px 80px #000b;
      opacity:0; transform:translateX(100px) scale(.94); transition:.35s cubic-bezier(.2,.85,.25,1.1);
    }
    #card.visible { opacity:1; transform:none; }
    #card.charged { border-color:#d5b4ff; box-shadow:0 0 50px #9d72ff69,0 28px 80px #000b; }
    #art-wrap { display:grid; place-items:center; overflow:hidden; border-radius:20px; background:radial-gradient(circle,#4a3b7c,#0a1020 70%); }
    #art { width:158px; height:158px; object-fit:contain; filter:drop-shadow(0 12px 16px #0009); }
    #kicker { color:#dac9ff; text-transform:uppercase; letter-spacing:.12em; font-size:12px; font-weight:900; }
    #title { margin:5px 0; font-size:clamp(28px,3vw,39px); line-height:1.03; }
    #subtitle { color:var(--muted); font-size:16px; }
    #hint { margin-top:11px; color:var(--mint); font-size:14px; font-weight:700; }
    #progress { height:9px; margin-top:13px; overflow:hidden; border-radius:99px; background:#070b13; }
    #bar { width:0; height:100%; background:linear-gradient(90deg,var(--cyan),var(--violet),var(--gold)); transition:width .5s; }
    #battle {
      position:absolute; left:50%; top:50%; width:min(760px,calc(100vw - 80px)); padding:26px; border:1px solid #9676d2;
      border-radius:28px; text-align:center; background:linear-gradient(140deg,#261841f2,#101a30f4); box-shadow:0 30px 100px #000c;
      opacity:0; transform:translate(-50%,-45%) scale(.9); transition:.35s;
    }
    #battle.visible { opacity:1; transform:translate(-50%,-50%) scale(1); }
    #battle-kicker { color:var(--gold); text-transform:uppercase; letter-spacing:.13em; font-size:12px; font-weight:900; }
    #versus { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:20px; margin:15px 0; font-size:28px; font-weight:900; }
    #versus .vs { color:var(--gold); font-size:15px; }
    #battle-detail { color:var(--muted); font-size:18px; }
    #round-dots { display:flex; justify-content:center; gap:8px; margin-top:14px; }
    #round-dots span { width:12px; height:12px; border:1px solid #7c6aa5; border-radius:50%; background:#181e34; }
    #round-dots span.active { background:var(--gold); box-shadow:0 0 16px #ffcf59; }
    #chat-card {
      position:absolute; left:34px; bottom:34px; max-width:min(460px,calc(100vw - 68px)); padding:12px 15px;
      border:1px solid #3d6d75; border-radius:15px; color:#dffcff; background:#0d2429eb; box-shadow:0 16px 42px #0009;
      opacity:0; transform:translateY(35px); transition:.28s;
    }
    #chat-card.visible { opacity:1; transform:none; }
    @media (orientation: portrait) {
      #brand { top:20px; left:20px; width:210px; height:58px; }
      #hype { top:18px; right:20px; width:76px; height:76px; }
      #toast { top:104px; width:calc(100vw - 32px); }
      #card { right:16px; bottom:50px; grid-template-columns:1fr; width:calc(100vw - 32px); text-align:center; }
      #art-wrap { width:160px; height:160px; margin:auto; }
      #battle { top:48%; width:calc(100vw - 32px); padding:22px 14px; }
      #versus { gap:9px; font-size:21px; }
      #chat-card { left:16px; bottom:18px; max-width:calc(100vw - 32px); }
    }
  </style>
</head>
<body>
<main id="streammonsters-overlay" aria-live="polite">
  <img id="brand" src="/plugins/streamalchemy/assets/branding/stream-monsters-logo.png" alt="">
  <div id="hype" style="--hype:0%"><span id="hype-value">0%</span></div>
  <div id="toast"></div>
  <section id="card">
    <div id="art-wrap"><img id="art" alt=""></div>
    <div>
      <div id="kicker" data-i18n="plugins.streamalchemy.ui.monsters.overlayBrand">Stream Monsters</div>
      <h1 id="title" data-i18n="plugins.streamalchemy.ui.monsters.overlayTitle">Collector Arena</h1>
      <div id="subtitle" data-i18n="plugins.streamalchemy.ui.monsters.overlayWaiting">Das nächste Monster wartet.</div>
      <div id="progress"><div id="bar"></div></div>
      <div id="hint" data-i18n="plugins.streamalchemy.ui.monsters.overlayCommands">!eggs · !hatch [slot] · !battle</div>
    </div>
  </section>
  <section id="battle">
    <div id="battle-kicker" data-i18n="plugins.streamalchemy.ui.monsters.overlayBattleKicker">Collector Arena · Drei Runden</div>
    <div id="versus"><span id="fighterA" data-i18n="plugins.streamalchemy.ui.monsters.monsterA">Monster A</span><span class="vs">VS</span><span id="fighterB" data-i18n="plugins.streamalchemy.ui.monsters.monsterB">Monster B</span></div>
    <div id="battle-detail" data-i18n="plugins.streamalchemy.ui.monsters.battlePreparing">Die Arena wird vorbereitet …</div>
    <div id="round-dots"><span></span><span></span><span></span></div>
  </section>
  <div id="chat-card"></div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/i18n-client.js"></script>
<script src="/plugins/streamalchemy/streammonsters-overlay-runtime.js"></script>
<script>
(async () => {
  await window.i18n?.init?.();
  window.i18n?.updateDOM?.();

  const node = id => document.getElementById(id);
  const value = (input, fallback = '') => String(input ?? fallback);
  const text = (key, fallback, params = {}) => {
    const fullKey = `plugins.streamalchemy.ui.monsters.${key}`;
    const translated = window.i18n?.t?.(fullKey, params);
    if (translated && translated !== fullKey) return translated;
    return fallback.replace(/\{(\w+)\}/g, (match, name) => name in params ? params[name] : match);
  };
  const rankLabel = rank => ({
    Bronze: text('rankBronze', 'Bronze'),
    Silver: text('rankSilver', 'Silber'),
    Crystal: text('rankCrystal', 'Kristall')
  }[rank] || value(rank, text('rankNew', 'Neuer Rang')));
  const itemName = item => value(item?.name || item?.gift_name || item?.giftName, text('eggFallback', 'Element-Ei'));
  const stanceName = stance => ({
    power: text('stancePower', 'Kraft'),
    guard: text('stanceGuard', 'Schutz'),
    speed: text('stanceSpeed', 'Tempo')
  }[String(stance || '').toLowerCase()] || value(stance, text('unknown', 'unbekannt')));
  const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
  const eventQueue = window.StreamMonstersOverlayRuntime.createPriorityQueue({
    maxSize: 30,
    staleAfterMs: 15000
  });
  const chatCooldowns = new Map();
  let queueRunning = false;
  let snapshotReady = false;
  let battleNames = [text('monsterA', 'Monster A'), text('monsterB', 'Monster B')];
  let battleIds = [null, null];
  let battleAdvantageName = '';

  const readAudioSettings = () => ({
    muted: localStorage.getItem('streammonsters-overlay-muted') === 'true',
    volume: window.StreamMonstersOverlayRuntime.normalizeVolume(
      localStorage.getItem('streammonsters-overlay-volume')
    )
  });
  const playCue = cue => {
    const settings = readAudioSettings();
    if (settings.muted || !settings.volume) return;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    try {
      const context = new AudioContextClass();
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      const profile = {
        spawn: [330, 0.12],
        ready: [660, 0.16],
        hatch: [880, 0.28],
        hit: [180, 0.08],
        win: [1046, 0.32]
      }[cue] || [440, 0.1];
      oscillator.type = cue === 'hit' ? 'square' : 'sine';
      oscillator.frequency.value = profile[0];
      gain.gain.setValueAtTime(settings.volume * 0.12, context.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + profile[1]);
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start();
      oscillator.stop(context.currentTime + profile[1]);
      oscillator.addEventListener('ended', () => context.close());
    } catch (_) {}
  };
  const showToast = async (message, duration = 2600, cue = null) => {
    if (cue) playCue(cue);
    node('toast').textContent = message;
    node('toast').classList.add('visible');
    await wait(duration);
    node('toast').classList.remove('visible');
    await wait(250);
  };
  const showCard = async ({ kicker, title, subtitle, imageUrl, progress = 0, charged = false, hint, cue = null }) => {
    if (cue) playCue(cue);
    node('kicker').textContent = kicker;
    node('title').textContent = title;
    node('subtitle').textContent = subtitle;
    node('art').src = imageUrl || '/plugins/streamalchemy/assets/branding/stream-monsters-icon.png';
    node('bar').style.width = `${Math.max(0, Math.min(100, progress))}%`;
    node('hint').textContent = hint || text('overlayCommands', '!eggs · !hatch [slot] · !battle');
    node('card').classList.toggle('charged', Boolean(charged));
    node('card').classList.add('visible');
    await wait(3900);
    node('card').classList.remove('visible');
    await wait(350);
  };
  const showBattle = async ({ left, right, detail, round = 0, winner = false, cue = null }) => {
    if (cue) playCue(cue);
    battleNames = [left || battleNames[0], right || battleNames[1]];
    node('fighterA').textContent = battleNames[0];
    node('fighterB').textContent = battleNames[1];
    node('battle-detail').textContent = detail;
    [...node('round-dots').children].forEach((dot, index) => dot.classList.toggle('active', index < round));
    node('battle').classList.add('visible');
    await wait(winner ? 4300 : 2600);
    node('battle').classList.remove('visible');
    await wait(300);
  };
  const showHype = async data => {
    const points = Number(data?.hype?.points) || 0;
    node('hype').style.setProperty('--hype', `${points}%`);
    node('hype-value').textContent = data?.hype?.charged_eggs
      ? text('charged', 'CHARGED!')
      : `${points}%`;
    node('hype').classList.add('visible');
    await wait(2600);
    node('hype').classList.remove('visible');
  };
  const showChat = async data => {
    const userId = value(data?.userId,'Viewer');
    const previous = chatCooldowns.get(userId) || 0;
    if (Date.now() - previous < 4500) return;
    chatCooldowns.set(userId,Date.now());
    const messageKey = window.StreamMonstersOverlayRuntime.chatMessageKey(data?.result);
    const message = text(messageKey, 'Command result is unavailable.');
    node('chat-card').textContent = `${userId} · ${message}`;
    node('chat-card').classList.add('visible');
    await wait(2800);
    node('chat-card').classList.remove('visible');
  };
  const applySnapshot = data => {
    const points = Number(data?.hype?.points) || 0;
    const prefix = value(data?.gcce?.commandPrefix, '!');
    const duration = Math.max(0, Number(data?.config?.hatchDurationMs) || 0);
    const minutes = Math.round(duration / 60000);
    node('hype').style.setProperty('--hype', `${points}%`);
    node('hype-value').textContent = data?.hype?.charged_eggs
      ? text('charged', 'CHARGED!')
      : `${points}%`;
    node('hint').textContent = text(
      'snapshotRules',
      '{prefix}eggs · {prefix}hatch [slot] · {minutes} min',
      { prefix, minutes }
    );
  };
  const present = async ({ type, data }) => {
    if (type === 'state_snapshot') {
      applySnapshot(data);
      return;
    }
    if (type === 'stream_started' || type === 'elemental_hour') return showToast(text(
      'elementalHourActive',
      '{element} Hour ist aktiv',
      { element: value(data?.event?.element || data?.element, 'Element') }
    ));
    if (type === 'egg_spawned') return showCard({
      kicker: text('eggKicker', '{element} · {variant}', {
        element: value(data?.egg?.element, 'Element'),
        variant: value(data?.egg?.variant, 'standard')
      }),
      title: text('newEgg', 'Ein neues Ei!'),
      subtitle: text('eggSpawned', '{viewer} hat einen Brutplatz gefüllt.', {
        viewer: value(data?.userId, 'Viewer')
      }),
      imageUrl:data?.egg?.image_url,
      charged:data?.egg?.variant === 'charged',
      hint: text('eggsTimer', '!eggs zeigt den Timer'),
      progress:4,
      cue:'spawn'
    });
    if (type === 'egg_boosted') return showCard({
      kicker: text('speedBoost', 'Tempo-Boost'),
      title: text('eggGlows', 'Das Ei leuchtet!'),
      subtitle: text('boostFair', 'Ein ausgewähltes Gift hat nur die Brutzeit verkürzt.'),
      imageUrl:data?.egg?.image_url,
      progress:62
    });
    if (type === 'gift_combo') return showToast(text(
      'hypeCombo',
      'Hype-Combo für {viewer} · +20',
      { viewer: value(data?.userId, text('viewerFallback', 'einen Viewer')) }
    ));
    if (type === 'hype_changed') return showHype(data);
    if (type === 'hype_milestone') return showCard({
      kicker: text('hypeMilestone', 'Hype-Meilenstein'),
      title: text('hypeMilestoneTitle', '{points}% Stream-Hype', {
        points: Number(data?.hype?.points ?? data?.points) || 0
      }),
      subtitle: text('hypeMilestoneCopy', 'Die Collector Arena ist aufgeladen.'),
      progress: Number(data?.hype?.points ?? data?.points) || 0,
      charged: true,
      cue: 'ready'
    });
    if (type === 'egg_ready') return showCard({
      kicker: text('ready', 'Bereit!'),
      title: text('eggReadyTitle', '{element}-Ei kann schlüpfen', {
        element: value(data?.egg?.element, 'Element')
      }),
      subtitle: text('hatchMoment', '{viewer}, dein Moment gehört dir.', {
        viewer: value(data?.userId, 'Viewer')
      }),
      imageUrl:data?.egg?.image_url,
      progress:100,
      charged:data?.egg?.variant === 'charged',
      hint: text('hatchNow', 'Jetzt !hatch [slot] schreiben'),
      cue:'ready'
    });
    if (type === 'hatch_started') return showToast(text(
      'hatchStarted',
      '{viewer} öffnet ein {element}-Ei …',
      {
        viewer: value(data?.userId, 'Viewer'),
        element: value(data?.egg?.element, 'Element')
      }
    ), 1800, 'hatch');
    if (type === 'egg_hatched') return showCard({
      kicker: text('monsterKicker', '{element} · {personality}', {
        element: value(data?.monster?.element, data?.egg?.element),
        personality: value(data?.monster?.personality, text('curious', 'Neugierig'))
      }),
      title: text('hatchedTitle', '{name} ist da!', { name: itemName(data?.monster) }),
      subtitle: text('hatchedCopy', '28 faire Startpunkte · gehört {viewer} dauerhaft.', {
        viewer: value(data?.userId, text('viewerOwner', 'dem Viewer'))
      }),
      imageUrl:data?.monster?.image_url || data?.egg?.image_url,
      charged:data?.egg?.variant === 'charged',
      hint: text('monsterCardHint', '!monster [slot] zeigt die Karte'),
      progress:100,
      cue:'hatch'
    });
    if (type === 'starter_revealed') return showCard({
      kicker: text('starter', 'Starter-Monster'),
      title: itemName(data?.monster || data?.egg),
      subtitle: text('starterCopy', 'Deine Collector-Reise beginnt.'),
      imageUrl: data?.monster?.image_url || data?.egg?.image_url,
      progress: 100,
      cue: 'spawn'
    });
    if (type === 'monster_visual_evolved') return showCard({
      kicker: text('evolution', 'Kosmetische Evolution'),
      title: text('evolvedTitle', '{name} strahlt neu', { name: itemName(data?.monster) }),
      subtitle: text('evolvedCopy', 'KI-Kunst ersetzt Kenney. Name, Werte und Besitz bleiben unverändert.'),
      imageUrl:data?.monster?.image_url,
      charged:true,
      progress:100
    });
    if (type === 'stance_revealed') return showToast(text(
      'stanceCard',
      '{monster} kämpft in Haltung {stance}.',
      {
        monster: itemName(data?.monster),
        stance: stanceName(data?.stance)
      }
    ));
    if (type === 'battle_started') return showBattle({
      left:itemName(data?.challenger),
      right:itemName(data?.defender),
      detail:(() => {
        battleIds = [data?.challenger?.monster_id,data?.defender?.monster_id];
        battleAdvantageName = data?.elementAdvantageMonsterId === battleIds[0]
          ? itemName(data?.challenger)
          : (data?.elementAdvantageMonsterId === battleIds[1] ? itemName(data?.defender) : '');
        const stances = text('stancePair', '{left}: {stanceA} · {right}: {stanceB}', {
          left: itemName(data?.challenger),
          stanceA: stanceName(data?.stanceA),
          right: itemName(data?.defender),
          stanceB: stanceName(data?.stanceB)
        });
        return battleAdvantageName
          ? text('battleAdvantage', '{monster} hat Elementvorteil · {stances} · Seed gespeichert', {
            monster: battleAdvantageName,
            stances
          })
          : text('battleNoAdvantage', 'Kein Elementvorteil · {stances} · Seed gespeichert', { stances });
      })(),
      cue:'hit'
    });
    if (type === 'battle_round') {
      const round = Number(data?.round?.number) || 1;
      return showBattle({
        left:battleNames[0],
        right:battleNames[1],
        round,
        detail: text('battleRound', 'Runde {round} · {first} / {second} Schaden{advantage}', {
          round,
          first: data?.round?.firstDamage || 0,
          second: data?.round?.secondDamage || 0,
          advantage: battleAdvantageName ? ` · Vorteil ${battleAdvantageName}` : ''
        }),
        cue:'hit'
      });
    }
    if (type === 'battle_completed') return showBattle({
      left:battleNames[0],
      right:battleNames[1],
      round:3,
      winner:true,
      detail:text('battleWinner', '{monster} gewinnt!', { monster: itemName(data?.winner) }),
      cue:'win'
    });
    if (type === 'win_streak') return showCard({
      kicker: text('winStreak', 'Siegesserie'),
      title: text('winStreakTitle', '{monster} · {count} Siege', {
        monster: itemName(data?.monster),
        count: Number(data?.count) || 0
      }),
      subtitle: text('winStreakCopy', 'Die Arena merkt sich jede Serie.'),
      progress: 100,
      charged: true,
      cue: 'win'
    });
    if (type === 'upset') return showCard({
      kicker: text('upset', 'Überraschungssieg'),
      title: text('upsetTitle', '{winner} besiegt den Favoriten!', {
        winner: itemName(data?.winner)
      }),
      subtitle: text('upsetCopy', 'Der reproduzierbare Seed hat eine Überraschung geliefert.'),
      progress: 100,
      charged: true,
      cue: 'win'
    });
    if (type === 'rivalry') return showCard({
      kicker: text('rivalry', 'Rivalität'),
      title: text('rivalryTitle', '{left} gegen {right}', {
        left: itemName(data?.left || data?.challenger),
        right: itemName(data?.right || data?.defender)
      }),
      subtitle: text('rivalryCopy', 'Diese Monster treffen wieder aufeinander.'),
      progress: 100
    });
    if (type === 'achievement_unlocked') return showCard({
      kicker:text('achievement', 'Achievement freigeschaltet'),
      title:value(data?.achievement?.achievement_key, text('milestone', 'Neuer Meilenstein')).replaceAll('_', ' '),
      subtitle:text('achievementCopy', '{viewer} erweitert die Collector-Karte.', {
        viewer: value(data?.userId, 'Viewer')
      }),
      progress:100,
      charged:true
    });
    if (type === 'season_rank_changed' || type === 'rank_card') return showCard({
      kicker:text('rankCard', 'Rangkarte'),
      title:text('rankReachedTitle', '{rank}!', { rank: rankLabel(data?.after || data?.rank) }),
      subtitle:text('rankReachedCopy', '{viewer} erreicht {points} Saisonpunkte.', {
        viewer: value(data?.userId, 'Viewer'),
        points: data?.score?.points || data?.points || 0
      }),
      progress:100,
      charged:true,
      cue:'win'
    });
    if (type === 'quest_completed') return showToast(text('questComplete', 'Quest geschafft · {reward}', {
      reward: value(data?.quest?.title, text('reward', 'Belohnung eingesammelt'))
    }));
    if (type === 'chat_result') return showChat(data);
  };
  const drainQueue = async () => {
    if (queueRunning || !snapshotReady) return;
    queueRunning = true;
    while (snapshotReady) {
      const next = eventQueue.shift(Date.now());
      if (!next) break;
      try { await present(next); } catch (_) {}
      if (!snapshotReady) break;
    }
    queueRunning = false;
  };
  const enqueue = (type, data) => {
    eventQueue.enqueue(type, data, Date.now());
    drainQueue();
  };
  const socket = typeof io === 'function' ? io() : null;
  if (!socket) return;
  const reconnectController = window.StreamMonstersOverlayRuntime.createReconnectController({
    queue: eventQueue,
    loadSnapshot: async signal => {
      const response = await fetch('/api/streammonsters/state', { signal });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    },
    fallbackSnapshot: () => ({
      hype: { points: 0 },
      gcce: { commandPrefix: '!' },
      config: { hatchDurationMs: 0 }
    })
  });
  const eventTypes = {
    'streammonsters:stream_started':'stream_started',
    'streammonsters:starter_claimed':'starter_revealed',
    'streammonsters:stance_revealed':'stance_revealed',
    'streammonsters:egg_spawned':'egg_spawned',
    'streammonsters:egg_boosted':'egg_boosted',
    'streammonsters:gift_combo':'gift_combo',
    'streammonsters:hype_changed':'hype_changed',
    'streammonsters:hype_milestone':'hype_milestone',
    'streammonsters:elemental_hour':'elemental_hour',
    'streammonsters:egg_ready':'egg_ready',
    'streammonsters:hatch_started':'hatch_started',
    'streammonsters:egg_hatched':'egg_hatched',
    'streammonsters:monster_visual_evolved':'monster_visual_evolved',
    'streammonsters:battle_started':'battle_started',
    'streammonsters:battle_round':'battle_round',
    'streammonsters:battle_completed':'battle_completed',
    'streammonsters:win_streak':'win_streak',
    'streammonsters:upset':'upset',
    'streammonsters:rivalry':'rivalry',
    'streammonsters:achievement_unlocked':'achievement_unlocked',
    'streammonsters:season_rank_changed':'rank_card',
    'streammonsters:quest_completed':'quest_completed',
    'streammonsters:chat_result':'chat_result'
  };
  Object.entries(eventTypes).forEach(([eventName, type]) => socket.on(eventName, data => enqueue(type, data)));
  socket.on('connect', async () => {
    snapshotReady = false;
    const completed = await reconnectController.reconnect();
    snapshotReady = reconnectController.isSnapshotReady();
    if (completed) drainQueue();
  });
})();
</script>
