<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STT Ticker Overlay</title>
  <style>
    /* ============================================================
       BASE RESET & GLOBAL
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    /* ============================================================
       TICKER CONTAINER
       ============================================================ */
    #ticker-container {
      position: fixed;
      z-index: 9999;
      max-width: 90vw;
      padding: 12px 20px;
      border-radius: 8px;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }
    #ticker-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Positionen */
    #ticker-container.pos-bottom-center {
      bottom: 40px; left: 50%; transform: translateX(-50%);
    }
    #ticker-container.pos-bottom-left {
      bottom: 40px; left: 20px;
    }
    #ticker-container.pos-bottom-right {
      bottom: 40px; right: 20px;
    }
    #ticker-container.pos-top-center {
      top: 40px; left: 50%; transform: translateX(-50%);
    }
    #ticker-container.pos-top-left {
      top: 40px; left: 20px;
    }
    #ticker-container.pos-top-right {
      top: 40px; right: 20px;
    }
    #ticker-container.pos-middle-center {
      top: 50%; left: 50%; transform: translate(-50%, -50%);
    }

    /* ============================================================
       TICKER TEXT
       ============================================================ */
    #ticker-text {
      line-height: 1.4;
      text-align: center;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    #ticker-text .speaker-label {
      display: inline-block;
      font-size: 0.6em;
      opacity: 0.7;
      margin-right: 8px;
      vertical-align: middle;
    }
    #ticker-text .timestamp {
      display: block;
      font-size: 0.5em;
      opacity: 0.4;
      margin-top: 4px;
    }

    /* ============================================================
       SPEAKER INDICATOR
       ============================================================ */
    #speaker-indicator {
      display: none;
      font-size: 0.7em;
      opacity: 0.6;
      margin-bottom: 4px;
      text-align: inherit;
    }
    #speaker-indicator.active {
      display: block;
    }
    #speaker-indicator .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse-dot 1.5s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ============================================================
       CONNECTION STATUS
       ============================================================ */
    #connection-status {
      position: fixed;
      top: 10px; right: 10px;
      z-index: 10000;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(0,0,0,0.6);
      color: #aaa;
      display: none;
    }
    #connection-status.visible { display: block; }
    #connection-status.connected { color: #4CAF50; }
    #connection-status.disconnected { color: #f44336; }
    #connection-status.listening { color: #FFC107; }

    /* ============================================================
       ANIMATIONS
       ============================================================ */
    /* Fade */
    #ticker-container.anim-fade .ticker-line {
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Slide */
    #ticker-container.anim-slide .ticker-line {
      animation: slideIn 0.4s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Typing */
    #ticker-container.anim-typing .ticker-line {
      overflow: hidden;
      white-space: nowrap;
      animation: typing 0.5s steps(40, end);
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    /* ============================================================
       DESIGN: CLASSIC (TV-Untertitel)
       ============================================================ */
    #ticker-container.design-classic {
      background: rgba(0, 0, 0, 0.8);
      border-radius: 0;
      padding: 10px 16px;
      font-family: 'Arial', 'Helvetica', sans-serif;
    }
    #ticker-container.design-classic #ticker-text {
      font-size: 32px;
      font-weight: bold;
      color: #FFFFFF;
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 0.5px;
    }

    /* ============================================================
       DESIGN: MODERN (Clean, Blur)
       ============================================================ */
    #ticker-container.design-modern {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    #ticker-container.design-modern #ticker-text {
      font-size: 34px;
      font-weight: 400;
      color: #FFFFFF;
      letter-spacing: 0.3px;
    }

    /* ============================================================
       DESIGN: MINIMAL (Nur Text)
       ============================================================ */
    #ticker-container.design-minimal {
      background: transparent;
      padding: 0;
      border-radius: 0;
    }
    #ticker-container.design-minimal #ticker-text {
      font-size: 36px;
      font-weight: 500;
      color: #FFFFFF;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    /* ============================================================
       DESIGN: NEON (Glow-Effekt)
       ============================================================ */
    #ticker-container.design-neon {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
    }
    #ticker-container.design-neon #ticker-text {
      font-size: 36px;
      font-weight: 700;
      color: #00FFFF;
      text-shadow: 0 0 10px #00FFFF, 0 0 20px #00FFFF, 0 0 40px #00FFFF;
      letter-spacing: 2px;
    }

    /* ============================================================
       DESIGN: GLASS (Glasmorphismus)
       ============================================================ */
    #ticker-container.design-glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    #ticker-container.design-glass #ticker-text {
      font-size: 32px;
      font-weight: 300;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }

    /* ============================================================
       DESIGN: COMPACT (Klein, viele Zeilen)
       ============================================================ */
    #ticker-container.design-compact {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 4px;
      padding: 6px 12px;
      max-width: 60vw;
    }
    #ticker-container.design-compact #ticker-text {
      font-size: 20px;
      font-weight: 400;
      color: #DDD;
      line-height: 1.2;
    }

    /* ============================================================
       DESIGN: CINEMATIC (Film-Untertitel)
       ============================================================ */
    #ticker-container.design-cinematic {
      background: rgba(0, 0, 0, 0.75);
      border-radius: 0;
      padding: 8px 24px;
      max-width: 80vw;
    }
    #ticker-container.design-cinematic #ticker-text {
      font-size: 40px;
      font-weight: 500;
      color: #FFFFFF;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      letter-spacing: 1px;
      line-height: 1.3;
    }

    /* ============================================================
       DESIGN: SCROLLING (Laufband)
       ============================================================ */
    #ticker-container.design-scrolling {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 0;
      padding: 8px 0;
      max-width: 100vw;
      width: 100%;
      left: 0 !important;
      right: 0 !important;
      overflow: hidden;
    }
    #ticker-container.design-scrolling #ticker-text {
      font-size: 28px;
      font-weight: 500;
      color: #FFD700;
      white-space: nowrap;
      display: inline-block;
      animation: scroll-text 20s linear infinite;
    }
    @keyframes scroll-text {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }

    /* ============================================================
       DESIGN: KARAOKE (Wort-Highlight)
       ============================================================ */
    #ticker-container.design-karaoke {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 16px 24px;
    }
    #ticker-container.design-karaoke #ticker-text {
      font-size: 36px;
      font-weight: 600;
      color: #888;
    }
    #ticker-container.design-karaoke #ticker-text .word {
      transition: color 0.3s ease;
    }
    #ticker-container.design-karaoke #ticker-text .word.active {
      color: #FFD700;
    }
    #ticker-container.design-karaoke #ticker-text .word.done {
      color: #FFFFFF;
    }

    /* ============================================================
       ACCESSIBILITY: HIGH CONTRAST
       ============================================================ */
    #ticker-container.a11y-high-contrast {
      background: #000 !important;
      border: 2px solid #FFF !important;
    }
    #ticker-container.a11y-high-contrast #ticker-text {
      color: #FFF !important;
      text-shadow: none !important;
      font-weight: 900 !important;
    }

    /* ============================================================
       ACCESSIBILITY: COLOR BLIND
       ============================================================ */
    #ticker-container.a11y-color-blind #ticker-text {
      color: #FFFFFF !important;
    }
    #ticker-container.a11y-color-blind.design-neon #ticker-text {
      color: #FFFFFF !important;
      text-shadow: 0 0 10px #FFFFFF !important;
    }

    /* ============================================================
       ACCESSIBILITY: LARGE TEXT
       ============================================================ */
    #ticker-container.a11y-large-text #ticker-text {
      font-size: 48px !important;
    }

    /* ============================================================
       ACCESSIBILITY: DYSLEXIC FONT
       ============================================================ */
    #ticker-container.a11y-dyslexic #ticker-text {
      font-family: 'OpenDyslexic', 'Comic Sans MS', sans-serif !important;
      letter-spacing: 0.35em !important;
      line-height: 1.6 !important;
    }

    /* ============================================================
       SLOW MODE (längere Anzeigedauer)
       ============================================================ */
    #ticker-container.a11y-slow-mode.design-scrolling #ticker-text {
      animation-duration: 40s !important;
    }

    /* ============================================================
       UPPERCASE
       ============================================================ */
    #ticker-container.uppercase #ticker-text {
      text-transform: uppercase;
    }

    /* ============================================================
       TRANSLATION DISPLAY
       ============================================================ */
    #ticker-text .translation-line {
      margin-top: 4px;
      font-style: italic;
      opacity: 0.95;
    }
    #ticker-text .translation-line::before {
      content: '🌐 ';
      font-size: 0.7em;
      opacity: 0.6;
    }
    #ticker-text .original-line {
      opacity: 0.85;
    }
    #ticker-text .translation-label {
      display: inline-block;
      font-size: 0.5em;
      opacity: 0.5;
      margin-right: 6px;
      vertical-align: middle;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ============================================================
       STATUS BADGE (Debug)
       ============================================================ */
    #status-badge {
      position: fixed;
      bottom: 5px; right: 5px;
      z-index: 10000;
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 3px;
      display: none;
    }
    #status-badge.visible { display: block; }
  </style>
</head>
<body>
  <!-- Ticker Container -->
  <div id="ticker-container" class="pos-bottom-center">
    <div id="speaker-indicator">
      <span class="dot" style="background:#4CAF50;"></span>
      <span id="speaker-label">Host</span>
    </div>
    <div id="ticker-text"></div>
  </div>

  <!-- Connection Status -->
  <div id="connection-status">Connecting...</div>

  <!-- Status Badge (Debug) -->
  <div id="status-badge"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ============================================================
    // URL PARAMETER PARSER
    // ============================================================
    const params = new URLSearchParams(window.location.search);

    function getParam(name, defaultValue) {
      const val = params.get(name);
      return val !== null ? val : defaultValue;
    }

    function getBoolParam(name, defaultValue) {
      const val = params.get(name);
      if (val === null) return defaultValue;
      return val === 'true' || val === '1' || val === 'yes';
    }

    function getNumParam(name, defaultValue) {
      const val = params.get(name);
      if (val === null) return defaultValue;
      const num = parseFloat(val);
      return isNaN(num) ? defaultValue : num;
    }

    // ============================================================
    // CONFIG FROM URL PARAMS
    // ============================================================
    const config = {
      design: getParam('design', 'classic'),
      position: getParam('position', 'bottom-center'),
      maxLines: getNumParam('maxLines', 2),
      fontSize: getParam('fontSize', ''),
      fontFamily: getParam('fontFamily', ''),
      textColor: getParam('textColor', ''),
      bgColor: getParam('bgColor', ''),
      bgBlur: getParam('bgBlur', ''),
      borderRadius: getParam('borderRadius', ''),
      padding: getParam('padding', ''),
      textAlign: getParam('textAlign', ''),
      opacity: getNumParam('opacity', 1.0),
      animation: getParam('animation', 'fade'),
      showSpeaker: getBoolParam('showSpeaker', false),
      speakerLabel: getParam('speakerLabel', 'Host'),
      showTimestamp: getBoolParam('showTimestamp', false),
      letterSpacing: getParam('letterSpacing', ''),
      lineHeight: getNumParam('lineHeight', 0),
      scrollSpeed: getNumParam('scrollSpeed', 50),
      glowColor: getParam('glowColor', ''),
      glowIntensity: getParam('glowIntensity', ''),
      uppercase: getBoolParam('uppercase', false),
      showInterim: getBoolParam('showInterim', true),
      highContrast: getBoolParam('highContrast', false),
      colorBlind: getBoolParam('colorBlind', false),
      slowMode: getBoolParam('slowMode', false),
      largeText: getBoolParam('largeText', false),
      dyslexic: getBoolParam('dyslexic', false),
      debug: getBoolParam('debug', false),
      // Translation display
      showTranslation: getBoolParam('showTranslation', true),
      translationColor: getParam('translationColor', '#FFD700'),
      translationLabel: getParam('translationLabel', 'EN'),
      // Audio capture
      autoCapture: getBoolParam('autoCapture', true),
      audioDeviceId: getParam('audioDeviceId', ''),
      // Server
      serverUrl: getParam('server', '')
    };

    // ============================================================
    // DOM REFS
    // ============================================================
    const container = document.getElementById('ticker-container');
    const tickerText = document.getElementById('ticker-text');
    const speakerIndicator = document.getElementById('speaker-indicator');
    const speakerLabel = document.getElementById('speaker-label');
    const connectionStatus = document.getElementById('connection-status');
    const statusBadge = document.getElementById('status-badge');

    // ============================================================
    // APPLY CONFIG TO DOM
    // ============================================================
    function applyConfig() {
      // Design-Klasse auf den Container (nicht body — OBS-Kompatibilität)
      container.className = [
        'pos-' + config.position,
        'design-' + config.design,
        'anim-' + config.animation,
        config.uppercase ? 'uppercase' : '',
        config.highContrast ? 'a11y-high-contrast' : '',
        config.colorBlind ? 'a11y-color-blind' : '',
        config.slowMode ? 'a11y-slow-mode' : '',
        config.largeText ? 'a11y-large-text' : '',
        config.dyslexic ? 'a11y-dyslexic' : ''
      ].filter(Boolean).join(' ');

      // Override-Stile
      const styleOverrides = {};
      if (config.fontSize) styleOverrides.fontSize = config.fontSize;
      if (config.fontFamily) styleOverrides.fontFamily = config.fontFamily;
      if (config.textColor) styleOverrides.color = config.textColor;
      if (config.bgColor) styleOverrides.background = config.bgColor;
      if (config.bgBlur) {
        styleOverrides.backdropFilter = 'blur(' + config.bgBlur + ')';
        styleOverrides['-webkit-backdrop-filter'] = 'blur(' + config.bgBlur + ')';
      }
      if (config.borderRadius) styleOverrides.borderRadius = config.borderRadius;
      if (config.padding) styleOverrides.padding = config.padding;
      if (config.textAlign) styleOverrides.textAlign = config.textAlign;
      if (config.opacity !== 1.0) styleOverrides.opacity = config.opacity;
      if (config.letterSpacing) styleOverrides.letterSpacing = config.letterSpacing;
      if (config.lineHeight > 0) styleOverrides.lineHeight = config.lineHeight;
      if (config.glowColor && config.glowIntensity) {
        styleOverrides.textShadow = '0 0 ' + config.glowIntensity + ' ' + config.glowColor;
      }

      Object.assign(container.style, styleOverrides);

      // Speaker
      if (config.showSpeaker) {
        speakerIndicator.classList.add('active');
        speakerLabel.textContent = config.speakerLabel;
      } else {
        speakerIndicator.classList.remove('active');
      }

      // Debug
      if (config.debug) {
        statusBadge.classList.add('visible');
      } else {
        statusBadge.classList.remove('visible');
      }
    }
    applyConfig();

    // ============================================================
    // SOCKET.IO CONNECTION
    // ============================================================
    let socket = null;
    let connected = false;

    function connectSocket() {
      const opts = {};
      if (config.serverUrl) {
        opts.server = config.serverUrl;
      }

      socket = io(opts.server || undefined, {
        transports: ['websocket', 'polling']
      });

      socket.on('connect', () => {
        connected = true;
        connectionStatus.textContent = 'Connected';
        connectionStatus.className = 'visible connected';
        setTimeout(() => { connectionStatus.classList.remove('visible'); }, 3000);
        socket.emit('stt-ticker:get-transcript');
      });

      socket.on('disconnect', () => {
        connected = false;
        connectionStatus.textContent = 'Disconnected';
        connectionStatus.className = 'visible disconnected';
      });

      socket.on('stt-ticker:transcript', (data) => {
        handleTranscript(data);
      });

      socket.on('stt-ticker:status', (data) => {
        if (config.debug) {
          statusBadge.textContent = 'ASR: ' + (data.asr?.sidekickAvailable ? 'Sidekick' : 'Direct') +
            ' | Segments: ' + (data.buffer?.segmentCount || 0);
        }
      });
    }

    // ============================================================
    // TRANSCRIPT HANDLING — Flüssiger Ticker
    // ============================================================
    let visibleSegments = [];  // { id, text, translation, timestamp }
    let segmentCounter = 0;
    const SEGMENT_DISPLAY_MS = 8000; // 8 Sekunden pro Segment anzeigen
    const FADE_DURATION_MS = 500;

    function handleTranscript(data) {
      if (!data || !data.text) return;

      const text = data.text;
      const translation = data.translation;

      // Neues Segment mit ID erzeugen
      segmentCounter++;
      const segment = {
        id: segmentCounter,
        text: text,
        translation: translation && translation.translated ? translation : null,
        timestamp: Date.now()
      };

      // Vorhandenes Segment mit ähnlichem Text ersetzen (gleicher Satz, fortgesetzt)
      const last = visibleSegments[visibleSegments.length - 1];
      if (last && textSimilarity(last.text, text) > 0.6) {
        // Fortsetzung: letztes Segment aktualisieren
        last.text = text;
        if (translation && translation.translated) {
          last.translation = translation;
        }
        last.timestamp = Date.now();
      } else {
        // Neues Segment hinzufügen
        visibleSegments.push(segment);
      }

      // Alte Segmente entfernen
      const now = Date.now();
      visibleSegments = visibleSegments.filter(s => (now - s.timestamp) < SEGMENT_DISPLAY_MS);

      // Max 3 Segmente gleichzeitig
      while (visibleSegments.length > 3) {
        visibleSegments.shift();
      }

      renderSegments();
    }

    function textSimilarity(a, b) {
      if (!a || !b) return 0;
      if (a === b) return 1;
      const wordsA = a.toLowerCase().split(/\s+/);
      const wordsB = b.toLowerCase().split(/\s+/);
      const setA = new Set(wordsA);
      const setB = new Set(wordsB);
      const intersection = new Set([...setA].filter(w => setB.has(w)));
      const union = new Set([...setA, ...setB]);
      return intersection.size / (union.size || 1);
    }

    function renderSegments() {
      if (visibleSegments.length === 0) {
        container.classList.remove('visible');
        return;
      }

      let html = '';

      for (let i = 0; i < visibleSegments.length; i++) {
        const seg = visibleSegments[i];
        const age = Date.now() - seg.timestamp;
        const opacity = Math.max(0.3, 1 - (age / SEGMENT_DISPLAY_MS));
        const isNewest = (i === visibleSegments.length - 1);

        // Original-Text
        html += '<div class="ticker-line original-line" style="opacity:' + opacity + '">'
          + escapeHtml(seg.text) + '</div>';

        // Übersetzung (nur beim neuesten Segment, darunter)
        if (seg.translation && config.showTranslation && isNewest) {
          const transColor = seg.translation.color || config.translationColor;
          html += '<div class="ticker-line translation-line" style="opacity:' + opacity + ';color:' + transColor + '">'
            + '<span class="translation-label">' + escapeHtml(config.translationLabel) + '</span>'
            + escapeHtml(seg.translation.text) + '</div>';
        }
      }

      if (config.showTimestamp) {
        const now = new Date();
        html += '<div class="timestamp">' + now.toLocaleTimeString() + '</div>';
      }

      tickerText.innerHTML = html;
      container.classList.add('visible');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ============================================================
    // AUDIO CAPTURE (AudioContext → PCM → WAV → Server)
    // ============================================================
    let audioContext = null;
    let scriptProcessor = null;
    let audioStream = null;
    let audioSource = null;
    let isCapturing = false;
    let audioBuffer = [];
    let captureInterval = null;
    let sendingWav = false;
    const SAMPLE_RATE = 16000;
    const CHUNK_DURATION_MS = 5000;
    const CHUNK_SAMPLES = Math.floor(SAMPLE_RATE * CHUNK_DURATION_MS / 1000);

    async function startAudioCapture() {
      if (isCapturing) return;
      if (!connected) {
        connectionStatus.textContent = 'Waiting for connection...';
        connectionStatus.className = 'visible disconnected';
        setTimeout(startAudioCapture, 1000);
        return;
      }

      try {
        const constraints = { audio: true };
        if (config.audioDeviceId) {
          constraints.audio = { deviceId: { exact: config.audioDeviceId } };
        }

        audioStream = await navigator.mediaDevices.getUserMedia(constraints);
        isCapturing = true;

        connectionStatus.textContent = '🎤 Listening...';
        connectionStatus.className = 'visible listening';

        audioContext = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: SAMPLE_RATE
        });
        audioSource = audioContext.createMediaStreamSource(audioStream);

        // ScriptProcessorNode für PCM-Daten (deprecated aber universell)
        scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
        audioSource.connect(scriptProcessor);
        scriptProcessor.connect(audioContext.destination);

        scriptProcessor.onaudioprocess = (event) => {
          const input = event.inputBuffer.getChannelData(0);
          // Float32 → Int16 konvertieren und sammeln
          for (let i = 0; i < input.length; i++) {
            audioBuffer.push(Math.max(-1, Math.min(1, input[i])));
          }

          // Senden wenn genug Samples gesammelt
          if (audioBuffer.length >= CHUNK_SAMPLES) {
            sendWavChunk();
          }
        };

        // Fallback: regelmäßig senden auch wenn wenig Audio
        captureInterval = setInterval(() => {
          if (audioBuffer.length > 0) {
            sendWavChunk();
          }
        }, CHUNK_DURATION_MS + 1000);

      } catch (error) {
        console.error('Microphone access denied:', error);
        connectionStatus.textContent = '🎤 Mic denied - ' + error.message;
        connectionStatus.className = 'visible disconnected';
        setTimeout(startAudioCapture, 5000);
      }
    }

    function stopAudioCapture() {
      isCapturing = false;
      if (captureInterval) {
        clearInterval(captureInterval);
        captureInterval = null;
      }
      if (scriptProcessor) {
        scriptProcessor.disconnect();
        scriptProcessor = null;
      }
      if (audioSource) {
        audioSource.disconnect();
        audioSource = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
      }
      audioBuffer = [];
      connectionStatus.textContent = 'Stopped';
      connectionStatus.className = 'visible';
      setTimeout(() => { connectionStatus.classList.remove('visible'); }, 2000);
    }

    function sendWavChunk() {
      if (!connected || audioBuffer.length < 1600 || sendingWav) return;
      sendingWav = true;

      const samples = audioBuffer.splice(0);
      const wavBlob = encodeWav(samples, SAMPLE_RATE);
      sendAudioChunk(wavBlob, 'audio/wav').finally(() => {
        sendingWav = false;
      });
    }

    function encodeWav(samples, sampleRate) {
      // Float32 → Int16
      const numChannels = 1;
      const bitsPerSample = 16;
      const byteRate = sampleRate * numChannels * bitsPerSample / 8;
      const blockAlign = numChannels * bitsPerSample / 8;
      const dataSize = samples.length * blockAlign;
      const bufferSize = 44 + dataSize;
      const buffer = new ArrayBuffer(bufferSize);
      const view = new DataView(buffer);

      // WAV Header
      writeString(view, 0, 'RIFF');
      view.setUint32(4, bufferSize - 8, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true); // chunk size
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true);
      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      // Samples
      let offset = 44;
      for (let i = 0; i < samples.length; i++) {
        const s = Math.max(-32768, Math.min(32767, Math.round(samples[i] * 32767)));
        view.setInt16(offset, s, true);
        offset += 2;
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    async function sendAudioChunk(blob, mimeType) {
      if (!connected) return;

      const formData = new FormData();
      formData.append('audio', blob, 'audio.wav');

      try {
        const baseUrl = config.serverUrl || '';
        const response = await fetch(baseUrl + '/api/stt-ticker/transcribe', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        if (!data.success && config.debug) {
          console.warn('Transcribe error:', data.message);
        }
      } catch (error) {
        if (config.debug) {
          console.error('Send audio failed:', error);
        }
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    function init() {
      connectSocket();

      // Auto-Capture starten
      if (config.autoCapture) {
        // Warte kurz, bis Socket verbunden ist
        setTimeout(startAudioCapture, 1500);
      }

      // Keyboard-Shortcuts (für OBS-Integration)
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' && e.ctrlKey) {
          e.preventDefault();
          if (isCapturing) {
            stopAudioCapture();
          } else {
            startAudioCapture();
          }
        }
        if (e.key === 'c' && e.ctrlKey) {
          e.preventDefault();
          fetch((config.serverUrl || '') + '/api/stt-ticker/clear', { method: 'POST' });
        }
      });
    }

    // Start when DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
