<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>STT Ticker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #FFFFFF;
    }
    /* Drei Zeilen, fix positioniert im unteren Drittel.
       Neuester Text = Zeile 3 (unten).
       Aelterer Text scrollt von 3 → 2 → 1 → weg. */
    #lines {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 60px;
      text-align: center;
      font-size: 72px;
      font-weight: 700;
      line-height: 1.1;
      padding: 20px;
    }
    .line {
      display: block;
      margin: 8px 0;
      color: #FFFFFF;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .line.dim   { opacity: 0.5; }
    .line.muted { opacity: 0.25; }
  </style>
</head>
<body>
  <div id="lines">
    <div class="line muted" id="line-2"></div>
    <div class="line dim"   id="line-1"></div>
    <div class="line"       id="line-0"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
  (function() {
    'use strict';

    // Die drei Slots, in DOM-Reihenfolge: muted (aelteste sichtbar) → line-1 → line-0 (aktuellste)
    const line0 = document.getElementById('line-0'); // aktuellster Text
    const line1 = document.getElementById('line-1'); // davor
    const line2 = document.getElementById('line-2'); // davor davor

    // Ring-Buffer der letzten 3 Texte (FIFO)
    const ring = ['', '', ''];
    let ringFilled = 0; // wie viele slots belegt sind (0..3)

    // ID des zuletzt vom Client gesehenen Segments.
    // Server schickt mit jedem Event den GESAMTEN Buffer; wir nehmen
    // nur die Segmente ab diesem Index, damit nicht jeder Text 100x
    // wiederholt wird.
    let lastSeenSegId = null;

    // Wenn Server "data.text" oder "data.segments" mit Text schickt → neuen Satz anzeigen
    // Beim Push: alle 3 Texte ruecken einen Slot hoch
    //   line2 ← line1.text
    //   line1 ← line0.text
    //   line0 ← neuer text
    function pushLine(text) {
      text = String(text || '').trim();
      if (!text) return;
      // Ring-Update (nur behalten wenn neuer Text anders ist als aktuellster)
      if (text === ring[2]) return; // dedupe gegen neueste Zeile
      // Erst alles einen Slot hoch
      ring[0] = ring[1];
      ring[1] = ring[2];
      ring[2] = text;
      if (ringFilled < 3) ringFilled++;
      render();
    }

    function render() {
      // ring[2] = aktuellster, ring[1] = davor, ring[0] = aelteste
      line0.textContent = ring[2];
      line1.textContent = ring[1];
      line2.textContent = ring[0];
    }

    function clearAll() {
      ring[0] = ring[1] = ring[2] = '';
      ringFilled = 0;
      render();
    }

    // Socket.IO verbinden
    const socket = io({ transports: ['websocket', 'polling'] });
    socket.on('connect', () => console.log('[stt-ticker] connected'));
    socket.on('disconnect', () => console.log('[stt-ticker] disconnected'));

    socket.on('stt-ticker:transcript', (data) => {
      if (!data) return;

      // WICHTIG: Server schickt NICHT nur den neuen Satz, sondern den
      // GESAMTEN bisherigen Buffer (alle bisherigen Segmente). Damit wir
      // nicht jedes Mal den gleichen Satz doppelt rendern, merken wir
      // uns die ID des zuletzt gesehenen Segments und nehmen nur die,
      // die neuer sind.
      if (Array.isArray(data.segments) && data.segments.length > 0) {
        const segs = data.segments;
        // Finde den Index des letzten gesehenen Segments in segs
        let startIdx = 0;
        for (let i = segs.length - 1; i >= 0; i--) {
          if (segs[i].id !== undefined && segs[i].id === lastSeenSegId) {
            startIdx = i + 1;
            break;
          }
        }
        // Pushe alle Segmente ab startIdx
        for (let i = startIdx; i < segs.length; i++) {
          if (segs[i] && segs[i].text) {
            pushLine(segs[i].text);
            if (segs[i].id !== undefined) lastSeenSegId = segs[i].id;
          }
        }
        return;
      }

      // Fallback 1: data.text
      if (typeof data.text === 'string' && data.text.trim()) {
        pushLine(data.text);
        return;
      }

      // Fallback 2: data.dual
      if (data.dual && (data.dual.bottomText || data.dual.topText)) {
        const t = (data.dual.bottomText || data.dual.topText || '').trim();
        if (t) pushLine(t);
        return;
      }
    });

    // Optional: Buffer-Clear-Event
    socket.on('stt-ticker:clear', () => clearAll());

    // Tastatur-Shortcut für lokales Testen: 'T' = fake transcript
    document.addEventListener('keydown', (e) => {
      if (e.key === 't' || e.key === 'T') {
        const fake = 'Test Satz ' + Date.now();
        console.log('[stt-ticker] injecting fake line:', fake);
        pushLine(fake);
      }
    });
  })();
  </script>
</body>
</html>
