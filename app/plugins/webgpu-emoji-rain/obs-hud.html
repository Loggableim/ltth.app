<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store">
  <title data-i18n="generated.48794b7a94fe">WebGPU EmojiRain OBS HUD</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
    body { font-family: Inter, "Segoe UI", sans-serif; }
    #emoji-rain-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: transparent; }
    #webgpu-status {
      position: fixed; top: 18px; left: 18px; z-index: 10; display: none; min-width: 250px;
      padding: 11px 14px; border: 1px solid rgba(34, 211, 238, .45); border-radius: 12px;
      color: #cffafe; background: rgba(3, 12, 24, .82); box-shadow: 0 12px 42px rgba(0, 0, 0, .35);
      backdrop-filter: blur(12px); font: 600 12px/1.35 ui-monospace, "Cascadia Code", monospace;
    }
    #webgpu-status.visible, body[data-debug="true"] #webgpu-status[data-state="ready"] { display: block; }
    #webgpu-status[data-state="ready"] { opacity: .62; }
    #webgpu-status[data-state="unsupported"], #webgpu-status[data-state="error"] { border-color: rgba(248, 113, 113, .75); color: #fee2e2; }
    #webgpu-status-details { display: block; margin-top: 3px; color: rgba(224, 242, 254, .72); font-weight: 500; }
    #webgpu-fallback-hint {
      position: fixed; inset: 0; z-index: 9; display: none; place-items: center; padding: 32px;
      color: white; text-align: center; background: radial-gradient(circle, rgba(25, 12, 48, .92), rgba(2, 6, 23, .97));
    }
    #webgpu-fallback-hint.visible { display: grid; }
    #webgpu-fallback-hint > div { max-width: 620px; padding: 28px; border: 1px solid rgba(168, 85, 247, .5); border-radius: 22px; background: rgba(15, 23, 42, .78); }
    #webgpu-fallback-hint h1 { margin: 0 0 12px; font-size: 28px; }
    #webgpu-fallback-hint p { margin: 0; color: #cbd5e1; line-height: 1.55; }
    body[data-theme="neon"] #webgpu-status { border-color: rgba(217, 70, 239, .72); box-shadow: 0 0 34px rgba(217, 70, 239, .24); }
  </style>
    <script src="/js/i18n-client.js"></script>
</head>
<body>
  <canvas id="emoji-rain-canvas" aria-label="WebGPU EmojiRain"></canvas>
  <div id="webgpu-status" data-state="initializing">
    <span id="webgpu-status-label" data-i18n="generated.639a1c432e25">INITIALISIERE WEBGPU</span>
    <span id="webgpu-status-details"></span>
  </div>
  <div id="webgpu-fallback-hint">
    <div>
      <h1 data-i18n="generated.1599fb550ea2">WebGPU ist nicht verfügbar</h1>
      <p><span data-i18n="generated.6fc91a629816">Diese Edition rendert ausschließlich mit WebGPU. Aktiviere für Standard-OBS oder ältere Browser das klassische Plugin </span><strong>EmojiRain</strong>.</p>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/plugins/webgpu-emoji-rain/gpu/webgpu-emoji-engine.js?v=3.0.1"></script>
  <script src="/plugins/webgpu-emoji-rain/gpu/engine.js?v=3.0.1"></script>
</body>
</html>
