<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="plugins.openshock.labels.zappiehell_goal_progress_overlay">ZappieHell - Goal Progress Overlay</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            overflow-x: hidden;
            overflow-y: auto;
            width: 100vw;
            min-height: 100vh;
            padding: 20px;
        }

        .goals-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .goal-card {
            background: linear-gradient(135deg, rgba(220, 20, 60, 0.95), rgba(139, 0, 0, 0.95));
            border-radius: 15px;
            padding: 20px 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            opacity: 0;
            transform: translateX(-100px);
            transition: all 0.5s ease-out;
        }

        .goal-card.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .goal-card.completed {
            animation: goalCompleted 1s ease-in-out;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.95), rgba(255, 140, 0, 0.95));
        }

        @keyframes goalCompleted {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.05);
            }
            50% {
                transform: scale(0.95);
            }
            75% {
                transform: scale(1.05);
            }
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .goal-name {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .goal-icon {
            font-size: 32px;
        }

        .goal-type {
            font-size: 14px;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 12px;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            text-transform: uppercase;
        }

        .goal-progress {
            margin-bottom: 12px;
        }

        .progress-bar-wrapper {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            height: 40px;
            overflow: hidden;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #FF6B6B, #FFD93D, #6BCB77);
            border-radius: 18px;
            transition: width 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
            white-space: nowrap;
        }

        .goal-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coin-icon {
            font-size: 20px;
        }

        .no-goals {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 24px;
            padding: 60px 40px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
        }

        .completion-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.6), transparent);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .completion-flash.active {
            opacity: 1;
        }

        /* Particles for goal completion */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .particle {
            position: absolute;
            font-size: 24px;
            animation: particleFloat 2s ease-out forwards;
            pointer-events: none;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-200px) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        .goal-card:not(.completed) {
            animation: pulse 4s ease-in-out infinite;
        }
    </style>
    <script src="/js/i18n-client.js"></script>
</head>
<body>
    <div class="goals-container" id="goalsContainer">
        <div class="no-goals" id="noGoals" data-i18n="plugins.openshock.labels.no_active_zappiehell_goals_configured">
            ⚡ No active ZappieHell goals configured ⚡
        </div>
    </div>

    <div class="completion-flash" id="completionFlash"></div>
    <div class="particles" id="particles"></div>

    <script>
        // State
        let goals = [];
        let socket = null;
        let pendingUtterances = [];
        let voicesChangedHandler = null;
        let disposed = false;
        const socketHandlers = [];
        const ownedTimeouts = new Set();

        function scheduleOverlayTimeout(callback, delay) {
            if (disposed) return null;
            const timeout = setTimeout(() => {
                ownedTimeouts.delete(timeout);
                if (!disposed) callback();
            }, delay);
            ownedTimeouts.add(timeout);
            return timeout;
        }

        function listenToSocket(eventName, handler) {
            const guardedHandler = (...args) => {
                if (!disposed) handler(...args);
            };
            socket.on(eventName, guardedHandler);
            socketHandlers.push([eventName, guardedHandler]);
        }

        function zappieOverlayText(key, fallback, params = {}) {
            const translationKey = `plugins.openshock.runtime.overlays.zappiehell.${key}`;
            const translated = window.i18n?.t(translationKey, params);
            const value = translated && translated !== translationKey ? translated : fallback;
            return String(value).replace(/\{(\w+)\}/g, (match, name) => (
                Object.prototype.hasOwnProperty.call(params, name) ? params[name] : match
            ));
        }

        // Helpers
        function getGoalProgress(goal) {
            const targetCoins = Math.max(0, Number(goal.targetCoins) || 0);
            const currentCoins = Math.max(0, Number(goal.currentCoins) || 0);
            const percentage = targetCoins > 0 ? Math.min(100, Math.round((currentCoins / targetCoins) * 100)) : 0;
            const remainingCoins = Math.max(0, targetCoins - currentCoins);
            const isCompleted = targetCoins > 0 && currentCoins >= targetCoins;

            return {
                targetCoins,
                currentCoins,
                percentage,
                remainingCoins,
                isCompleted
            };
        }

        function triggerFlash(duration = 500) {
            if (disposed) return;
            const flash = document.getElementById('completionFlash');
            if (!flash) return;

            flash.classList.add('active');
            scheduleOverlayTimeout(() => {
                flash.classList.remove('active');
            }, duration);
        }

        function handleOverlayAnimation(animation = {}) {
            if (!animation || typeof animation !== 'object' || Array.isArray(animation)) return;
            const duration = animation.duration === undefined ? 500 : animation.duration;
            if (typeof duration !== 'number' || !Number.isFinite(duration) || duration < 100 || duration > 10000) return;
            triggerFlash(duration);
        }

        function handleAudioPlay(payload) {
            if (!payload || !payload.text || !window.speechSynthesis) {
                return;
            }

            try {
                const utterance = new SpeechSynthesisUtterance(payload.text);
                const assignVoice = (targetUtterance) => {
                    if (!payload.voice) return;
                    const voices = speechSynthesis.getVoices();
                    if (voices && voices.length) {
                        const matchingVoice = voices.find((voice) => voice.name === payload.voice);
                        if (matchingVoice) {
                            targetUtterance.voice = matchingVoice;
                        }
                    }
                };

                const voices = speechSynthesis.getVoices();
                if (payload.voice && (!voices || !voices.length) && 'onvoiceschanged' in speechSynthesis) {
                    pendingUtterances.push(utterance);
                    if (pendingUtterances.length > 10) {
                        pendingUtterances.shift();
                    }
                    if (!voicesChangedHandler) {
                        voicesChangedHandler = () => {
                            if (disposed) {
                                pendingUtterances = [];
                                speechSynthesis.onvoiceschanged = null;
                                voicesChangedHandler = null;
                                return;
                            }
                            pendingUtterances.forEach((pending) => {
                                assignVoice(pending);
                                speechSynthesis.speak(pending);
                            });
                            pendingUtterances = [];
                            speechSynthesis.onvoiceschanged = null;
                            voicesChangedHandler = null;
                        };
                        speechSynthesis.onvoiceschanged = voicesChangedHandler;
                    }
                    return;
                }

                assignVoice(utterance);
                speechSynthesis.speak(utterance);
            } catch (error) {
                console.error('[ZappieHell] Failed to play audio:', error);
            }
        }

        // Initialize Socket.io connection
        function initSocket() {
            if (disposed || socket) return;
            socket = io();

            listenToSocket('connect', () => {
                console.log('[ZappieHell] Connected to server');
                // Request initial state
                socket.emit('zappiehell:request:state');
            });

            listenToSocket('disconnect', () => {
                console.log('[ZappieHell] Disconnected from server');
            });

            // Receive initial state
            listenToSocket('zappiehell:goals:state', (data) => {
                console.log('[ZappieHell] Initial goal state received');
                updateGoals(Array.isArray(data?.goals) ? data.goals : []);
            });

            // Receive goal updates
            listenToSocket('zappiehell:goals:update', (data) => {
                console.log('[ZappieHell] Goal update received');
                updateGoals(Array.isArray(data?.goals) ? data.goals : []);
            });

            // Receive goal completion
            listenToSocket('zappiehell:goals:completed', (data) => {
                console.log('[ZappieHell] Goal completion received');
                if (data?.goal && typeof data.goal === 'object') handleGoalCompletion(data.goal);
            });

            listenToSocket('zappiehell:overlay:animate', (animation) => {
                console.log('[ZappieHell] Overlay animation received');
                handleOverlayAnimation(animation);
            });

            listenToSocket('zappiehell:audio:play', (payload) => {
                console.log('[ZappieHell] Audio step received');
                handleAudioPlay(payload);
            });
        }

        // Update goals
        function updateGoals(newGoals) {
            goals = newGoals.filter(g => g.active);
            renderGoals();
        }

        // Render goals
        function renderGoals() {
            const container = document.getElementById('goalsContainer');
            const noGoalsMessage = document.getElementById('noGoals');

            if (goals.length === 0) {
                noGoalsMessage.style.display = 'block';
                // Clear any existing goal cards
                Array.from(container.children).forEach(child => {
                    if (child.id !== 'noGoals') {
                        child.remove();
                    }
                });
                return;
            }

            noGoalsMessage.style.display = 'none';

            // Update or create goal cards
            goals.forEach((goal, index) => {
                let card = document.getElementById(`goal-${goal.displayToken}`);

                if (!card) {
                    card = createGoalCard(goal);
                    container.appendChild(card);

                    // Trigger animation after a short delay
                    scheduleOverlayTimeout(() => {
                        card.classList.add('visible');
                    }, index * 100);
                } else {
                    updateGoalCard(card, goal);
                }
            });

            // Remove goals that are no longer active
            Array.from(container.children).forEach(child => {
                if (child.id === 'noGoals') return;

                const displayToken = child.id.replace('goal-', '');
                const exists = goals.some(g => g.displayToken === displayToken);

                if (!exists) {
                    child.style.opacity = '0';
                    child.style.transform = 'translateX(100px)';
                    scheduleOverlayTimeout(() => child.remove(), 500);
                }
            });
        }

        // Create goal card element
        function createGoalCard(goal) {
            const card = document.createElement('div');
            card.className = 'goal-card';
            card.id = `goal-${goal.displayToken}`;

            const { percentage, isCompleted, currentCoins, targetCoins, remainingCoins } = getGoalProgress(goal);

            card.innerHTML = `
                <div class="goal-header">
                    <div class="goal-name">
                        <span class="goal-icon">⚡</span>
                        <span>${escapeHtml(goal.name)}</span>
                    </div>
                    <div class="goal-type">${goal.type === 'stream'
                        ? `🔴 ${zappieOverlayText('stream', 'Stream')}`
                        : `🌐 ${zappieOverlayText('global', 'Global')}`}</div>
                </div>
                <div class="goal-progress">
                    <div class="progress-bar-wrapper">
                        <div class="progress-bar" style="width: ${percentage}%"></div>
                        <div class="progress-text">${percentage}%</div>
                    </div>
                </div>
                <div class="goal-stats">
                    <div class="stat-item">
                        <span class="coin-icon">💎</span>
                        <span class="stat-total">${zappieOverlayText('coin_progress', '{current} / {target} coins', {
                            current: formatNumber(currentCoins), target: formatNumber(targetCoins)
                        })}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-remaining">${zappieOverlayText('remaining', '{count} to go', { count: formatNumber(remainingCoins) })}</span>
                    </div>
                </div>
            `;

            if (isCompleted) {
                card.classList.add('completed');
            }

            return card;
        }

        // Update existing goal card
        function updateGoalCard(card, goal) {
            const { percentage, isCompleted, currentCoins, targetCoins, remainingCoins } = getGoalProgress(goal);

            // Update progress bar
            const progressBar = card.querySelector('.progress-bar');
            progressBar.style.width = `${percentage}%`;

            // Update progress text
            const progressText = card.querySelector('.progress-text');
            progressText.textContent = `${percentage}%`;

            // Update stats
            const totalText = card.querySelector('.stat-total');
            const remainingText = card.querySelector('.stat-remaining');
            if (totalText) {
                totalText.textContent = zappieOverlayText('coin_progress', '{current} / {target} coins', {
                    current: formatNumber(currentCoins), target: formatNumber(targetCoins)
                });
            }
            if (remainingText) {
                remainingText.textContent = zappieOverlayText('remaining', '{count} to go', { count: formatNumber(remainingCoins) });
            }

            // Update completion status
            card.classList.toggle('completed', isCompleted);
        }

        // Handle goal completion
        function handleGoalCompletion(goal) {
            console.log('[ZappieHell] Handling goal completion');

            // Flash effect
            triggerFlash();

            // Create particles
            createParticles(goal);

            // Update the goal card if it exists
            const card = document.getElementById(`goal-${goal.displayToken}`);
            if (card) {
                card.classList.add('completed');
            }
        }

        // Create celebration particles
        function createParticles(goal) {
            const particlesContainer = document.getElementById('particles');
            const emojis = ['⚡', '💥', '🔥', '✨', '💫', '⭐'];
            const particleCount = 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${50 + Math.random() * 30}%`;
                particle.style.animationDelay = `${Math.random() * 0.5}s`;

                particlesContainer.appendChild(particle);

                // Remove particle after animation
                scheduleOverlayTimeout(() => {
                    particle.remove();
                }, 2500);
            }
        }

        // Format number with thousands separator
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function initializeOnLoad() {
            if (disposed) return;
            console.log('[ZappieHell] Overlay loaded');
            initSocket();
        }

        function cleanup() {
            if (disposed) return;
            disposed = true;
            for (const timeout of ownedTimeouts) clearTimeout(timeout);
            ownedTimeouts.clear();

            if (socket) {
                for (const [eventName, handler] of socketHandlers) {
                    if (typeof socket.off === 'function') socket.off(eventName, handler);
                    else if (typeof socket.removeListener === 'function') socket.removeListener(eventName, handler);
                }
                socketHandlers.length = 0;
                socket.disconnect();
                socket = null;
            }

            if (voicesChangedHandler && window.speechSynthesis?.onvoiceschanged === voicesChangedHandler) {
                window.speechSynthesis.onvoiceschanged = null;
            }
            voicesChangedHandler = null;
            pendingUtterances = [];
            window.removeEventListener('load', initializeOnLoad);
            window.removeEventListener('pagehide', handlePageHide);
            window.removeEventListener('pageshow', handlePageShow);
        }

        function handlePageHide(event) {
            if (event?.persisted) return;
            cleanup();
        }

        function handlePageShow(event) {
            if (disposed || !event?.persisted) return;
            if (socket && !socket.connected) socket.connect();
        }

        window.addEventListener('load', initializeOnLoad);
        window.addEventListener('pagehide', handlePageHide);
        window.addEventListener('pageshow', handlePageShow);
    </script>
</body>
</html>
