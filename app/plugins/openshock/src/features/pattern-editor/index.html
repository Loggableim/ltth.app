    <link rel="stylesheet" href="/css/themes.css">
    <!-- Pattern Editor CSS -->
    <link rel="stylesheet" href="pattern-editor.css">

    <script>
        /* Pattern editor theme bridge */
        (() => {
            const VALID_THEMES = new Set(['day', 'night', 'contrast', 'vision-impaired', 'cid']);
            const STORAGE_KEYS = ['ltth-theme', 'app-theme', 'dashboard-theme', 'theme', 'ui-theme'];
            function readTheme() {
                try {
                    const parentTheme = window.parent?.document?.documentElement?.getAttribute('data-theme');
                    if (VALID_THEMES.has(parentTheme)) return parentTheme;
                } catch (_) {}
                for (const key of STORAGE_KEYS) {
                    const stored = localStorage.getItem(key);
                    if (VALID_THEMES.has(stored)) return stored;
                }
                return 'night';
            }
            function applyTheme(theme) {
                const active = VALID_THEMES.has(theme) ? theme : 'night';
                document.documentElement.setAttribute('data-theme', active);
                document.documentElement.style.colorScheme = (active === 'day' || active === 'contrast' || active === 'vision-impaired') ? 'light' : 'dark';
            }
            applyTheme(readTheme());
            window.addEventListener('message', (event) => {
                const theme = event.data?.theme || event.data?.payload?.theme;
                if (VALID_THEMES.has(theme)) applyTheme(theme);
            });
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--color-bg-primary, linear-gradient(135deg, #1a1a2e 0%, #16213e 100%));
            color: var(--color-text-primary, #fff);
            padding: 20px;
            min-height: 100vh;
        }

        .demo-container {
            max-width: 2200px;
            margin: 0 auto;
        }

        .demo-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        .demo-header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .api-config {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .api-config-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .device-status {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .device-grid {
            display: grid;
            gap: 10px;
        }

        .device-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .device-card.online {
            border-left: 4px solid #00ff88;
        }

        .device-card.offline {
            border-left: 4px solid #ff6b6b;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-online {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .status-offline {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        @media (max-width: 768px) {
            .api-config-grid {
                grid-template-columns: 1fr;
            }
        }

        /* pattern editor final theme overrides */
        html[data-theme="day"] .api-config,
        html[data-theme="day"] .device-status,
        html[data-theme="day"] .device-card {
            background: #fff;
            color: #10203a;
            border-color: #cbd5e1;
        }

        html[data-theme="contrast"] body,
        html[data-theme="vision-impaired"] body {
            background: #000 !important;
            color: #fff !important;
            font-size: 18px;
        }

        html[data-theme="contrast"] .api-config,
        html[data-theme="vision-impaired"] .api-config,
        html[data-theme="contrast"] .device-status,
        html[data-theme="vision-impaired"] .device-status,
        html[data-theme="contrast"] .device-card,
        html[data-theme="vision-impaired"] .device-card {
            background: #000 !important;
            color: #fff !important;
            border: 3px solid #fff !important;
        }
    /* pattern editor night panel contrast */
        html[data-theme="night"] .api-config,
        html[data-theme="night"] .device-status,
        html[data-theme="night"] .device-card {
            background: #111827;
            color: #f8fafc;
            border-color: #334155;
        }

</style>
    <script src="/js/i18n-client.js"></script>

<body>
    <div class="demo-container">
        <div class="demo-header">
            <h1 data-i18n="plugins.openshock.labels.openshock_pattern_editor">⚡ OpenShock Pattern Editor</h1>
            <p style="color: #aaa; font-size: 1.2em;" data-i18n="plugins.openshock.labels.complete_pattern_design_testing_system">Complete Pattern Design & Testing System</p>
        </div>

        <!-- API Configuration -->
        <div class="api-config">
            <h2 style="color: #00d4ff; margin-bottom: 15px;" data-i18n="plugins.openshock.labels.api_konfiguration_c2d94b">🔑 API Konfiguration</h2>
            <div class="api-config-grid">

                    <input type="password" id="apiKey" class="form-input"
                           value="6PP4UFqvQg1sWEyWKTD30dvbBMLfwtaW5sPwfopq8HKBSNIQYxdabBV0fANe623m"
                           placeholder="Dein API Key" data-i18n-placeholder="plugins.openshock.form_controls.placeholders.api_key">
                </div>
                <button class="btn btn-primary" id="connectBtn" style="height: 46px;" data-i18n="plugins.openshock.labels.verbinden_bfd207">

        <!-- Device Status -->

            <h2 style="color: #00d4ff; margin-bottom: 15px;" data-i18n="plugins.openshock.labels.verbundene_gerate">📱 Verbundene Geräte</h2>

        <!-- Emergency Stop -->
        <div style="text-align: center; margin-top: 30px;">

                🛑 NOTAUS - Alle Geräte stoppen
            </button>
        </div>
    </div>

        <script>
            window.OpenShockPatternI18n = (key, fallback, params = {}) => {
                const translationKey = `plugins.openshock.pattern_editor.${key}`;
                const translated = window.i18n?.t(translationKey, params);
                const value = translated && translated !== translationKey ? translated : fallback;
                return String(value).replace(/\{(\w+)\}/g, (match, name) => (
                    Object.prototype.hasOwnProperty.call(params, name) ? params[name] : match
                ));
            };
        </script>

        <!-- Load all pattern editor scripts -->
    <script src="engine/PatternEngine.ts.js"></script>
    <script src="state/patternTypes.ts.js"></script>
    <script src="state/patternStore.ts.js"></script>
    <script src="components/PatternLibrary.tsx.js"></script>
    <script src="components/ParameterEditor.tsx.js"></script>
    <script src="components/KeyframeEditor.tsx.js"></script>
    <script src="components/LiveControls.tsx.js"></script>
    <script src="PatternEditorView.tsx.js"></script>

    <script>
        // OpenShock API Client
        class OpenShockAPIClient {
            constructor(apiKey, baseUrl = 'https://api.openshock.app') {
                this.apiKey = apiKey;
                this.baseUrl = baseUrl;
                this.devices = [];
            }

            async getDevices() {
                const response = await fetch(`${this.baseUrl}/1/devices`, {
                    headers: {
                        'accept': 'application/json',
                        'OpenShockToken': this.apiKey
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                this.devices = data.data || [];
                return this.devices;
            }

            async sendControl(deviceId, type, intensity, duration, exclusive = false) {
                const response = await fetch(`${this.baseUrl}/2/shockers/control`, {
                    method: 'POST',
                    headers: {
                        'accept': 'application/json',
                        'Content-Type': 'application/json',
                        'OpenShockToken': this.apiKey
                    },
                    body: JSON.stringify({
                        shocks: [{
                            id: deviceId,
                            type: type,
                            intensity: Math.round(intensity),
                            duration: Math.round(duration),
                            exclusive: exclusive
                        }],
                        customName: 'Pattern Editor'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                return await response.json();
            }
        }

        // Global state
        let apiClient = null;
        let patternEditor = null;
        let devices = [];

        function translate(key, fallback) {
            const translation = window.i18n?.t(key);
            return translation && translation !== key ? translation : fallback;
        }

        function patternEditorText(key, fallback, params = {}) {
            return window.OpenShockPatternI18n(key, fallback, params);
        }

        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[Pattern Editor] Initializing...');

            // Connect button
            document.getElementById('connectBtn').addEventListener('click', async () => {
                const apiKey = document.getElementById('apiKey').value.trim();

                if (!apiKey) {
                    alert(patternEditorText('connection.api_key_required', 'Enter an API key.'));
                    return;
                }

                try {
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('connectBtn').textContent = `⏳ ${patternEditorText('connection.connecting', 'Connecting...')}`;

                    // Create API client
                    apiClient = new OpenShockAPIClient(apiKey);

                    // Get devices
                    devices = await apiClient.getDevices();

                    console.log(`[Pattern Editor] ${devices.length} Gerät(e) gefunden`);

                    // Show devices
                    showDevices(devices);

                    // Initialize pattern editor
                    if (!patternEditor) {
                        const container = document.getElementById('patternEditorContainer');
                        patternEditor = new PatternEditorView(container, apiClient);
                        patternEditor.init();
                    }

                    // Set devices
                    patternEditor.setDevices(devices);

                    alert(`✅ ${patternEditorText('connection.connected_with_devices', 'Connected! {count} device(s) found.', { count: devices.length })}`);

                    document.getElementById('connectBtn').textContent = `✅ ${patternEditorText('connection.connected', 'Connected')}`;
                } catch (error) {
                    console.error('[Pattern Editor] Connection error:', error);
                    alert(`❌ ${patternEditorText('connection.failed', 'Connection failed: {error}', { error: error.message })}`);
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('connectBtn').textContent = `🔌 ${patternEditorText('connection.connect', 'Connect')}`;
                }
            });

            // Emergency stop
            document.getElementById('emergencyStopBtn').addEventListener('click', async () => {
                if (!apiClient || devices.length === 0) {
                    alert(patternEditorText('connection.not_connected', 'Not connected.'));
                    return;
                }

                if (!confirm(patternEditorText('connection.emergency_stop_confirm', 'Stop all devices?'))) {
                    return;
                }

                for (const device of devices) {
                    for (const shocker of device.shockers) {
                        try {
                            await apiClient.sendControl(shocker.id, 0, 0, 300);
                        } catch (error) {
                            console.error('Emergency stop error:', error);
                        }
                    }
                }

                alert(`🛑 ${patternEditorText('connection.emergency_stop_activated', 'Emergency stop activated!')}`);
            });
        });

        // Show devices
        function showDevices(deviceList) {
            const container = document.getElementById('deviceStatusContainer');
            const listContainer = document.getElementById('deviceList');

            container.style.display = 'block';

            if (deviceList.length === 0) {
                listContainer.innerHTML = `<p style="color: #aaa;">${translate('plugins.openshock.ui.empty_state.no_devices', 'No devices found')}</p>`;
                return;
            }

            listContainer.innerHTML = deviceList.map(device => `
                <div class="device-card ${device.online ? 'online' : 'offline'}">
                    <div>
                        <strong>${device.name}</strong><br>
                        <small style="color: #aaa;">
                            ${patternEditorText('connection.shocker_count', '{count} shocker(s)', { count: device.shockers.length })}
                        </small>
                    </div>
                    <span class="status-badge ${device.online ? 'status-online' : 'status-offline'}">
                            ${device.online
                                ? `● ${patternEditorText('connection.online', 'Online')}`
                                : `○ ${patternEditorText('connection.offline', 'Offline')}`}
                    </span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
