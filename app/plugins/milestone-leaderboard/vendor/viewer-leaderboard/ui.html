<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="generated.057f7ce9e46d">Viewer XP</title>
  <meta http-equiv="refresh" content="0; url=/viewer-xp/admin">
  <link rel="stylesheet" href="/css/themes.css">
  <script>
    (function () {
      const THEMES = new Set(['day', 'night', 'contrast', 'vision-impaired', 'cid']);
      function readTheme() {
        try {
          const parentTheme = window.parent?.document?.documentElement?.getAttribute('data-theme');
          if (THEMES.has(parentTheme)) return parentTheme;
        } catch (error) {}
        try {
          for (const key of ['ltth-theme', 'app-theme', 'dashboard-theme', 'theme', 'ui-theme']) {
            const value = localStorage.getItem(key);
            if (THEMES.has(value)) return value;
          }
        } catch (error) {}
        return 'night';
      }
      function sync() {
        const theme = readTheme();
        if (document.documentElement.getAttribute('data-theme') !== theme) {
          document.documentElement.setAttribute('data-theme', theme);
        }
        document.documentElement.style.colorScheme = (theme === 'day' || theme === 'contrast' || theme === 'vision-impaired') ? 'light' : 'dark';
      }
      document.addEventListener('DOMContentLoaded', sync);
      window.addEventListener('load', sync);
      window.addEventListener('focus', sync);
    })();
  </script>
  <style>
    body {
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .redirect-container {
      text-align: center;
      padding: 40px;
      background: var(--color-bg-secondary);
      border-radius: 12px;
      border: 1px solid var(--color-border);
      max-width: 500px;
    }

    .redirect-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 16px;
      background: var(--gradient-primary);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .redirect-message {
      color: var(--color-text-muted);
      margin-bottom: 24px;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid var(--color-border);
      border-top-color: var(--color-accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .redirect-link {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background: var(--color-accent-primary);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .redirect-link:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    html[data-theme="vision-impaired"] body {
      background: #000 !important;
      color: #fff !important;
      font-size: 1.05rem;
    }

    html[data-theme="vision-impaired"] .redirect-container {
      background: #000 !important;
      border: 2px solid #facc15 !important;
      box-shadow: none !important;
    }

    html[data-theme="vision-impaired"] .redirect-title {
      color: #fff7cc !important;
    }

    html[data-theme="vision-impaired"] .redirect-message {
      color: #f8e7a1 !important;
    }

    html[data-theme="vision-impaired"] .spinner {
      border-color: #444 !important;
      border-top-color: #facc15 !important;
    }

    html[data-theme="vision-impaired"] .redirect-link {
      background: #facc15 !important;
      color: #000 !important;
    }
  
        /* Cid theme alignment */
        html[data-theme="cid"] body {
            background: #030603;
            color: #f4fff4;
        }

        html[data-theme="cid"] .container,
        html[data-theme="cid"] .app,
        html[data-theme="cid"] .main-content {
            width: 100%;
            max-width: none;
        }

        html[data-theme="cid"] .container,
        html[data-theme="cid"] .app,
        html[data-theme="cid"] .panel,
        html[data-theme="cid"] .card,
        html[data-theme="cid"] .section,
        html[data-theme="cid"] .settings-section,
        html[data-theme="cid"] .config-section,
        html[data-theme="cid"] .stat-card,
        html[data-theme="cid"] .modal,
        html[data-theme="cid"] .modal-content,
        html[data-theme="cid"] .sidebar,
        html[data-theme="cid"] .main-content,
        html[data-theme="cid"] .info-box,
        html[data-theme="cid"] .alert {
            background: #071107;
            color: #f4fff4;
            border-color: #1e5b2a;
            box-shadow: none;
        }

        html[data-theme="cid"] h1,
        html[data-theme="cid"] h2,
        html[data-theme="cid"] h3,
        html[data-theme="cid"] .logo,
        html[data-theme="cid"] .brand h1,
        html[data-theme="cid"] .title,
        html[data-theme="cid"] .section-title,
        html[data-theme="cid"] .card-title,
        html[data-theme="cid"] .stat-value,
        html[data-theme="cid"] .active,
        html[data-theme="cid"] .selected {
            color: #4ade80;
            -webkit-text-fill-color: #4ade80;
        }

        html[data-theme="cid"] p,
        html[data-theme="cid"] label,
        html[data-theme="cid"] .subtitle,
        html[data-theme="cid"] .description,
        html[data-theme="cid"] .help-text,
        html[data-theme="cid"] .muted,
        html[data-theme="cid"] .text-muted,
        html[data-theme="cid"] .stat-label,
        html[data-theme="cid"] .form-label,
        html[data-theme="cid"] .form-help,
        html[data-theme="cid"] small {
            color: #d1e7d1;
            opacity: 1;
        }

        html[data-theme="cid"] input,
        html[data-theme="cid"] select,
        html[data-theme="cid"] textarea,
        html[data-theme="cid"] .form-input,
        html[data-theme="cid"] .form-select,
        html[data-theme="cid"] .search-input {
            background: #061006;
            color: #f4fff4;
            border-color: #1e5b2a;
        }

        html[data-theme="cid"] button,
        html[data-theme="cid"] .btn,
        html[data-theme="cid"] .tab,
        html[data-theme="cid"] .nav-item {
            background: #061006;
            color: #f4fff4;
            border-color: #1e5b2a;
        }

        html[data-theme="cid"] .btn-primary,
        html[data-theme="cid"] .btn-success,
        html[data-theme="cid"] .tab.active,
        html[data-theme="cid"] button.active,
        html[data-theme="cid"] .nav-item.active {
            background: #4ade80;
            color: #030603;
            border-color: #4ade80;
            -webkit-text-fill-color: #030603;
        }
    </style>
    <script src="/js/i18n-client.js"></script>
</head>
<body>
  <div class="redirect-container">
    <div class="redirect-title" data-i18n="generated.ade59698db62">🎮 Viewer XP</div>
    <div class="redirect-message" data-i18n="generated.4701c0bc2234">Redirecting to Admin Panel...</div>
    <div class="spinner"></div>
    <div>
      <a href="/viewer-xp/admin" class="redirect-link" data-i18n="generated.b6cdbc12dbed">Click here if not redirected automatically</a>
    </div>
  </div>

  <script>
    // JavaScript redirect as fallback if meta refresh doesn't work
    setTimeout(function() {
      window.location.href = '/viewer-xp/admin';
    }, 1000);
  </script>
</body>
</html>
