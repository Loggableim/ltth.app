<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="plugins.milestone-leaderboard.labels.leaderboard_overlay_49a1ac">Leaderboard Overlay</title>
    <link rel="stylesheet" href="/leaderboard/style.css">
    <link rel="stylesheet" href="/leaderboard/theme.css" id="theme-stylesheet">
    <script src="/js/i18n-client.js"></script>
</head>
<body>
    <div class="container">
        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="session">
                <span class="tab-icon">🔥</span><span data-i18n="plugins.milestone-leaderboard.labels.current_session">
                Current Session
            </span></button>
            <button class="tab-btn" data-tab="alltime">
                <span class="tab-icon">👑</span><span data-i18n="plugins.milestone-leaderboard.labels.all_time_champions_d72001">
                All Time Champions
            </span></button>
        </div>

        <!-- Session Leaderboard -->
        <div class="leaderboard-panel active" id="session-panel">
            <div class="panel-header">
                <h2 data-i18n="plugins.milestone-leaderboard.labels.current_session_top_gifters">🔥 Current Session Top Gifters</h2>
                <div class="session-info" id="session-info"><span data-i18n="plugins.milestone-leaderboard.labels.session_started">
                    Session started: </span><span id="session-start-time">-</span>
                </div>
            </div>
            <div class="leaderboard-list" id="session-list">
                <div class="empty-state">
                    <div class="empty-icon">🎁</div>
                    <p data-i18n="plugins.milestone-leaderboard.labels.waiting_for_gifts">Waiting for gifts...</p>
                </div>
            </div>
        </div>

        <!-- All-Time Leaderboard -->
        <div class="leaderboard-panel" id="alltime-panel">
            <div class="panel-header">
                <h2 data-i18n="plugins.milestone-leaderboard.labels.all_time_champions">👑 All Time Champions</h2>
            </div>
            <div class="leaderboard-list" id="alltime-list">
                <div class="empty-state">
                    <div class="empty-icon">🏆</div>
                    <p data-i18n="plugins.milestone-leaderboard.labels.no_champions_yet">No champions yet...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/leaderboard/script.js"></script>
</body>
</html>
