  <title data-i18n="plugins.game-engine.labels.connect4_overlay_ltth_game_engine">Connect4 Overlay - LTTH Game Engine</title>
  <script>
    function runtimeText(key, params = {}) {
      const normalizedKey = key.replace(/^plugins\.game-engine\.runtime\./, 'plugins.game-engine.ui.runtime.');
      const translated = window.i18n?.t?.(normalizedKey, params);
      return translated && translated !== normalizedKey ? translated : '';
    }

    (function () {
      const VALID_THEMES = new Set(['day', 'night', 'contrast', 'vision-impaired', 'cid']);

      function readTheme() {
        try {
          if (window.parent && window.parent !== window) {
            const parentTheme = window.parent.document?.documentElement?.getAttribute('data-theme');
            if (VALID_THEMES.has(parentTheme)) return parentTheme;
          }
        } catch (error) {}

        try {
          for (const key of ['ltth-theme', 'app-theme', 'dashboard-theme', 'theme', 'ui-theme']) {
            const value = localStorage.getItem(key);
            if (VALID_THEMES.has(value)) return value;
          }
        } catch (error) {}

        return 'night';
      }

      function syncTheme() {
        const theme = readTheme();
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = (theme === 'day' || theme === 'contrast' || theme === 'vision-impaired') ? 'light' : 'dark';
      }

      syncTheme();
      window.addEventListener('focus', syncTheme);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) syncTheme();
      });
      try {
        if (window.parent && window.parent !== window) {
          new MutationObserver(syncTheme).observe(window.parent.document.documentElement, {
            attributes: true,
            attributeFilter: ['data-theme']
          });
        }
      } catch (error) {}
    })();
  </script>
  <style>
    * {

      padding: 0;
      box-sizing: border-box;
    }

    #column-labels {

    }

    .column-label {

      color: var(--text-color, #FFFFFF);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .board-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .board-cell {
      width: 70px;
      height: 70px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 50%;

      align-items: center;
      justify-content: center;

    .piece {

      height: 60px;

      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);

    @keyframes dropPiece {
      from {
        transform: translateY(-500px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .piece.player1 {
      background: var(--player1-color, #E74C3C);
    }

    .piece.player2 {
      background: var(--player2-color, #F1C40F);
    }

    .piece.winning {
      animation: winningPulse 1s ease-in-out infinite;
    }

    @keyframes winningPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      }
      50% {
        transform: scale(1.1);
        box-shadow: 0 8px 16px rgba(255, 255, 255, 0.6);
      }
    }

    }

      }

    </style>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({ auth: { role: 'overlay' } });

    let currentSession = null;
    let gameConfig = null;
    let lastInteractiveDisplayRevision = -1;
    let lastInteractiveSessionRevision = -1;
    let latestInteractiveQueueIdle = true;
    let interactiveSnapshotActive = false;
    let resultHideTimer = null;
    let containerHideTimer = null;
    const ROWS = 6;
    const COLUMNS = 7;

    // Check if test mode is enabled via URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const testMode = urlParams.get('testMode') === 'true';
    let testSessionId = null;

    // Sound effects (using Web Audio API)
    let audioContext = null; // Lazy initialization to avoid autoplay policy issues

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioContext;
    }

    // Play audio file (MP3/WAV)
    function playAudioFile(filePath, volume = null) {
      if (!gameConfig || !gameConfig.soundEnabled) return;

      try {
        const audio = new Audio(filePath);
        audio.volume = volume !== null ? volume : (gameConfig.soundVolume || 0.5);
        audio.play().catch(err => {
          console.warn('Audio playback failed:', err);
        });
      } catch (error) {
        console.warn('Failed to load audio:', error);
      }
    }

    function playSound(type) {
      if (!gameConfig || !gameConfig.soundEnabled) return;

      // Map sound types to default sound files
      const defaultSounds = {
        'move': '/game-engine/sounds/default/game start.mp3',
        'win': '/game-engine/sounds/default/player-1-wins.mp3',
        'draw': '/game-engine/sounds/default/game over.mp3',
        'timer_warning': '/game-engine/sounds/default/ten-sec-timer.mp3'
      };

      // Use default sounds if available, otherwise fall back to oscillator
      if (defaultSounds[type]) {
        playAudioFile(defaultSounds[type]);
        return;
      }

      // Fallback to oscillator sounds for compatibility
      try {
        const ctx = getAudioContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);

        const volume = (gameConfig.soundVolume || 0.5) * 0.3;
        gainNode.gain.value = volume;

        switch(type) {
          case 'move':
            oscillator.frequency.value = 400;
            oscillator.type = 'sine';
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            break;
          case 'win':
            oscillator.frequency.value = 800;
            oscillator.type = 'square';
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
            break;
          case 'draw':
            oscillator.frequency.value = 300;
            oscillator.type = 'triangle';
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            break;
        }

        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.5);
      } catch (error) {
        console.warn('Audio playback failed:', error);
      }
    }

    // Confetti celebration configuration
    const CONFETTI_CONFIG = {
      count: 50,
      spawnInterval: 30, // ms between each confetti piece
      animationDelay: 500, // ms max random delay
      duration: 3000 // ms total animation duration
    };

    // Confetti celebration
    function celebrateWin() {
      if (!gameConfig || !gameConfig.celebrationEnabled) return;

      const celebrationOverlay = document.getElementById('celebration-overlay');
      celebrationOverlay.classList.add('active');

      const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff8800'];

      for (let i = 0; i < CONFETTI_CONFIG.count; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDelay = Math.random() * (CONFETTI_CONFIG.animationDelay / 1000) + 's';
          celebrationOverlay.appendChild(confetti);

          setTimeout(() => confetti.remove(), CONFETTI_CONFIG.duration);
        }, i * CONFETTI_CONFIG.spawnInterval);
      }

      setTimeout(() => {
        celebrationOverlay.classList.remove('active');
      }, CONFETTI_CONFIG.duration);
    }

    // Challenge screen variables
    let challengeTimerInterval = null;

    // Media playback function
    function playMedia(mediaInfo) {
      if (!mediaInfo || !mediaInfo.file_path) return;

      try {
        const element = mediaInfo.media_type === 'audio'
          ? document.createElement('audio')
          : document.createElement('video');

        element.src = mediaInfo.file_path;
        element.volume = (gameConfig && gameConfig.soundVolume) ? gameConfig.soundVolume : 0.5;
        element.style.display = 'none';

        document.body.appendChild(element);

        element.play().catch(err => {
          console.warn('Media playback failed:', err);
        });

        element.onended = () => {
          document.body.removeChild(element);
        };

        element.onerror = () => {
          console.error('Failed to load media:', mediaInfo.file_path);
          document.body.removeChild(element);
        };
      } catch (error) {
        console.error('Error playing media:', error);
      }
    }

    // Show challenge screen
    function showChallengeScreen(data) {
      const challengeScreen = document.getElementById('challenge-screen');
      const challengerNameDiv = document.getElementById('challenger-name');
      const giftContainer = document.getElementById('challenge-gift-container');
      const giftNameDiv = document.getElementById('gift-name');
      const timerDiv = document.getElementById('challenge-timer');

      // Play challenge media if available
      if (data.media) {
        playMedia(data.media);
      }

      // Set challenger name
      challengerNameDiv.textContent = data.challengerNickname || data.challengerUsername;

      // Set gift image or placeholder
      giftContainer.innerHTML = '';
      if (data.giftImageUrl) {
        const img = document.createElement('img');
        img.src = data.giftImageUrl;
        img.alt = data.giftName;
        giftContainer.appendChild(img);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'challenge-gift-placeholder';
        placeholder.textContent = '🎁';
        giftContainer.appendChild(placeholder);
      }

      // Set gift name
      giftNameDiv.textContent = data.giftName;

      // Show challenge screen
      challengeScreen.classList.add('show');

      // Start countdown timer
      const expiresAt = new Date(data.expiresAt);
      challengeTimerInterval = setInterval(() => {
        const now = new Date();
        const remaining = Math.max(0, Math.floor((expiresAt - now) / 1000));

        timerDiv.textContent = `⏱️ ${remaining}s`;

        if (remaining <= 5) {
          timerDiv.classList.add('warning');
        }

        if (remaining <= 0) {
          clearInterval(challengeTimerInterval);
        }
      }, 100);

      // Auto-hide after timeout
      setTimeout(() => {
        hideChallengeScreen();
      }, data.timeoutSeconds * 1000);
    }

    // Hide challenge screen
    function hideChallengeScreen() {
      const challengeScreen = document.getElementById('challenge-screen');
      challengeScreen.classList.remove('show');

      if (challengeTimerInterval) {
        clearInterval(challengeTimerInterval);
        challengeTimerInterval = null;
      }
    }

    // Leaderboard display
    let currentLeaderboardIndex = 0;
    let leaderboardRotationInterval = null;

    function clearInteractivePresentation() {
      if (resultHideTimer) clearTimeout(resultHideTimer);
      if (containerHideTimer) clearTimeout(containerHideTimer);
      if (leaderboardRotationInterval) clearInterval(leaderboardRotationInterval);
      resultHideTimer = null;
      containerHideTimer = null;
      leaderboardRotationInterval = null;
      document.getElementById('game-result').classList.remove('show');
      hideLeaderboard();
    }

    // Show leaderboard rotation
    async function showLeaderboardRotation(gameType) {
      if (!latestInteractiveQueueIdle) return;
      if (!gameConfig || !gameConfig.leaderboardEnabled) {
        return;
      }

      const types = gameConfig.leaderboardTypes || ['daily', 'season', 'lifetime'];
      const displayTime = (gameConfig.leaderboardDisplayTime || 3) * 1000;

      currentLeaderboardIndex = 0;

      // Show first leaderboard
      await showLeaderboard(gameType, types[currentLeaderboardIndex]);

      // Rotate through leaderboards
      leaderboardRotationInterval = setInterval(async () => {
        currentLeaderboardIndex++;

        if (currentLeaderboardIndex >= types.length) {
          // Finished rotation
          hideLeaderboard();
          clearInterval(leaderboardRotationInterval);
          leaderboardRotationInterval = null;

          // Hide game container after leaderboards
          setTimeout(() => {
            document.getElementById('game-container').classList.remove('active');
          }, 1000);
          return;
        }

        await showLeaderboard(gameType, types[currentLeaderboardIndex]);
      }, displayTime);
    }

    // Show specific leaderboard
    async function showLeaderboard(gameType, type) {
      const leaderboardScreen = document.getElementById('leaderboard-screen');
      const typeDiv = document.getElementById('leaderboard-type');
      const contentDiv = document.getElementById('leaderboard-content');

      // Set type title
      const typeNames = {
        daily: 'Heute / Today',
        season: 'Diese Saison / This Season',
        lifetime: 'Allzeit / All Time',
        elo: 'ELO Rangliste / ELO Ranking'
      };
      typeDiv.textContent = typeNames[type] || type;

      // Fetch leaderboard data
      try {
        const response = await fetch(`/api/game-engine/${type}-leaderboard/${gameType}?limit=10`);
        const data = await response.json();

        if (!data || data.length === 0) {
          contentDiv.innerHTML = `<div class="leaderboard-empty">${runtimeText('plugins.game-engine.runtime.common.no_data')}</div>`;
        } else {
          contentDiv.replaceChildren(renderLeaderboardTable(data, type));
        }
      } catch (error) {
        console.error('Failed to load leaderboard:', error);
        contentDiv.innerHTML = `<div class="leaderboard-empty">${runtimeText('plugins.game-engine.runtime.common.load_error')}</div>`;
      }

      // Show leaderboard
      leaderboardScreen.classList.add('show');
    }

    // Hide leaderboard
    function hideLeaderboard() {
      const leaderboardScreen = document.getElementById('leaderboard-screen');
      leaderboardScreen.classList.remove('show');
    }

    // Render leaderboard table
    function renderLeaderboardTable(data, type) {
      const rankIcons = ['🥇', '🥈', '🥉'];

      const table = document.createElement('table');
      table.className = 'leaderboard-table';
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      const addHeader = (text) => {
        const cell = document.createElement('th');
        cell.textContent = text;
        headerRow.appendChild(cell);
      };
      addHeader('Rang');
      addHeader('Spieler');

      if (type === 'daily') {
        addHeader('Siege Heute');
        addHeader('Spiele Heute');
      } else if (type === 'season') {
        addHeader('Siege Saison');
        addHeader('Spiele Saison');
      } else if (type === 'lifetime') {
        addHeader('Gesamt Siege');
        addHeader('Gesamt Spiele');
      } else if (type === 'elo') {
        addHeader('ELO Rating');
        addHeader('Peak ELO');
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');

      data.forEach((player, index) => {
        const row = document.createElement('tr');
        const rankCell = document.createElement('td');
        const icon = document.createElement('span');
        icon.className = 'rank-icon';
        icon.textContent = rankIcons[index] || String(index + 1);
        rankCell.append(icon, document.createTextNode(String(index + 1)));
        const userCell = document.createElement('td');
        userCell.textContent = player.username || '';
        row.append(rankCell, userCell);
        const addCell = (value) => {
          const cell = document.createElement('td');
          cell.textContent = String(value);
          row.appendChild(cell);
        };

        if (type === 'daily') {
          addCell(player.wins_today || 0);
          addCell(player.games_today || 0);
        } else if (type === 'season') {
          addCell(player.wins_season || 0);
          addCell(player.games_season || 0);
        } else if (type === 'lifetime') {
          addCell(player.wins || 0);
          addCell(player.total_games || 0);
        } else if (type === 'elo') {
          addCell(player.elo_rating || 1000);
          addCell(player.peak_elo || 1000);
        }
        tbody.appendChild(row);
      });
      table.appendChild(tbody);
      return table;
    }

    // Initialize board grid
    function initializeBoard() {
      const boardGrid = document.getElementById('board-grid');
      boardGrid.innerHTML = '';

      for (let row = 0; row < ROWS; row++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'board-row';

        for (let col = 0; col < COLUMNS; col++) {
          const cell = document.createElement('div');
          cell.className = 'board-cell';
          cell.dataset.row = row;
          cell.dataset.col = col;
          rowDiv.appendChild(cell);
        }

        boardGrid.appendChild(rowDiv);
      }
    }

    // Apply configuration
    function applyConfig(config) {
      gameConfig = config;

      if (config.boardColor) {
        document.documentElement.style.setProperty('--board-color', config.boardColor);
      }
      if (config.player1Color) {
        document.documentElement.style.setProperty('--player1-color', config.player1Color);
      }
      if (config.player2Color) {
        document.documentElement.style.setProperty('--player2-color', config.player2Color);
      }
      if (config.textColor) {
        document.documentElement.style.setProperty('--text-color', config.textColor);
      }
      if (config.fontFamily) {
        document.body.style.fontFamily = config.fontFamily;
      }

      // Apply display texts
      applyDisplayTexts(config.displayTexts);

      // Update column labels visibility
      const columnLabels = document.getElementById('column-labels');
      if (config.showCoordinates === false) {
        columnLabels.style.display = 'none';
      }
    }

    /**
     * Apply display text tokens from displayTexts config to overlay elements
     * @param {Object} dt - displayTexts object from connect4 config
     */
    function applyDisplayTexts(dt) {
      if (!dt || typeof dt !== 'object') return;
      const titleEl = document.getElementById('game-title');
      if (titleEl && dt.titleText) titleEl.textContent = dt.titleText;
      // Store for dynamic use in updateStatus / updatePlayerInfo
      if (!gameConfig) return;
      gameConfig._displayTexts = dt;
    }

    // Update board display
    function updateBoard(state) {
      const board = state.board;

      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLUMNS; col++) {
          const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
          const cellValue = board[row][col];

          // Clear existing pieces
          cell.innerHTML = '';
          cell.classList.remove('filled');

          if (cellValue !== 0) {
            const piece = document.createElement('div');
            piece.className = `piece player${cellValue}`;

            // Check if this cell is part of winning combination
            if (state.winningCells) {
              const isWinning = state.winningCells.some(([r, c]) => r === row && c === col);
              if (isWinning) {
                piece.classList.add('winning');
              }
            }

            cell.appendChild(piece);
            cell.classList.add('filled');
          }
        }
      }
    }

    // Update player info
    function updatePlayerInfo(state) {
      const player1Info = document.getElementById('player1-info');
      const player2Info = document.getElementById('player2-info');

      document.getElementById('player1-name').textContent = state.player1.nickname || state.player1.username;
      document.getElementById('player2-name').textContent = state.player2.nickname || state.player2.username;

      document.getElementById('player1-color').style.background = state.player1.color;
      document.getElementById('player2-color').style.background = state.player2.color;

      // Highlight current player
      player1Info.classList.toggle('active', state.currentPlayer === 1 && state.status === 'active');
      player2Info.classList.toggle('active', state.currentPlayer === 2 && state.status === 'active');
    }

    // Update game status
    function updateStatus(state) {
      const statusDiv = document.getElementById('game-status');
      const dt = (gameConfig && gameConfig._displayTexts) || {};

      if (state.status === 'completed') {
        if (state.winner) {
          const winnerInfo = state.winner === 1 ? state.player1 : state.player2;
          const winLabel = dt.labelWin || '🏆 {player} gewinnt!';
          statusDiv.textContent = winLabel.replace('{player}', winnerInfo.nickname || winnerInfo.username);
        } else {
          statusDiv.textContent = dt.labelDraw || runtimeText('plugins.game-engine.runtime.connect4.draw');
        }
      } else {
        const currentPlayerInfo = state.currentPlayer === 1 ? state.player1 : state.player2;
        const columnText = currentPlayerInfo.role === 'viewer' ? ` ${dt.labelYourTurn || 'Du bist dran! Tippe A-G'}` : '';
        statusDiv.textContent = runtimeText('plugins.game-engine.runtime.connect4.current_turn', {
          player: currentPlayerInfo.nickname || currentPlayerInfo.username,
          columnText
        });
      }
    }

    // Show game result
    function showResult(data, { authoritative = false } = {}) {
      const resultDiv = document.getElementById('game-result');
      const resultText = document.getElementById('result-text');
      const xpReward = document.getElementById('xp-reward');
      const dt = (gameConfig && gameConfig._displayTexts) || {};

      if (data.winner) {
        const winnerInfo = data.state.winner === 1 ? data.state.player1 : data.state.player2;
        const winLabel = dt.labelWin || '🏆 {player} gewinnt!';
        resultText.innerHTML = '<span class="winner-text"></span>';
        const winnerText = resultText.querySelector('.winner-text');
        if (winnerText) {
          winnerText.textContent = winLabel.replace('{player}', winnerInfo.nickname || winnerInfo.username || '');
        }

        // Play appropriate win sound based on which player won
        const winSound = data.state.winner === 1
          ? '/game-engine/sounds/default/player-1-wins.mp3'
          : '/game-engine/sounds/default/player-2-wins.mp3';
        playAudioFile(winSound);

        celebrateWin();
      } else if (data.reason === 'draw') {
        resultText.innerHTML = '';
        const drawText = document.createElement('span');
        drawText.className = 'draw-text';
        drawText.textContent = dt.labelDraw || runtimeText('plugins.game-engine.runtime.connect4.draw');
        resultText.appendChild(drawText);
        playAudioFile('/game-engine/sounds/default/game over.mp3');
      } else {
        resultText.innerHTML = `<span>${runtimeText('plugins.game-engine.runtime.common.game_finished')}</span>`;
      }

      // Show XP reward if viewer won/lost
      let xpText = '';
      if (data.winner && data.state.player1.role === 'viewer') {
        xpText = data.state.winner === 1 ? '✨ +100 XP' : '✨ +25 XP';
      } else if (data.winner && data.state.player2.role === 'viewer') {
        xpText = data.state.winner === 2 ? '✨ +100 XP' : '✨ +25 XP';
      }
      xpReward.textContent = xpText;

      // Show win streak if enabled
      if (gameConfig && gameConfig.showWinStreaks && data.winStreak && data.winStreak.newWinStreak > 1) {
        const streakDiv = document.createElement('div');
        streakDiv.className = 'win-streak';
        const icon = document.createElement('span');
        icon.className = 'win-streak-icon';
        icon.textContent = '🔥';
        streakDiv.appendChild(icon);
        streakDiv.appendChild(document.createTextNode(` ${data.winStreak.newWinStreak} Siege in Folge!`));
        xpReward.after(streakDiv);
      }

      // Show ELO changes if enabled
      if (gameConfig && gameConfig.eloEnabled && data.eloChanges) {
        const eloContainer = document.createElement('div');
        eloContainer.className = 'elo-changes';
        eloContainer.style.marginTop = '15px';
        eloContainer.style.fontSize = '16px';

        const appendEloChange = (player, change) => {
          if (!change) return;
          const row = document.createElement('div');
          row.style.margin = '5px 0';
          const name = document.createElement('strong');
          name.textContent = `${player.nickname || player.username || ''}: `;
          const delta = document.createElement('span');
          delta.style.color = change.change > 0 ? '#4CAF50' : '#f44336';
          delta.textContent = `${change.change > 0 ? '↑' : '↓'} ${Math.abs(change.change)} ELO`;
          const rating = document.createElement('span');
          rating.style.color = '#aaa';
          rating.textContent = ` (${change.newELO})`;
          row.append(name, delta, rating);
          if (change.isPeakELO) row.append(document.createTextNode(' 🌟 Neuer Rekord!'));
          eloContainer.appendChild(row);
        };
        appendEloChange(data.state.player1, data.eloChanges.player1);
        appendEloChange(data.state.player2, data.eloChanges.player2);

        xpReward.after(eloContainer);
      }

      resultDiv.classList.add('show');
      
      if (!authoritative) {
        // Legacy games still own their local result duration. Interactive
        // games are hidden only by a newer authoritative display revision.
        resultHideTimer = setTimeout(() => {
          resultHideTimer = null;
          resultDiv.classList.remove('show');
          containerHideTimer = setTimeout(() => {
            containerHideTimer = null;
            document.getElementById('game-container').classList.remove('active');
          }, 1000);
        }, 5000);
      }
    }

    function applyInteractiveSnapshot(state) {
      const display = state?.display;
      if (!display) return;
      const displayRevision = Number(display.displayRevision);
      const sessionRevision = Number(display.sessionRevision ?? display.result?.sessionRevision ?? -1);
      if (!Number.isFinite(displayRevision)) return;
      if (displayRevision < lastInteractiveDisplayRevision) return;
      if (
        displayRevision === lastInteractiveDisplayRevision &&
        sessionRevision <= lastInteractiveSessionRevision
      ) return;

      lastInteractiveDisplayRevision = displayRevision;
      lastInteractiveSessionRevision = sessionRevision;
      clearInteractivePresentation();
      if (display.gameType !== 'connect4') {
        interactiveSnapshotActive = false;
        currentSession = null;
        document.getElementById('game-container').classList.remove('active');
        return;
      }
      latestInteractiveQueueIdle = (state.hostQueue?.length || 0) === 0;
      interactiveSnapshotActive = ['playing', 'animating', 'result'].includes(display.phase);

      const snapshotState = display.state || display.result?.state;
      if (!interactiveSnapshotActive || !snapshotState) return;
      currentSession = Number(display.displaySessionId ?? display.result?.sessionId);
      const animationMs = Math.max(100, Math.min(2000, Number(display.config?.animationSpeed) || 500));
      document.documentElement.style.setProperty('--interactive-animation-ms', `${animationMs}ms`);
      applyConfig(display.config || gameConfig || {});
      updateBoard(snapshotState);
      updatePlayerInfo(snapshotState);
      updateStatus(snapshotState);
      document.getElementById('game-container').classList.add('active');

      if (display.phase === 'result' && display.result) {
        showResult({ ...display.result, state: snapshotState }, { authoritative: true });
      }
    }

    window.addEventListener('message', event => {
      if (event.origin !== window.location.origin) return;
      if (event.data?.type !== 'game-engine:interactive-snapshot') return;
      applyInteractiveSnapshot(event.data.payload);
    });

    socket.on('game-engine:interactive-state', applyInteractiveSnapshot);

    // Socket event handlers
    socket.on('game-engine:challenge-created', (data) => {
      console.log('Challenge created:', data);
      showChallengeScreen(data);
    });

    socket.on('game-engine:challenge-rejected', (data) => {
      console.log('Challenge rejected:', data);
      hideChallengeScreen();
    });

    socket.on('game-engine:game-started', (data) => {
      if (data.interactive || data.gameType !== 'connect4' || interactiveSnapshotActive) return;
      console.log('Game started:', data);
      hideChallengeScreen(); // Hide challenge screen when game starts

      // Play challenge accepted media if available
      if (data.media) {
        playMedia(data.media);
      }

      currentSession = data.sessionId;
      applyConfig(data.config);
      updateBoard(data.state);
      updatePlayerInfo(data.state);
      updateStatus(data.state);
      document.getElementById('game-container').classList.add('active');
    });

    socket.on('game-engine:move-made', (data) => {
      if (data.interactive || data.gameType !== 'connect4' || interactiveSnapshotActive) return;
      console.log('Move made:', data);
      if (data.sessionId === currentSession) {
        playSound('move');
        updateBoard(data.state);
        updatePlayerInfo(data.state);
        updateStatus(data.state);
      }
    });

    socket.on('game-engine:game-ended', (data) => {
      if (data.interactive || data.gameType !== 'connect4' || interactiveSnapshotActive) return;
      console.log('Game ended:', data);
      if (data.sessionId === currentSession) {
        updateBoard(data.state);
        updateStatus(data.state);
        showResult(data);
        currentSession = null;

        // Show leaderboard rotation after game ends
        setTimeout(() => {
          showLeaderboardRotation(data.gameType);
        }, 5500); // Wait for result screen to finish (5 seconds + 500ms buffer)
      }
    });

    socket.on('game-engine:config-updated', (data) => {
      console.log('Config updated:', data);
      if (data.gameType === 'connect4') {
        applyConfig(data.config);
      }
    });

    // Load initial configuration
    fetch('/api/game-engine/config/connect4')
      .then(res => res.json())
      .then(config => {
        applyConfig(config);
      })
      .catch(err => console.error('Failed to load config:', err));

    // Check for active session on load
    fetch('/api/game-engine/active-session')
      .then(res => res.json())
      .then(data => {
        if (data && data.gameType === 'connect4') {
          currentSession = data.sessionId;
          applyConfig(gameConfig || {});
          updateBoard(data.state);
          updatePlayerInfo(data.state);
          updateStatus(data.state);
          document.getElementById('game-container').classList.add('active');
        }
      })
      .catch(err => console.error('Failed to load active session:', err));

    // Initialize
    initializeBoard();

    // ============================================
    // TEST MODE FUNCTIONALITY
    // ============================================

    if (testMode) {
      console.log('🧪 Test mode enabled');
      document.getElementById('test-mode-controls').style.display = 'block';

      // Start test game button
      document.getElementById('test-start-game').addEventListener('click', async () => {
        try {
          const response = await fetch('/api/game-engine/manual/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              gameType: 'connect4',
              opponentType: 'manual',
              player1Name: 'Test Player 1',
              player2Name: 'Test Player 2'
            })
          });

          const data = await response.json();

          if (data.success) {
            testSessionId = data.sessionId;
            console.log('Test game started:', data);
            document.getElementById('test-start-game').style.display = 'none';
            document.getElementById('test-game-controls').style.display = 'block';
          } else {
            console.error('Failed to start test game:', data.error);
            alert(runtimeText('plugins.game-engine.runtime.connect4.test_start_failed', { error: data.error || data.message }));
          }
        } catch (error) {
          console.error('Error starting test game:', error);
          alert(runtimeText('plugins.game-engine.runtime.connect4.test_start_error', { error: error.message }));
        }
      });

      // Column buttons for making moves
      document.querySelectorAll('.test-column-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!testSessionId) {
            alert(runtimeText('plugins.game-engine.runtime.connect4.no_active_test_game'));
            return;
          }

          const column = btn.getAttribute('data-column');

          try {
            const response = await fetch('/api/game-engine/manual/move', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                sessionId: testSessionId,
                column: column
              })
            });

            const data = await response.json();

            if (!data.success) {
              console.error('Failed to make move:', data.error);
            }
          } catch (error) {
            console.error('Error making move:', error);
          }
        });
      });

      // End test game button
      document.getElementById('test-end-game').addEventListener('click', async () => {
        if (!testSessionId) {
          alert(runtimeText('plugins.game-engine.runtime.connect4.no_active_test_game'));
          return;
        }

        try {
          const response = await fetch('/api/game-engine/manual/end', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionId: testSessionId
            })
          });

          const data = await response.json();

          if (data.success) {
            testSessionId = null;
            document.getElementById('test-start-game').style.display = 'block';
            document.getElementById('test-game-controls').style.display = 'none';
            console.log('Test game ended');
          } else {
            console.error('Failed to end test game:', data.error);
          }
        } catch (error) {
          console.error('Error ending test game:', error);
        }
      });

      // Update current player display when move is made
      socket.on('game-engine:move-made', (data) => {
        if (data.sessionId === testSessionId && data.manual) {
          const currentPlayer = data.state.currentPlayer;
          document.getElementById('test-current-player').textContent = currentPlayer;
        }
      });

      // Reset test controls when game ends
      socket.on('game-engine:game-ended', (data) => {
        if (data.sessionId === testSessionId) {
          testSessionId = null;
          document.getElementById('test-start-game').style.display = 'block';
          document.getElementById('test-game-controls').style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
