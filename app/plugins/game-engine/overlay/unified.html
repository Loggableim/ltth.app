<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="plugins.game-engine.labels.unified_game_engine_overlay_ltth">Unified Game Engine Overlay - LTTH</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #unified-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .game-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--interactive-animation-ms, 300ms) ease-in-out;
    }

    .game-frame.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Idle state */
    #idle-state {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 300ms ease-in-out;
    }

    #idle-state.visible {
      opacity: 1;
    }

    .idle-message {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-family: 'Arial', sans-serif;
      font-size: 24px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    /* Queue indicator */
    #queue-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.85);
      padding: 15px 20px;
      border-radius: 12px;
      color: white;
      font-family: 'Arial', sans-serif;
      font-size: 14px;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(76, 175, 80, 0.3);
      display: none;
      z-index: 1000;
    }

    #queue-indicator.visible {
      display: block;
      animation: slideInRight 0.4s ease-out;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .queue-title {
      font-weight: 600;
      color: #4CAF50;
      margin-bottom: 5px;
    }

    .queue-item {
      font-size: 12px;
      color: #aaa;
      margin-top: 3px;
    }

    #interactive-matchup {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      min-width: 320px;
      padding: 12px 22px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      background: rgba(8, 12, 20, 0.88);
      color: #fff;
      font: 700 22px/1.2 Arial, sans-serif;
      text-align: center;
      text-shadow: 0 2px 5px #000;
      backdrop-filter: blur(10px);
      z-index: 1100;
    }

    #interactive-matchup.visible {
      display: block;
    }

    #interactive-active-player {
      display: block;
      margin-bottom: 7px;
      color: #ffe269;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .interactive-player-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .interactive-player {
      padding: 5px 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      color: #d6dfeb;
      font-size: 15px;
      font-weight: 700;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .interactive-player.is-active-player {
      border-color: #ffe269;
      background: rgba(255, 226, 105, 0.2);
      color: #fff9d6;
    }

    .interactive-player-separator {
      color: #8fa1b7;
      font-size: 14px;
      font-weight: 700;
    }

    #interactive-status {
      display: block;
      margin-top: 4px;
      color: #b9c6da;
      font-size: 12px;
      font-weight: 500;
    }

    </style>
    <script src="/js/i18n-client.js"></script>
</head>
<body>
  <div id="unified-container">
    <!-- Game iframes (lazy-loaded: src is set only when the game first becomes active) -->
    <iframe id="frame-connect4" class="game-frame" data-src="/overlay/game-engine/connect4"></iframe>
    <iframe id="frame-chess" class="game-frame" data-src="/overlay/game-engine/chess"></iframe>
    <iframe id="frame-plinko" class="game-frame" data-src="/overlay/game-engine/plinko"></iframe>
    <iframe id="frame-wheel" class="game-frame" data-src="/overlay/game-engine/wheel"></iframe>
    <iframe id="frame-slot" class="game-frame" data-src="/overlay/game-engine/slot"></iframe>

    <div id="interactive-matchup" aria-live="polite">
      <span id="interactive-active-player"></span>
      <div class="interactive-player-row">
        <span id="interactive-host-player" class="interactive-player"></span>
        <span class="interactive-player-separator">VS</span>
        <span id="interactive-viewer-player" class="interactive-player"></span>
      </div>
      <span id="interactive-status"></span>
    </div>
    
    <!-- Idle state -->
    <div id="idle-state" class="visible">
      <div class="idle-message" data-i18n="plugins.game-engine.labels.waiting_for_game">
        🎮 Waiting for game...
      </div>
    </div>

    <!-- Queue indicator -->
    <div id="queue-indicator">
      <div class="queue-title" data-i18n="plugins.game-engine.labels.queue">📋 Queue</div>
      <div id="queue-list"></div>
    </div>
  </div>

  <script>
    // Runtime i18n helpers: start
    function runtimeText(key, params = {}, fallback = '') {
      const normalizedKey = key.replace(/^plugins\.game-engine\.runtime\./, 'plugins.game-engine.ui.runtime.');
      const readableFallback = String(fallback || normalizedKey.split('.').pop().replace(/_/g, ' '))
        .replace(/\{(\w+)\}/g, (match, name) => params[name] == null ? match : String(params[name]));
      if (!window.i18n?.initialized) return readableFallback;
      const translated = window.i18n?.t?.(normalizedKey, params);
      return translated && translated !== normalizedKey ? translated : readableFallback;
    }

    function bindRuntimeI18nRerender(rerender) {
      const i18n = window.i18n;
      if (!i18n) return;
      i18n.ready?.then(rerender);
      i18n.onChange?.(rerender);
      i18n.onLanguageChange?.(rerender);
    }
    // Runtime i18n helpers: end

    const socket = io({ auth: { role: 'overlay' } });
    let currentGame = null;
    let latestInteractiveState = null;
    let lastInteractiveDisplayRevision = -1;
    let lastInteractiveSessionRevision = -1;
    let interactiveStatusInterval = null;
    let interactiveStateReceivedAt = 0;

    // Game switched event
    socket.on('game-engine:game-switched', (data) => {
      if (data.gameType === 'connect4' || data.gameType === 'chess') return;
      console.log('Game switched:', data);
      switchToGame(data.gameType);
    });

    // Game started event (backwards compatibility)
    socket.on('game-engine:game-started', (data) => {
      if (data.gameType === 'connect4' || data.gameType === 'chess') return;
      if (data.useUnified) {
        console.log('Game started (unified):', data);
        switchToGame(data.gameType);
      }
    });

    // Game ended event
    // Bug 1 fix: reset currentGame to null before the timeout so showIdleState() can fire
    socket.on('game-engine:game-ended', (data) => {
      if (data.gameType === 'connect4' || data.gameType === 'chess') return;
      console.log('Game ended:', data);
      currentGame = null;
      setTimeout(() => {
        if (!currentGame) {
          showIdleState();
        }
      }, 2000);
    });

    // Bug 2 fix: receive current state from backend when overlay loads/reconnects
    socket.on('game-engine:current-state', (data) => {
      if (latestInteractiveState?.display?.phase !== 'idle') return;
      if (data.hasActiveGame && data.useUnified) {
        switchToGame(data.gameType);
      } else {
        showIdleState();
      }
    });

    // Queue update events (individual game-type queued events)
    socket.on('unified-queue:connect4-queued', (data) => {
      console.log('Connect4 queued:', data);
      updateQueueFromEvent(data);
    });

    socket.on('unified-queue:chess-queued', (data) => {
      console.log('Chess queued:', data);
      updateQueueFromEvent(data);
    });

    socket.on('unified-queue:plinko-queued', (data) => {
      console.log('Plinko queued:', data);
      updateQueueFromEvent(data);
    });

    socket.on('unified-queue:wheel-queued', (data) => {
      console.log('Wheel queued:', data);
      updateQueueFromEvent(data);
    });

    // Bug 4 fix: listen to authoritative queue status and cleared events
    socket.on('unified-queue:status', (data) => {
      updateQueueIndicator(data.queueLength || 0);
    });

    socket.on('unified-queue:cleared', () => {
      updateQueueIndicator(0);
    });

    // Idle event
    socket.on('game-engine:idle', () => {
      if (latestInteractiveState?.display?.phase !== 'idle') return;
      showIdleState();
    });

    function interactiveOverlayPresentation(state) {
      const display = state?.display;
      if (!display) return null;

      const ownsDisplay = ['playing', 'animating', 'result', 'leaderboard'].includes(display.phase) &&
        (display.gameType === 'connect4' || display.gameType === 'chess');
      return ownsDisplay ? state : null;
    }

    socket.on('game-engine:interactive-state', (state) => {
      const display = state?.display;
      if (!display || !Number.isFinite(Number(display.displayRevision))) return;
      const incomingDisplayRevision = Number(display.displayRevision);
      const incomingSessionRevision = Number.isFinite(Number(display.sessionRevision))
        ? Number(display.sessionRevision)
        : -1;
      if (incomingDisplayRevision < lastInteractiveDisplayRevision) return;
      if (
        incomingDisplayRevision === lastInteractiveDisplayRevision &&
        incomingSessionRevision <= lastInteractiveSessionRevision
      ) return;
      lastInteractiveDisplayRevision = incomingDisplayRevision;
      lastInteractiveSessionRevision = incomingSessionRevision;

      const interactiveState = interactiveOverlayPresentation(state);
      latestInteractiveState = interactiveState || state;
      interactiveStateReceivedAt = Date.now();

      if (!interactiveState) {
        hideInteractiveMatchup();
        if (currentGame === 'connect4' || currentGame === 'chess') showIdleState();
        updateQueueIndicator(state.hostQueue?.length || 0);
        return;
      }

      const presentationDisplay = interactiveState.display;
      const animationMs = Math.max(100, Math.min(2000, Number(presentationDisplay.config?.animationSpeed) || 500));
      document.documentElement.style.setProperty('--interactive-animation-ms', `${animationMs}ms`);
      if (presentationDisplay.phase === 'leaderboard') {
        hideInteractiveMatchup();
      } else {
        showInteractiveMatchup(
          presentationDisplay,
          presentationDisplay.activeSessionCount ?? state.hostQueue?.length ?? 0
        );
      }
      switchToGame(presentationDisplay.gameType, interactiveState);
      updateQueueIndicator(state.hostQueue?.length || 0);
    });

    // Bug 5 fix: lazy-load iframe src only when the game first becomes active
    function switchToGame(gameType, interactiveState = null) {
      // Hide all frames
      document.querySelectorAll('.game-frame').forEach(frame => {
        frame.classList.remove('active');
      });

      // Hide idle state
      document.getElementById('idle-state').classList.remove('visible');

      // Show active game frame
      const frame = document.getElementById(`frame-${gameType}`);
      if (frame) {
        // Load iframe content only on first activation to save resources
        if (!frame.dataset.loaded) {
          frame.src = frame.dataset.src;
          frame.dataset.loaded = 'true';
        }
        frame.classList.add('active');
        currentGame = gameType;
        if (interactiveState) forwardInteractiveSnapshot(frame, interactiveState);
      } else {
        console.error('Unknown game type:', gameType);
        showIdleState();
      }
    }

    function showIdleState() {
      // Hide all frames
      document.querySelectorAll('.game-frame').forEach(frame => {
        frame.classList.remove('active');
      });

      // Show idle state
      document.getElementById('idle-state').classList.add('visible');
      hideInteractiveMatchup();
      currentGame = null;
    }

    function showInteractiveMatchup(display, queueLength) {
      const matchup = document.getElementById('interactive-matchup');
      const hostName = display.hostDisplayName || runtimeText('plugins.game-engine.runtime.dashboard.host');
      const viewerName = display.viewerDisplayName || runtimeText('plugins.game-engine.runtime.dashboard.player');
      const activeRole = ['host', 'viewer'].includes(display.currentTurnRole)
        ? display.currentTurnRole
        : null;
      const activePlayerName = display.activePlayerDisplayName || (activeRole === 'host'
        ? hostName
        : activeRole === 'viewer'
          ? viewerName
          : '');
      const hostPlayer = document.getElementById('interactive-host-player');
      const viewerPlayer = document.getElementById('interactive-viewer-player');
      const activePlayer = document.getElementById('interactive-active-player');
      hostPlayer.textContent = hostName;
      viewerPlayer.textContent = viewerName;
      hostPlayer.classList.toggle('is-active-player', activeRole === 'host');
      viewerPlayer.classList.toggle('is-active-player', activeRole === 'viewer');
      activePlayer.textContent = activePlayerName
        ? runtimeText('plugins.game-engine.runtime.unified.active_turn', { player: activePlayerName })
        : '';
      activePlayer.hidden = !activePlayerName;
      if (interactiveStatusInterval) clearInterval(interactiveStatusInterval);
      const renderStatus = () => {
        const elapsedMs = Date.now() - interactiveStateReceivedAt;
        let phaseLabel = display.phase === 'result'
          ? runtimeText('plugins.game-engine.runtime.unified.phase_result')
          : display.currentTurnRole === 'host'
            ? runtimeText('plugins.game-engine.runtime.unified.phase_host_turn')
            : runtimeText('plugins.game-engine.runtime.unified.phase_viewer_turn');
        if (
          display.gameType === 'chess' &&
          display.currentTurnRole === 'host' &&
          display.hostTimeRemainingMs != null &&
          Number.isFinite(Number(display.hostTimeRemainingMs))
        ) {
          phaseLabel += ` · ${formatClock(Number(display.hostTimeRemainingMs) - elapsedMs)}`;
        }
        document.getElementById('interactive-status').textContent =
          runtimeText('plugins.game-engine.runtime.unified.status', {
            game: display.gameType === 'chess'
              ? runtimeText('plugins.game-engine.runtime.dashboard.game_chess')
              : runtimeText('plugins.game-engine.runtime.dashboard.game_connect4'),
            phase: phaseLabel,
            count: queueLength
          });
      };
      renderStatus();
      if (display.phase === 'playing') interactiveStatusInterval = setInterval(renderStatus, 250);
      matchup.classList.add('visible');
    }

    function rerenderUnifiedRuntimeText() {
      const display = latestInteractiveState?.display;
      if (!display) return;
      const queueLength = display.activeSessionCount ?? latestInteractiveState.hostQueue?.length ?? 0;
      if (display.phase !== 'leaderboard' && display.phase !== 'idle') {
        showInteractiveMatchup(display, queueLength);
      }
      updateQueueIndicator(queueLength);
    }

    bindRuntimeI18nRerender(rerenderUnifiedRuntimeText);

    function hideInteractiveMatchup() {
      if (interactiveStatusInterval) clearInterval(interactiveStatusInterval);
      interactiveStatusInterval = null;
      document.getElementById('interactive-matchup').classList.remove('visible');
    }

    function formatClock(milliseconds) {
      const seconds = Math.max(0, Math.ceil(milliseconds / 1000));
      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function forwardInteractiveSnapshot(frame, state) {
      const send = payload => frame.contentWindow?.postMessage({
        type: 'game-engine:interactive-snapshot',
        payload
      }, window.location.origin);
      if (frame.dataset.ready === 'true') {
        send(state);
      } else if (frame.dataset.waitingForLoad !== 'true') {
        frame.dataset.waitingForLoad = 'true';
        frame.addEventListener('load', () => {
          frame.dataset.ready = 'true';
          frame.dataset.waitingForLoad = 'false';
          if (latestInteractiveState) send(latestInteractiveState);
        }, { once: true });
      }
    }

    // Bug 4 fix: driven by authoritative backend events (unified-queue:status / unified-queue:cleared)
    function updateQueueIndicator(queueLength) {
      const indicator = document.getElementById('queue-indicator');
      const list = document.getElementById('queue-list');

      if (queueLength > 0) {
        indicator.classList.add('visible');
        list.innerHTML = `<div class="queue-item">${runtimeText('plugins.game-engine.runtime.unified.queue_count', { count: queueLength })}</div>`;
      } else {
        indicator.classList.remove('visible');
      }
    }

    function updateQueueFromEvent(data) {
      updateQueueIndicator(data.queueLength || 0);
    }

    // Request initial state so the overlay shows correctly on load/refresh (Bug 2)
    socket.emit('game-engine:request-state');

    console.log('Unified Game Engine Overlay loaded');
  </script>
</body>
</html>
